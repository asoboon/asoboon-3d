<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#184d63">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>BOON FIT — RELIC CIRCLE</title>
<!-- BOON FIT v1: no-grid irregular shape fitting puzzle -->
<style>
:root{
  --sky:#2b7187;--sky2:#153c52;--stone:#c9b994;--stone2:#887957;--ink:#173a46;
  --gold1:#fff2a6;--gold2:#e8bd4c;--gold3:#93671d;
  --p0:linear-gradient(145deg,#ff7769,#ce423e);
  --p1:linear-gradient(145deg,#62d59d,#26956a);
  --p2:linear-gradient(145deg,#73ccff,#2b8fc4);
  --p3:linear-gradient(145deg,#ffd76c,#d59b27);
  --p4:linear-gradient(145deg,#b998ff,#7556c7);
  --p5:linear-gradient(145deg,#ff9ed0,#cf5c98);
  --p6:linear-gradient(145deg,#8de36c,#4ca23a);
  --p7:linear-gradient(145deg,#ffad62,#d7662e);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden}
body{
  min-height:100%;overscroll-behavior:none;user-select:none;-webkit-user-select:none;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#fff;
  background:
    radial-gradient(circle at 82% 11%,rgba(255,230,145,.88) 0 5%,rgba(255,230,145,.16) 6%,transparent 12%),
    radial-gradient(ellipse at 28% 23%,rgba(105,234,205,.14),transparent 35%),
    radial-gradient(ellipse at 70% 34%,rgba(132,164,255,.13),transparent 38%),
    linear-gradient(180deg,var(--sky),#245d75 30%,var(--sky2) 64%,#173b35 100%);
}
body::before,body::after{
  content:"";position:fixed;z-index:0;pointer-events:none;bottom:-80px;width:210px;height:260px;
  background:
    radial-gradient(ellipse at 45% 62%,#294f3c 0 28%,transparent 29%),
    radial-gradient(ellipse at 42% 40%,#37634b 0 24%,transparent 25%),
    radial-gradient(ellipse at 50% 22%,#467457 0 17%,transparent 18%);
  opacity:.8;filter:drop-shadow(0 10px 10px rgba(7,25,28,.25))
}
body::before{left:-65px;transform:rotate(-6deg)}
body::after{right:-65px;transform:scaleX(-1) rotate(-6deg)}
button{font:inherit;touch-action:manipulation}
.app{
  position:relative;z-index:1;width:min(460px,100%);height:100dvh;margin:0 auto;
  padding:calc(7px + env(safe-area-inset-top)) 8px calc(7px + env(safe-area-inset-bottom));
  display:flex;flex-direction:column;overflow:hidden
}
.top{display:flex;align-items:center;justify-content:space-between;gap:5px;margin-bottom:6px;flex:0 0 auto}
.brand-wrap{display:flex;align-items:center;gap:7px;min-width:0}
.brand-mark{
  width:38px;height:38px;flex:0 0 auto;border-radius:50%;
  background:conic-gradient(from 22.5deg,#ffcf61,#65d1ac,#6ec6ff,#b692ff,#ff83ba,#ffcf61);
  border:3px solid rgba(255,255,255,.72);box-shadow:inset 0 0 0 4px rgba(31,79,90,.18),0 5px 0 rgba(15,48,57,.24);
  position:relative
}
.brand-mark::after{
  content:"";position:absolute;inset:9px;border-radius:50%;background:linear-gradient(145deg,#fff3af,#d6a83c);
  box-shadow:0 0 8px rgba(255,224,108,.55)
}
.brand{font-size:18px;font-weight:1000;line-height:.95;letter-spacing:.04em;text-shadow:0 2px 0 #143b4b;white-space:nowrap}
.sub{display:inline-block;margin-top:4px;padding:2px 7px;border-radius:999px;background:#174254;color:#ffe28d;font-size:8px;font-weight:1000;letter-spacing:.12em}
.top-right{display:flex;align-items:center;gap:4px}
.stats{display:grid;grid-template-columns:repeat(2,auto);gap:4px}
.stat{min-width:45px;padding:4px 5px;border-radius:11px;text-align:center;background:linear-gradient(#f7fcff,#d5edf4);color:var(--ink);box-shadow:inset 0 2px #fff,0 3px 0 rgba(18,61,74,.13)}
.stat b{display:block;font-size:12px}.stat span{display:block;font-size:7px;color:#678592;font-weight:1000}
.hint-mini,.reset-mini{height:39px;border:0;border-radius:12px;padding:0;font-weight:1000;box-shadow:inset 0 2px rgba(255,255,255,.42),0 4px 0 rgba(37,64,37,.18)}
.hint-mini{width:50px;background:linear-gradient(#ffe789,#eeb338);color:#5a4210;font-size:8px}
.hint-mini span{display:block;font-size:9px;margin-top:2px}
.reset-mini{width:39px;background:linear-gradient(#74d993,#36a560);color:#123e29;font-size:17px}
.quest{
  flex:0 0 auto;margin-bottom:5px;padding:6px 8px;border-radius:12px;text-align:center;
  background:linear-gradient(180deg,rgba(243,251,253,.97),rgba(211,234,240,.97));
  color:#174b5d;font-size:9px;font-weight:1000;border:2px solid rgba(55,110,129,.14);
  box-shadow:inset 0 2px 0 #fff,0 3px 0 rgba(19,57,70,.10)
}
.quest strong{color:#c84c44}
.board-wrap{
  position:relative;flex:0 0 auto;margin:0 auto;padding:10px;border-radius:50%;
  background:linear-gradient(145deg,#dbcda9,#aa9870 58%,#756543);
  border:5px solid #65583c;
  box-shadow:inset 0 5px 0 rgba(255,255,255,.38),inset 0 -7px 0 rgba(64,49,26,.14),0 10px 0 rgba(18,47,52,.22),0 0 25px rgba(118,225,234,.13)
}
.board-wrap::before{
  content:"";position:absolute;inset:-10px;border:4px dashed rgba(255,226,127,.36);border-radius:50%;pointer-events:none
}
.board{
  --board:292px;position:relative;width:var(--board);height:var(--board);border-radius:50%;overflow:hidden;touch-action:none;
  background:
    radial-gradient(circle at 50% 50%,rgba(255,244,188,.16) 0 4%,transparent 5%),
    repeating-radial-gradient(circle,rgba(78,65,40,.04) 0 2px,transparent 3px 13px),
    linear-gradient(145deg,#cabd9b,#9c8c68);
  border:4px solid #6e6041;
  box-shadow:inset 0 0 0 3px rgba(255,255,255,.16),inset 0 10px 25px rgba(69,56,31,.16)
}
.rune{
  position:absolute;left:50%;top:50%;width:58%;height:58%;transform:translate(-50%,-50%);
  border:2px solid rgba(255,228,136,.19);border-radius:50%;pointer-events:none
}
.rune::before,.rune::after{
  content:"";position:absolute;left:50%;top:50%;width:118%;height:2px;background:rgba(255,229,143,.14);transform:translate(-50%,-50%) rotate(22.5deg)
}
.rune::after{transform:translate(-50%,-50%) rotate(-22.5deg)}
.socket,.board-piece{
  position:absolute;width:64px;height:64px;border:0;padding:0;transform-origin:50% 50%;touch-action:none
}
.socket{
  background:rgba(64,67,60,.18);filter:drop-shadow(0 2px 0 rgba(255,255,255,.18));
  outline:2px solid rgba(70,72,60,.16);outline-offset:-2px
}
.socket::after{
  content:"";position:absolute;inset:8px;background:rgba(255,246,206,.11);clip-path:inherit
}
.socket.hint{filter:drop-shadow(0 0 8px rgba(255,229,96,.95));background:rgba(255,221,91,.28);animation:pulse .7s ease-in-out infinite alternate}
.board-piece{
  z-index:5;filter:drop-shadow(0 4px 2px rgba(41,51,42,.22));transition:left .16s ease,top .16s ease,transform .16s ease,filter .16s
}
.board-piece::after,.tray-shape::after,.drag-shape::after{
  content:"";position:absolute;left:15%;top:10%;width:45%;height:15%;border-radius:99px;background:rgba(255,255,255,.28);transform:rotate(-10deg)
}
.board-piece.pop{animation:lock .24s ease-out}
@keyframes lock{0%{scale:.78;filter:brightness(1.5)}70%{scale:1.08}100%{scale:1}}
@keyframes pulse{from{filter:drop-shadow(0 0 4px rgba(255,229,96,.6))}to{filter:drop-shadow(0 0 12px rgba(255,229,96,1))}}
.shape-triangle{clip-path:polygon(50% 2%,98% 94%,4% 94%)}
.shape-diamond{clip-path:polygon(50% 0,100% 42%,66% 100%,10% 79%,0 30%)}
.shape-shield{clip-path:polygon(50% 0,94% 18%,84% 67%,50% 100%,16% 67%,6% 18%)}
.shape-bolt{clip-path:polygon(58% 0,20% 53%,48% 53%,35% 100%,84% 39%,56% 39%)}
.shape-boom{clip-path:polygon(0 5%,45% 28%,94% 4%,62% 48%,99% 92%,45% 70%,10% 100%,28% 56%)}
.shape-cross{clip-path:polygon(34% 0,66% 0,66% 32%,100% 32%,100% 66%,66% 66%,66% 100%,34% 100%,34% 66%,0 66%,0 32%,34% 32%)}
.shape-drop{clip-path:polygon(50% 0,78% 30%,96% 60%,82% 88%,50% 100%,18% 88%,4% 60%,22% 30%)}
.shape-crown{clip-path:polygon(0 25%,24% 45%,37% 4%,54% 44%,78% 0,100% 26%,88% 92%,10% 100%)}
.board.clearing .socket{background:rgba(255,220,87,.20)}
.board.clearing .board-piece{
  background:linear-gradient(145deg,var(--gold1),var(--gold2) 55%,var(--gold3))!important;
  animation:golden .7s ease-out forwards;animation-delay:var(--delay,0ms)
}
@keyframes golden{0%{filter:brightness(1)}45%{filter:brightness(1.75) drop-shadow(0 0 12px #ffe27b)}100%{filter:brightness(1.08) drop-shadow(0 0 6px rgba(255,221,98,.55))}}
.msg{
  flex:0 0 auto;min-height:21px;margin:6px 1px 0;padding:2px 7px;border-radius:999px;
  background:rgba(238,249,252,.92);color:#174b5d;font-size:10px;line-height:17px;text-align:center;font-weight:1000;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis
}
.msg.ok{background:rgba(220,249,227,.94);color:#1c5c3b}.msg.bad{background:rgba(255,225,225,.94);color:#913333}
.guide{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:6px;flex:0 0 auto}
.guide div{padding:4px 1px;border-radius:10px;background:rgba(240,250,253,.91);color:#68838f;text-align:center;font-size:7px;box-shadow:0 2px 0 rgba(20,58,70,.08)}
.guide b{display:block;color:#c24a42;font-size:8px;margin-bottom:1px}
.tray-head{display:flex;align-items:center;justify-content:space-between;margin:6px 3px 4px;flex:0 0 auto;font-size:10px;font-weight:1000}
.tray-head span{background:#174654;color:#ffe28d;border-radius:999px;padding:2px 8px}
.tray{display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(2,64px);gap:5px;flex:0 0 auto}
.piece{
  position:relative;border:2px solid rgba(60,111,127,.14);border-radius:14px;background:linear-gradient(#f6fcfe,#d7eaf0);
  box-shadow:inset 0 3px #fff,0 4px 0 rgba(23,63,75,.11);overflow:hidden;touch-action:none
}
.piece.selected{outline:3px solid #ffd85f;outline-offset:1px}
.piece.placed{opacity:.30}
.piece-name{position:absolute;left:5px;top:5px;color:#3a6270;font-size:6px;font-weight:1000;letter-spacing:.02em}
.tray-shape{position:absolute;left:50%;top:54%;width:42px;height:42px;transform:translate(-50%,-50%);transform-origin:50% 50%}
.drag-shape{
  position:fixed;z-index:35;left:0;top:0;width:68px;height:68px;display:none;pointer-events:none;
  transform:translate(-50%,-115%);filter:drop-shadow(0 10px 8px rgba(26,43,45,.28));transform-origin:50% 50%
}
.drag-shape.show{display:block}
.hold-ring{position:fixed;z-index:36;width:56px;height:56px;left:0;top:0;transform:translate(-50%,-50%);pointer-events:none;opacity:0}
.hold-ring.show{opacity:1}
.hold-ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.hold-ring circle{fill:none;stroke-width:5}.hold-ring .track{stroke:rgba(14,58,67,.32)}.hold-ring .prog{stroke:#ffe36c;stroke-dasharray:138.2;stroke-dashoffset:138.2;stroke-linecap:round}
.hold-ring.show .prog{animation:hold .52s linear forwards}@keyframes hold{to{stroke-dashoffset:0}}
.overlay{position:fixed;z-index:50;inset:0;display:none;align-items:center;justify-content:center;padding:24px;background:rgba(7,34,45,.82);backdrop-filter:blur(5px)}
.overlay.show{display:flex}
.card{width:min(350px,100%);padding:25px;border-radius:27px;text-align:center;background:linear-gradient(#f9fdff,#d8edf3);border:4px solid #d7a43d;box-shadow:inset 0 4px #fff,0 12px 0 rgba(20,57,68,.14),0 25px 70px rgba(3,28,39,.34)}
.medal{width:86px;height:86px;margin:0 auto 8px;border-radius:50%;background:conic-gradient(#ffe990,#e9b93e,#fff1a6,#b97d21,#ffe990);box-shadow:inset 0 0 0 10px rgba(255,255,255,.22),0 0 22px rgba(255,214,83,.55)}
.card h2{margin:0;color:#b67b22;font-size:28px}.card p{color:#315f70;font-weight:1000}.card button{width:100%;height:49px;border:0;border-radius:15px;background:linear-gradient(#72d993,#36a560);color:#123f29;font-weight:1000;box-shadow:inset 0 3px rgba(255,255,255,.35),0 5px 0 rgba(33,100,61,.24)}
@media(max-width:370px){
  .board{--board:262px}.socket,.board-piece{width:58px;height:58px}
  .tray{grid-template-rows:repeat(2,57px)}.tray-shape{width:38px;height:38px}
  .brand{font-size:16px}.stat{min-width:42px;padding:3px 4px}
}
</style>
</head>
<body>
<main class="app">
  <header class="top">
    <div class="brand-wrap"><div class="brand-mark"></div><div><div class="brand">BOON FIT</div><div class="sub">RELIC CIRCLE</div></div></div>
    <div class="top-right">
      <div class="stats"><div class="stat"><b id="time">00:00</b><span>TIME</span></div><div class="stat"><b id="moves">0</b><span>MOVE</span></div></div>
      <button id="hint" class="hint-mini" type="button">💡 HINT<span id="hintCount">0</span></button>
      <button id="reset" class="reset-mini" type="button">↺</button>
    </div>
  </header>

  <div class="quest"><strong>NO GRID</strong> — 8つの異形ブロックを円形遺跡にはめ込もう！</div>

  <section class="board-wrap">
    <div id="board" class="board"><div class="rune" aria-hidden="true"></div></div>
  </section>

  <div id="msg" class="msg">形と向きを見て、ぴったりの穴を探そう！</div>

  <div class="guide">
    <div><b>↻ タップ</b>45°回転</div>
    <div><b>↔ フリック</b>反転</div>
    <div><b>☝ ドラッグ</b>はめる</div>
    <div><b>◉ 長押し</b>戻す</div>
  </div>

  <div class="tray-head"><strong>RELIC PIECES</strong><span><b id="count">0</b> / 8</span></div>
  <section id="tray" class="tray"></section>
</main>

<div id="dragShape" class="drag-shape"></div>
<div id="holdRing" class="hold-ring"><svg viewBox="0 0 56 56"><circle class="track" cx="28" cy="28" r="22"/><circle class="prog" cx="28" cy="28" r="22"/></svg></div>
<div id="overlay" class="overlay"><div class="card"><div class="medal"></div><h2>PERFECT FIT!</h2><p id="clearText"></p><button id="again" type="button">もういちど遊ぶ！</button></div></div>

<script>
(()=> {
const $=s=>document.querySelector(s);
const board=$("#board"),tray=$("#tray"),msg=$("#msg"),timeEl=$("#time"),movesEl=$("#moves"),countEl=$("#count"),hintCountEl=$("#hintCount");
const overlay=$("#overlay"),clearText=$("#clearText"),dragShape=$("#dragShape"),holdRing=$("#holdRing");

const defs=[
 {id:"A",name:"TRI",shape:"triangle",x:.19,y:.16,color:"var(--p0)"},
 {id:"B",name:"GEM",shape:"diamond",x:.57,y:.13,color:"var(--p1)"},
 {id:"C",name:"SHIELD",shape:"shield",x:.70,y:.37,color:"var(--p2)"},
 {id:"D",name:"BOLT",shape:"bolt",x:.61,y:.66,color:"var(--p3)"},
 {id:"E",name:"BOOM",shape:"boom",x:.31,y:.68,color:"var(--p4)"},
 {id:"F",name:"CROSS",shape:"cross",x:.08,y:.43,color:"var(--p5)"},
 {id:"G",name:"DROP",shape:"drop",x:.35,y:.38,color:"var(--p6)"},
 {id:"H",name:"CROWN",shape:"crown",x:.43,y:.52,color:"var(--p7)"}
];
const byId=Object.fromEntries(defs.map(d=>[d.id,d]));
const pieces={};
const initialRot={A:3,B:5,C:1,D:6,E:2,F:7,G:4,H:1};
const initialFlip={A:false,B:false,C:true,D:false,E:true,F:false,G:false,H:true};
defs.forEach(d=>pieces[d.id]={placed:false,rot:initialRot[d.id],flip:initialFlip[d.id]});

let selected="A",moves=0,hints=0,start=0,timer=null,gesture=null,drag=null,longTimer=null,clearing=false,hintId=null;
const TAP=10,DRAG=13,FLICK=46,FLICK_T=290,FLICK_RATIO=1.4,LONG=520,LONG_MOVE=9;

function haptic(ms=12){if(navigator.vibrate)navigator.vibrate(ms)}
function fmt(ms){const s=Math.floor(ms/1000),m=Math.floor(s/60);return String(m).padStart(2,"0")+":"+String(s%60).padStart(2,"0")}
function startClock(){if(start)return;start=Date.now();timer=setInterval(()=>timeEl.textContent=fmt(Date.now()-start),500)}
function setMsg(t,k=""){msg.textContent=t;msg.className="msg"+(k?" "+k:"")}
function transformString(p,base=""){
  const flip=p.flip?-1:1;
  return base+" rotate("+(p.rot*45)+"deg) scaleX("+flip+")"
}
function socketPx(d){
  const s=board.clientWidth,w=window.innerWidth<=370?58:64;
  return {left:Math.round(d.x*s),top:Math.round(d.y*s),w}
}
function atCorrectOrientation(id){
  const p=pieces[id];
  return p.rot%8===0&&!p.flip
}
function canSnap(id,x,y){
  const d=byId[id],r=board.getBoundingClientRect(),s=board.clientWidth,w=window.innerWidth<=370?58:64;
  const cx=r.left+d.x*s+w/2,cy=r.top+d.y*s+w/2;
  return Math.hypot(x-cx,y-cy)<w*.72&&atCorrectOrientation(id)
}
function renderBoard(){
  board.querySelectorAll(".socket,.board-piece").forEach(n=>n.remove());
  defs.forEach((d,i)=>{
    const pos=socketPx(d),s=document.createElement("div");
    s.className="socket shape-"+d.shape+(hintId===d.id&&!pieces[d.id].placed?" hint":"");
    s.style.left=pos.left+"px";s.style.top=pos.top+"px";board.appendChild(s);
    if(pieces[d.id].placed){
      const p=pieces[d.id],b=document.createElement("button");b.type="button";
      b.className="board-piece shape-"+d.shape;
      b.style.left=pos.left+"px";b.style.top=pos.top+"px";b.style.background=d.color;
      b.style.transform=transformString(p);
      if(clearing)b.style.setProperty("--delay",(i*65)+"ms");
      b.addEventListener("pointerdown",e=>begin(d.id,e));board.appendChild(b)
    }
  });
  if(clearing)board.classList.add("clearing");else board.classList.remove("clearing")
}
function renderTray(){
  tray.innerHTML="";
  defs.forEach(d=>{
    const p=pieces[d.id],b=document.createElement("button");b.type="button";b.className="piece"+(selected===d.id?" selected":"")+(p.placed?" placed":"");
    const n=document.createElement("span");n.className="piece-name";n.textContent=d.name;b.appendChild(n);
    const sh=document.createElement("span");sh.className="tray-shape shape-"+d.shape;sh.style.background=d.color;sh.style.transform=transformString(p,"translate(-50%,-50%)");b.appendChild(sh);
    b.addEventListener("pointerdown",e=>begin(d.id,e));tray.appendChild(b)
  });
  countEl.textContent=defs.filter(d=>pieces[d.id].placed).length
}
function render(){renderBoard();renderTray()}

function resetHint(){hintId=null}
function useHint(){
  const d=defs.find(x=>!pieces[x.id].placed);
  if(!d){setMsg("全部はまってるよ！","ok");return}
  hintId=d.id;selected=d.id;hints++;hintCountEl.textContent=hints;render();
  setMsg(d.name+" の穴を黄色く光らせたよ。向きも合わせよう！","ok");haptic()
}

function rotate(id){
  resetHint();selected=id;
  const p=pieces[id];if(p.placed){setMsg("はめたピースは長押しで戻せるよ");return}
  p.rot=(p.rot+1)%8;render();setMsg("くるっ！ 45°回転","ok");haptic()
}
function flip(id){
  resetHint();selected=id;
  const p=pieces[id];if(p.placed){setMsg("はめたピースは長押しで戻せるよ");return}
  p.flip=!p.flip;render();setMsg("ひっくり返した！","ok");haptic()
}
function returnToTray(id){
  resetHint();pieces[id].placed=false;selected=id;render();setMsg(byId[id].name+" を下に戻したよ","ok");haptic(16)
}
function showHold(x,y){
  holdRing.style.left=x+"px";holdRing.style.top=y+"px";holdRing.classList.remove("show");void holdRing.offsetWidth;holdRing.classList.add("show")
}
function clearHold(){clearTimeout(longTimer);longTimer=null;holdRing.classList.remove("show")}

function begin(id,e){
  if(e.pointerType==="mouse"&&e.button!==0)return;e.preventDefault();selected=id;
  const p=pieces[id];
  gesture={id,pid:e.pointerId,x:e.clientX,y:e.clientY,lx:e.clientX,ly:e.clientY,t:performance.now(),dragging:false,wasPlaced:p.placed};
  if(p.placed){
    showHold(e.clientX,e.clientY);
    longTimer=setTimeout(()=>{
      if(gesture&&!gesture.dragging){
        gesture=null;holdRing.classList.remove("show");returnToTray(id)
      }
    },LONG)
  }
  renderTray()
}
function beginDrag(){
  if(!gesture||gesture.dragging)return;clearHold();resetHint();gesture.dragging=true;
  const id=gesture.id,p=pieces[id],d=byId[id];selected=id;
  if(p.placed)p.placed=false;
  drag={id,wasPlaced:gesture.wasPlaced};
  dragShape.className="drag-shape show shape-"+d.shape;dragShape.style.background=d.color;dragShape.style.transform=transformString(p,"translate(-50%,-115%)");
  render()
}
function move(e){
  if(!gesture||e.pointerId!==gesture.pid)return;e.preventDefault();
  gesture.lx=e.clientX;gesture.ly=e.clientY;
  const dx=e.clientX-gesture.x,dy=e.clientY-gesture.y,dist=Math.hypot(dx,dy);
  if(dist>LONG_MOVE)clearHold();
  if(!gesture.dragging&&dist>=DRAG)beginDrag();
  if(gesture&&gesture.dragging){
    dragShape.style.left=e.clientX+"px";dragShape.style.top=e.clientY+"px";
    const ok=canSnap(gesture.id,e.clientX,e.clientY);
    setMsg(ok?"ぴったり！ 離してはめよう":(atCorrectOrientation(gesture.id)?"穴の形を探そう":"向きが違うみたい"),ok?"ok":"")
  }
}
function finish(e){
  if(!gesture||e.pointerId!==gesture.pid)return;clearHold();
  const g=gesture,dx=e.clientX-g.x,dy=e.clientY-g.y,ax=Math.abs(dx),ay=Math.abs(dy),dist=Math.hypot(dx,dy),dt=performance.now()-g.t;
  const isFlick=ax>=FLICK&&dt<=FLICK_T&&ax>ay*FLICK_RATIO;
  if(isFlick){
    if(g.dragging&&g.wasPlaced)pieces[g.id].placed=true;
    dragShape.classList.remove("show");drag=null;gesture=null;flip(g.id);return
  }
  if(g.dragging){
    const ok=canSnap(g.id,e.clientX,e.clientY);
    dragShape.classList.remove("show");drag=null;gesture=null;
    if(ok){
      startClock();pieces[g.id].placed=true;pieces[g.id].rot=0;pieces[g.id].flip=false;moves++;movesEl.textContent=moves;
      render();setMsg("カチッ！ "+byId[g.id].name+" がはまった！","ok");haptic(18);checkClear()
    }else{
      if(g.wasPlaced)pieces[g.id].placed=true;
      render();setMsg("そこじゃないよ。形と向きを見よう！","bad");haptic(10)
    }
    return
  }
  gesture=null;if(dist<=TAP)rotate(g.id)
}
function checkClear(){
  if(!defs.every(d=>pieces[d.id].placed))return;
  clearInterval(timer);if(start)timeEl.textContent=fmt(Date.now()-start);clearing=true;render();
  setMsg("カチャッ！ 8つの異形ブロックがひとつの遺跡になった！","ok");
  clearText.textContent="TIME "+timeEl.textContent+" / MOVE "+moves+" / HINT "+hints;
  haptic(40);setTimeout(()=>overlay.classList.add("show"),1050)
}
function reset(){
  clearInterval(timer);clearHold();start=0;timer=null;moves=0;hints=0;clearing=false;gesture=null;drag=null;hintId=null;
  timeEl.textContent="00:00";movesEl.textContent="0";hintCountEl.textContent="0";overlay.classList.remove("show");dragShape.classList.remove("show");
  defs.forEach(d=>{pieces[d.id].placed=false;pieces[d.id].rot=initialRot[d.id];pieces[d.id].flip=initialFlip[d.id]});
  selected="A";render();setMsg("形と向きを見て、ぴったりの穴を探そう！")
}

window.addEventListener("pointermove",move,{passive:false});
window.addEventListener("pointerup",finish);
window.addEventListener("pointercancel",e=>{
  if(!gesture||e.pointerId!==gesture.pid)return;clearHold();
  if(gesture.wasPlaced)pieces[gesture.id].placed=true;
  gesture=null;drag=null;dragShape.classList.remove("show");render();setMsg("キャンセルしたよ")
});
window.addEventListener("resize",renderBoard);
$("#hint").onclick=useHint;$("#reset").onclick=reset;$("#again").onclick=reset;
render();
})();
</script>
</body>
</html>
