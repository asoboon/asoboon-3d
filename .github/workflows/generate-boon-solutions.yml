name: Generate BOON BLOCK solutions

on:
  push:
    paths:
      - '.github/workflows/generate-boon-solutions.yml'
      - 'boon-block/generate_solutions.cpp'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build generator
        run: g++ -O3 -std=c++17 boon-block/generate_solutions.cpp -o /tmp/boon_solution_generator

      - name: Generate all 16,146 solutions
        run: /tmp/boon_solution_generator

      - name: Verify generated database
        run: |
          node --check boon-block/solutions.js
          node -e "global.window=global; require('./boon-block/solutions.js'); if (!Array.isArray(window.BOON_SOLUTIONS) || window.BOON_SOLUTIONS.length !== 16146 || window.BOON_SOLUTION_COUNT !== 16146) process.exit(1); console.log('verified', window.BOON_SOLUTIONS.length)"
          sha256sum boon-block/solutions.js | awk '{print $1}' > boon-block/solutions.sha256
          test -s boon-block/IP_PROVENANCE.md

      - name: Commit generated database
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add boon-block/solutions.js boon-block/solutions.sha256
          if git diff --cached --quiet; then
            echo "solutions.js is already up to date"
          else
            git commit -m "Generate BOON BLOCK 16,146-solution database"
            git push
          fi
