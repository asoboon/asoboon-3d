<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>ASOBooN 3D テスト版</title>
    <link rel="stylesheet" href="./styles.css" />
    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.166.1/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.166.1/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <canvas id="scene"></canvas>

    <div id="loadingScreen" class="overlay visible">
      <div class="panel center-panel">
        <div class="eyebrow">ASOBooN 3D TEST</div>
        <h1>読み込み中</h1>
        <p class="muted">まずは軽く・確実に表示できる版です。</p>
        <div class="progress-wrap"><div id="progressBar" class="progress-bar"></div></div>
        <p id="loadingText" class="small">3Dデータを読み込んでいます…</p>
      </div>
    </div>

    <div id="startScreen" class="overlay hidden">
      <div class="panel center-panel start-card">
        <div class="eyebrow">PHASE 1</div>
        <h1>アソブーンを歩いてみる</h1>
        <p class="muted">左下スティックで移動。右側スワイプで視点移動。右下ボタンでジャンプ。</p>
        <div class="pill-row">
          <span class="pill">横画面推奨</span>
          <span class="pill">移動確認版</span>
          <span class="pill">軽量GLB</span>
        </div>
        <button id="startButton" class="primary-btn">はじめる</button>
      </div>
    </div>

    <div id="rotateNotice" class="overlay hidden subtle">
      <div class="panel small-panel">
        <div class="rotate-icon">↻</div>
        <p>横向きでご利用ください</p>
      </div>
    </div>

    <div id="hud" class="hidden">
      <div class="hint-bar glass">左下で移動 / 右側スワイプで視点 / 右下でジャンプ</div>

      <div class="joystick-zone left-zone">
        <div id="moveBase" class="joystick-base">
          <div id="moveStick" class="joystick-stick"></div>
        </div>
      </div>

      <div class="joystick-zone right-zone">
        <div class="look-label glass">視点</div>
        <button id="jumpButton" class="jump-btn">JUMP</button>
      </div>
    </div>

    <script type="module" src="./app.js"></script>
  </body>
</html>
