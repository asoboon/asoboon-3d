<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">

<title>BOON BLOCK — CHRISTMAS QUEST</title>
<!-- BOON BLOCK live build v32: persistent gallery backup and restore -->
<style>
:root{
  --sky:#7a49c6;--sky2:#372052;--jungle:#294932;--jungle2:#182b21;
  --leaf:#5d795f;--lime:#baff45;--sun:#ffac35;--orange:#ff7419;
  --stone:#8d7d93;--stone2:#55485e;--ink:#fff1d7;--muted:#e5ccf4;
  --cream:#fff2d2;--cyan:#62f3e2;--yellow:#ffd65c;--red:#ff6f5d;--ok:#a8ef49;
  --c0:linear-gradient(145deg,#ff9b35,#e76118);
  --c1:linear-gradient(145deg,#9d72ff,#6c43c8);
  --c2:linear-gradient(145deg,#b9ff5a,#6dac2f);
  --c3:linear-gradient(145deg,#55e4c5,#1e9b83);
  --c4:linear-gradient(145deg,#ff6fa8,#c83f7d);
  --core:linear-gradient(145deg,#fff7c7 0%,#ffe77e 26%,#e6bd43 52%,#b88524 76%,#7a5415 100%);
  --gold1:#fff7c7;--gold2:#ffe77e;--gold3:#e6bd43;--gold4:#8f631a;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden}
body{
  min-height:100%;overscroll-behavior:none;user-select:none;-webkit-user-select:none;
  color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:
    radial-gradient(circle at 79% 10%,rgba(255,174,53,.98) 0 8.5%,rgba(255,128,24,.25) 9.5%,transparent 16%),
    radial-gradient(circle at 22% 22%,rgba(190,255,71,.08) 0 2%,transparent 3%),
    radial-gradient(circle at 44% 14%,rgba(255,255,255,.16) 0 1%,transparent 1.6%),
    radial-gradient(circle at 61% 28%,rgba(255,255,255,.11) 0 .8%,transparent 1.4%),
    radial-gradient(ellipse at 50% 64%,rgba(170,94,214,.30) 0 32%,transparent 56%),
    radial-gradient(ellipse at 8% 112%,#36593e 0 35%,transparent 36%),
    radial-gradient(ellipse at 92% 112%,#2a442f 0 34%,transparent 35%),
    linear-gradient(180deg,#8b4bd4 0%,#563076 26%,#35204f 52%,#253629 76%,#17251c 100%);
}
body::before,body::after{
  content:"";position:fixed;pointer-events:none;z-index:0;width:180px;height:220px;bottom:-50px;
  background:
    radial-gradient(ellipse at 25% 25%,#425647 0 15%,transparent 16%),
    radial-gradient(ellipse at 70% 20%,#344437 0 18%,transparent 19%),
    radial-gradient(ellipse at 45% 48%,#28392d 0 22%,transparent 23%),
    radial-gradient(ellipse at 78% 62%,#1f2d24 0 20%,transparent 21%);
  opacity:.78;filter:drop-shadow(0 8px 12px rgba(11,12,20,.28))
}
body::before{left:-55px;transform:rotate(-10deg)}
body::after{right:-55px;transform:scaleX(-1) rotate(-10deg)}

button{font:inherit;color:inherit;touch-action:manipulation}
.app{
  position:relative;z-index:1;max-width:460px;height:100dvh;margin:0 auto;
  padding:calc(7px + env(safe-area-inset-top)) 8px calc(7px + env(safe-area-inset-bottom));
  overflow:hidden;display:flex;flex-direction:column
}
.top{
  display:flex;align-items:center;justify-content:space-between;gap:5px;
  margin-bottom:6px;flex:0 0 auto
}
.brand-wrap{display:flex;align-items:center;gap:7px;min-width:0}
.brand-mark{
  width:37px;height:37px;border-radius:48% 48% 44% 44%;flex:0 0 auto;
  background:
    linear-gradient(90deg,transparent 0 44%,rgba(117,46,8,.22) 45% 55%,transparent 56%),
    linear-gradient(145deg,#ffb23f,#ff7a1f 58%,#c74c10);
  border:3px solid rgba(93,45,16,.35);
  box-shadow:inset 0 3px 0 rgba(255,255,255,.35),0 5px 0 rgba(75,37,19,.30),0 0 12px rgba(255,123,31,.28);
  position:relative
}
.brand-mark::before,.brand-mark::after{
  content:"";position:absolute;top:12px;width:8px;height:7px;background:#2b183b;
  clip-path:polygon(50% 0,100% 100%,0 100%)
}
.brand-mark::before{left:7px}
.brand-mark::after{right:7px}
.brand{font-weight:1000;letter-spacing:.045em;font-size:17px;line-height:1;color:#fff1c9;text-shadow:0 2px 0 #3a1c54,0 0 10px rgba(255,129,32,.52),0 0 18px rgba(177,92,255,.28);white-space:nowrap}
.sub{
  display:inline-block;margin-top:3px;padding:2px 7px;border-radius:999px;
  background:#2b183f;color:#ffd783;font-size:8px;font-weight:900;letter-spacing:.12em
}
.top-right{display:flex;align-items:center;gap:4px}
.stats{display:grid;grid-template-columns:repeat(2,auto);gap:4px}
.stat{
  min-width:45px;padding:4px 6px;text-align:center;border-radius:11px;
  background:linear-gradient(180deg,#5d4275,#3d2a52);
  border:2px solid rgba(255,157,61,.22);
  box-shadow:inset 0 2px 0 rgba(255,255,255,.12),0 3px 0 rgba(17,10,30,.26)
}
.stat b{display:block;font-size:12px;color:#fff0d0}.stat span{display:block;font-size:7px;color:#dfb6ff;font-weight:900}
.hint-mini,.reset-mini{
  height:39px;border:0;border-radius:12px;font-weight:1000;line-height:1;
  box-shadow:inset 0 2px 0 rgba(255,255,255,.48),0 4px 0 rgba(82,65,20,.22);
  padding:0
}
.hint-mini{
  width:51px;background:linear-gradient(180deg,#ffbb49,#ff7a20);color:#40200d;
  font-size:8px;letter-spacing:.02em
}
.hint-mini span{display:block;font-size:9px;margin-top:2px}
.reset-mini{width:39px;background:linear-gradient(180deg,#baff59,#6fc52c);color:#21310f;font-size:17px}
.hint-mini:active,.reset-mini:active,.piece:active{transform:translateY(2px);box-shadow:inset 0 2px 0 rgba(255,255,255,.36),0 2px 0 rgba(82,65,20,.18)}

.quest-bar{
  display:flex;align-items:center;justify-content:space-between;gap:6px;
  margin-bottom:5px;padding:5px 8px;border-radius:12px;
  background:linear-gradient(180deg,rgba(86,45,112,.97),rgba(47,27,66,.97));color:#fff4d5;border:2px solid rgba(255,140,31,.38);
  box-shadow:inset 0 2px 0 rgba(255,255,255,.08),0 3px 0 rgba(17,10,29,.24);font-size:9px;font-weight:900
}
.quest-bar strong{color:#ff9c32;letter-spacing:.04em}
.quest-dots{display:flex;gap:3px}
.quest-dot{width:8px;height:8px;border-radius:50%;background:#714f8f;border:1px solid rgba(255,255,255,.12)}
.quest-dot.on{background:#a9f34c;box-shadow:0 0 8px rgba(169,243,76,.62)}

.board-wrap{
  position:relative;flex:0 0 auto;padding:12px 12px 10px;border-radius:18px;
  background:
    radial-gradient(circle at 12% 18%,rgba(193,255,82,.16) 0 4%,transparent 4.6%),
    radial-gradient(circle at 84% 76%,rgba(255,121,35,.12) 0 5%,transparent 5.6%),
    linear-gradient(145deg,#8b7a91,#65596d 55%,#4d4256);
  border:4px solid #2d2438;
  box-shadow:inset 0 3px 0 rgba(255,255,255,.13),inset 0 -5px 0 rgba(15,12,20,.24),0 8px 0 rgba(16,10,23,.42),0 0 28px rgba(169,81,229,.22),0 0 16px rgba(255,122,31,.10)
}
.board-wrap::before,.board-wrap::after{
  content:"";position:absolute;top:-8px;width:54px;height:18px;border-radius:80% 20% 80% 20%;
  background:linear-gradient(145deg,#ff9a32,#d95d13);box-shadow:0 3px 0 rgba(76,31,8,.32),0 0 10px rgba(255,122,31,.28)
}
.board-wrap::before{left:12px;transform:rotate(-12deg)}
.board-wrap::after{right:12px;transform:scaleX(-1) rotate(-12deg)}
.board{
  --cell-size:58px;
  display:grid;grid-template-columns:repeat(5,var(--cell-size));grid-template-rows:repeat(5,var(--cell-size));
  width:calc(var(--cell-size) * 5);height:calc(var(--cell-size) * 5);
  margin:0 auto;border-radius:11px;overflow:visible;touch-action:none;position:relative;
  border:4px solid #352f3a;
  background:
    linear-gradient(90deg,rgba(20,17,25,.28) 2px,transparent 2px),
    linear-gradient(rgba(20,17,25,.28) 2px,transparent 2px),
    radial-gradient(circle at 22% 18%,rgba(180,255,77,.15) 0 4%,transparent 4.5%),
    radial-gradient(circle at 73% 67%,rgba(165,86,211,.18) 0 5%,transparent 5.5%),
    repeating-radial-gradient(circle at 50% 50%,rgba(255,138,31,.025) 0 2px,transparent 3px 12px),
    linear-gradient(145deg,#766b7e,#554c5d);
  background-size:var(--cell-size) var(--cell-size),var(--cell-size) var(--cell-size),130px 130px,170px 170px,auto;
  box-shadow:inset 0 0 0 2px rgba(255,255,255,.08),inset 0 8px 24px rgba(12,10,18,.24),0 0 18px rgba(119,73,162,.14)
}
.cell{
  position:relative;width:var(--cell-size);height:var(--cell-size);padding:0;
  border:0;border-right:1px solid rgba(32,26,38,.28);border-bottom:1px solid rgba(32,26,38,.28);
  background:
    radial-gradient(circle at 50% 50%,rgba(174,255,72,.035) 0 10%,transparent 11%),
    rgba(112,100,120,.18);touch-action:none;overflow:hidden;
  transition:filter .12s ease,opacity .12s ease,transform .12s ease
}
.cell:nth-child(5n){border-right:0}
.cell.filled{
  box-shadow:inset 0 3px 0 rgba(255,255,255,.30),inset 0 -4px 0 rgba(74,61,47,.10)
}
.cell.filled::before{
  content:"";position:absolute;left:16%;top:12%;width:45%;height:17%;border-radius:99px;
  background:rgba(255,255,255,.28);transform:rotate(-8deg)
}
.cell.filled::after{
  content:"";position:absolute;right:10%;bottom:9%;width:11%;height:11%;border-radius:50%;
  background:rgba(60,62,52,.08)
}
.cell.core{background:rgba(92,89,82,.22)}
.cell.confirm-pop{animation:blockLock .22s ease-out}
@keyframes blockLock{0%{transform:scale(.82);filter:brightness(1.45)}70%{transform:scale(1.06)}100%{transform:scale(1)}}

.preview-cell{
  position:absolute;z-index:8;width:var(--cell-size);height:var(--cell-size);
  border-radius:8px;opacity:.52;pointer-events:none;
  outline:3px solid rgba(44,188,233,.92);outline-offset:-3px;
  box-shadow:inset 0 3px 0 rgba(255,255,255,.35),0 0 12px rgba(65,211,255,.24)
}
.preview-cell.bad{outline-color:#ff6d59;box-shadow:0 0 12px rgba(255,109,89,.28)}
.preview-cell.interactive{pointer-events:auto;touch-action:none;cursor:grab}

.core-device{
  position:absolute;z-index:7;width:calc(var(--cell-size) * .74);height:calc(var(--cell-size) * .82);
  pointer-events:auto;touch-action:none;cursor:grab;
  transform:translate(18%,10%);
  clip-path:polygon(50% 0%,84% 18%,100% 49%,76% 88%,50% 100%,24% 88%,0% 49%,16% 18%);
  border:0;
  background:
    linear-gradient(135deg,rgba(255,255,255,.98) 0 10%,transparent 11% 100%),
    linear-gradient(60deg,transparent 0 45%,rgba(255,250,209,.52) 46% 57%,transparent 58% 100%),
    linear-gradient(145deg,#fffbd9 0%,#ffe982 24%,#e9bd43 48%,#ba8525 72%,#7a5314 100%);
  box-shadow:0 0 0 3px rgba(143,99,26,.30),0 7px 0 rgba(62,72,65,.13),0 0 24px rgba(255,221,102,.56)
}
.core-device::before{
  content:"";position:absolute;inset:14% 16% 20%;
  clip-path:polygon(50% 0%,100% 40%,76% 100%,24% 100%,0% 40%);
  background:
    linear-gradient(145deg,rgba(255,255,255,.82),rgba(255,235,150,.30) 42%,rgba(175,119,25,.23) 43% 100%);
  opacity:.9
}
.core-device::after{
  content:"";position:absolute;left:50%;top:46%;width:16%;height:16%;border-radius:50%;
  transform:translate(-50%,-50%);background:#fff8c9;
  box-shadow:0 0 10px #fff0a8,0 0 20px rgba(255,220,93,.82)
}

.cell.hint-good{outline:3px solid #31d9ff;outline-offset:-3px;filter:brightness(1.12);box-shadow:inset 0 0 15px rgba(49,217,255,.28)}
.piece.hint-good{opacity:.9!important;filter:saturate(1)!important;outline:3px solid #31d9ff;outline-offset:1px;box-shadow:0 0 15px rgba(49,217,255,.28)}
.cell.hint-focus{outline:3px solid #ffe765;outline-offset:-3px;animation:hintPulse .8s ease-in-out infinite alternate}
.piece.hint-focus{opacity:1!important;filter:saturate(1)!important;outline:3px solid #ffe765;outline-offset:1px;box-shadow:0 0 18px rgba(255,231,101,.45);animation:hintPulse .8s ease-in-out infinite alternate}
.cell.hint-bad{outline:3px solid #ff6f59;outline-offset:-3px;animation:hintBad .7s ease-in-out infinite alternate}
.piece.hint-bad{opacity:1!important;filter:saturate(1)!important;outline:3px solid #ff6f59;outline-offset:1px;box-shadow:0 0 17px rgba(255,111,89,.4);animation:hintBad .7s ease-in-out infinite alternate}
.core-device.hint-good{box-shadow:0 0 0 4px #31d9ff,0 0 18px rgba(49,217,255,.5)}
.core-device.hint-focus{box-shadow:0 0 0 4px #ffe765,0 0 20px rgba(255,231,101,.55)}
.core-device.hint-bad{box-shadow:0 0 0 4px #ff6f59,0 0 20px rgba(255,111,89,.52)}

.board.clearing .cell.filled{
  background:linear-gradient(145deg,var(--gold1) 0%,var(--gold2) 34%,var(--gold3) 68%,var(--gold4) 100%) !important;
  animation:goldLock .44s ease-out forwards;
  animation-delay:var(--gold-delay,0ms);
  box-shadow:inset 0 3px 0 rgba(255,255,255,.45),inset 0 -4px 0 rgba(109,80,22,.14),0 0 16px rgba(255,223,102,.20)
}
.board.clearing .cell.filled::before{background:rgba(255,255,255,.34)}
.board.clearing .core-device{
  background:
    linear-gradient(135deg,rgba(255,255,255,.98) 0 10%,transparent 11% 100%),
    linear-gradient(60deg,transparent 0 45%,rgba(255,250,209,.56) 46% 57%,transparent 58% 100%),
    linear-gradient(145deg,#fffbd9 0%,#ffe982 24%,#e9bd43 48%,#ba8525 72%,#7a5314 100%) !important;
  animation:goldGemPulse .68s ease-out forwards
}
@keyframes goldLock{
  0%{transform:scale(1);filter:brightness(1)}
  36%{transform:scale(1.08);filter:brightness(1.58)}
  100%{transform:scale(1);filter:brightness(1.08)}
}
@keyframes goldGemPulse{
  0%{transform:translate(18%,10%) scale(1);filter:brightness(1)}
  42%{transform:translate(18%,10%) scale(1.16);filter:brightness(1.7)}
  100%{transform:translate(18%,10%) scale(1);filter:brightness(1.12)}
}
.hint-area-cell{
  position:absolute;z-index:8;width:var(--cell-size);height:var(--cell-size);pointer-events:none;border-radius:8px;
  background:rgba(49,217,255,.3);outline:2px solid rgba(49,217,255,.62);outline-offset:-3px
}
.hint-cell{
  position:absolute;z-index:9;width:var(--cell-size);height:var(--cell-size);pointer-events:none;border-radius:8px;
  opacity:.58;outline:3px solid #fff7af;outline-offset:-3px;box-shadow:0 0 14px rgba(255,231,101,.48)
}
@keyframes hintPulse{from{filter:brightness(1.03)}to{filter:brightness(1.42)}}
@keyframes hintBad{from{filter:brightness(1)}to{filter:brightness(1.38)}}

.msg{
  min-height:20px;margin:6px 1px 0;padding:2px 5px;border-radius:999px;
  color:#fff0d5;background:rgba(48,29,64,.86);
  font-size:10px;text-align:center;line-height:16px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis
}
.msg.ok{color:#dfff9a;background:rgba(49,63,28,.90)}
.msg.bad{color:#ffd3ca;background:rgba(90,36,52,.92)}

.gesture-guide{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:7px;flex:0 0 auto}
.gesture-chip{
  border:2px solid rgba(255,139,31,.18);background:rgba(54,34,69,.90);border-radius:12px;
  padding:5px 2px;text-align:center;font-size:8px;color:#d7c3e7;line-height:1.08;
  box-shadow:0 3px 0 rgba(17,10,29,.24)
}
.gesture-chip b{display:block;color:#ffb347;font-size:9px;margin-bottom:2px}

.tray-head{
  display:flex;justify-content:space-between;align-items:center;margin:7px 3px 4px;
  font-size:10px;flex:0 0 auto;color:#fff1d6
}
.tray-head strong{letter-spacing:.05em}
.tray-head span{
  background:#3f2a55;border:2px solid rgba(255,136,33,.20);border-radius:999px;padding:2px 7px;font-weight:900
}
.tray{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr));gap:5px;flex:0 0 auto}
.piece{
  position:relative;height:65px;min-height:65px;border:2px solid rgba(255,129,31,.18);border-radius:14px;
  background:
    radial-gradient(circle at 82% 20%,rgba(188,255,82,.13) 0 5%,transparent 5.8%),
    radial-gradient(circle at 18% 78%,rgba(255,122,31,.10) 0 7%,transparent 7.8%),
    linear-gradient(180deg,rgba(91,51,113,.99),rgba(49,29,67,.99));
  padding:4px 3px;display:flex;align-items:center;justify-content:center;touch-action:none;overflow:hidden;
  box-shadow:inset 0 3px 0 rgba(255,255,255,.11),0 4px 0 rgba(18,11,28,.32),0 0 12px rgba(148,73,205,.08)
}
.piece.selected{outline:3px solid #2dcff3;outline-offset:1px}
.piece.placed{opacity:.35;filter:saturate(.7)}
.piece-name{
  position:absolute;left:7px;top:6px;font-weight:1000;font-size:8px;line-height:1;
  color:#ffe1a8;letter-spacing:.02em
}
.piece.placed .piece-name::after{content:" ✓";color:#b7ff57}
.mini{display:grid;gap:2px;align-items:center;justify-content:center;place-content:center;min-width:58px;min-height:49px}
.mcell{width:11px;height:11px;border-radius:3px;background:#8090ae;box-shadow:inset 0 2px 0 rgba(255,255,255,.4),0 2px 0 rgba(76,47,25,.15)}
.piece:not(.placed) .mini{filter:drop-shadow(0 3px 2px rgba(70,47,23,.12))}

.drag-visual{
  position:fixed;left:0;top:0;z-index:30;pointer-events:none;display:none;opacity:.96;
  filter:drop-shadow(0 12px 12px rgba(45,47,30,.32));transform:translate(-50%,-115%)
}
.drag-visual.show{display:block}
.drag-grid{display:grid;gap:3px}
.drag-cell{width:30px;height:30px;border-radius:8px;border:2px solid rgba(255,255,255,.55);box-shadow:inset 0 3px 0 rgba(255,255,255,.25),0 3px 0 rgba(80,49,23,.15)}

.hold-ring{
  position:fixed;left:0;top:0;width:56px;height:56px;z-index:36;pointer-events:none;
  transform:translate(-50%,-50%);opacity:0;transition:opacity .08s ease
}
.hold-ring.show{opacity:1}
.hold-ring svg{width:100%;height:100%;transform:rotate(-90deg);filter:drop-shadow(0 0 6px rgba(34,165,207,.35))}
.hold-ring .track{fill:rgba(25,79,58,.6);stroke:rgba(255,255,255,.35);stroke-width:4}
.hold-ring .progress{fill:none;stroke:#ffe765;stroke-width:5;stroke-linecap:round;stroke-dasharray:138.23;stroke-dashoffset:138.23}
.hold-ring.show .progress{animation:holdFill .52s linear forwards}
.hold-ring .hold-label{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:8px;font-weight:1000;color:#fff9d6}
@keyframes holdFill{to{stroke-dashoffset:0}}

.overlay{
  position:fixed;inset:0;background:rgba(31,14,45,.82);display:none;align-items:center;justify-content:center;
  padding:24px;z-index:40;backdrop-filter:blur(4px)
}
.overlay.show{display:flex}
.clear-card{
  width:min(360px,100%);background:linear-gradient(180deg,#5d3a76,#352143);
  border:4px solid #ff8a26;border-radius:28px;padding:24px;text-align:center;
  box-shadow:inset 0 4px 0 rgba(255,255,255,.10),0 12px 0 rgba(29,14,40,.28),0 24px 70px rgba(16,8,26,.48),0 0 28px rgba(255,126,31,.18)
}
.clear-card .treasure{
  width:66px;height:76px;margin:0 auto 10px;
  clip-path:polygon(50% 0%,84% 18%,100% 49%,76% 88%,50% 100%,24% 88%,0% 49%,16% 18%);
  background:
    linear-gradient(135deg,rgba(255,255,255,.98) 0 10%,transparent 11% 100%),
    linear-gradient(60deg,transparent 0 45%,rgba(255,250,209,.56) 46% 57%,transparent 58% 100%),
    linear-gradient(145deg,#fffbd9 0%,#ffe982 24%,#e9bd43 48%,#ba8525 72%,#7a5314 100%);
  box-shadow:0 0 24px rgba(255,221,102,.58),0 8px 0 rgba(72,61,40,.14)
}
.clear-card h2{margin:0;color:#ffd467;font-size:30px;letter-spacing:.04em;text-shadow:0 2px 0 #2a1739,0 0 12px rgba(255,135,35,.35)}
.clear-card p{color:#ead6f7;line-height:1.55;font-weight:900}
.clear-card button{
  width:100%;min-height:50px;border:0;border-radius:15px;background:linear-gradient(180deg,#b7ff5d,#74ca30);
  color:#24350f;font-weight:1000;box-shadow:inset 0 3px 0 rgba(255,255,255,.28),0 5px 0 rgba(47,80,20,.32)
}

/* MAX HALLOWEEN DECOR */
.halloween-sky{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.halloween-sky .fog{
  position:absolute;left:-25%;width:150%;height:90px;border-radius:50%;
  background:radial-gradient(ellipse,rgba(225,201,255,.18) 0%,rgba(156,106,193,.10) 40%,transparent 72%);
  filter:blur(10px);opacity:.8
}

<script>
(()=>{
const defs={
 A:[[0,0],[0,1],[0,2],[1,0]],
 B:[[0,0],[0,1],[1,1],[1,2]],
 C:[[0,0],[0,1],[0,2],[1,0],[1,1]],
 D:[[0,0],[0,1],[0,2],[1,2],[1,3]],
 E:[[0,0],[0,1],[0,2],[0,3],[1,0],[1,2]],
 CORE:[[0,0]]
};
const ids=Object.keys(defs);
const names={A:"SANTA",B:"BELL",C:"TREE",D:"SNOW",E:"GIFT",CORE:"GOLD GEM"};
const symbols={A:"A",B:"B",C:"C",D:"D",E:"E",CORE:"O"};
const colors=["var(--c0)","var(--c1)","var(--c2)","var(--c3)","var(--c4)","var(--core)"];
const SOLUTIONS=Array.isArray(window.BOON_KIDS_SOLUTIONS)?window.BOON_KIDS_SOLUTIONS:[];
const SOLUTION_TOTAL=Number(window.BOON_KIDS_SOLUTION_COUNT||SOLUTIONS.length||0);
const CENTER_TOTAL=Number(window.BOON_KIDS_CENTER_COUNT||0);

const $=s=>document.querySelector(s);
const board=$("#board"),tray=$("#tray"),msg=$("#msg");
const galleryOverlay=$("#galleryOverlay"),galleryGrid=$("#galleryGrid"),galleryCount=$("#galleryCount"),galleryMiniCount=$("#galleryMiniCount"),galleryProgressBar=$("#galleryProgressBar"),galleryEmpty=$("#galleryEmpty");
const timeEl=$("#time"),movesEl=$("#moves"),countEl=$("#count"),overlay=$("#overlay"),clearText=$("#clearText");
const dragVisual=$("#dragVisual"),holdRing=$("#holdRing"),hintCountEl=$("#hintCount");

const TAP_MOVE=10,DRAG_START=13,FLICK_DISTANCE=46,FLICK_TIME=280,FLICK_RATIO=1.45;
const LONG_PRESS_MS=520,LONG_PRESS_MOVE=9;

const norm=s=>{
 const mr=Math.min(...s.map(a=>a[0])),mc=Math.min(...s.map(a=>a[1]));
 return s.map(([r,c])=>[r-mr,c-mc]).sort((a,b)=>a[0]-b[0]||a[1]-b[1]);
};
const rot=s=>norm(s.map(([r,c])=>[c,-r]));
const flip=s=>norm(s.map(([r,c])=>[r,-c]));

const pieces={};
ids.forEach(id=>pieces[id]={shape:norm(defs[id]),placed:null,floating:false});
pieces.CORE.placed=[[2,2]];

let selected="A",target=null,moves=0,start=0,timer=0;
let gesture=null,drag=null,justPlaced=null,longPressTimer=null;
let hintCount=0,hintStage=0,hintPlan=null;
let clearAnimating=false;

function occupied(ignore){
 const m=new Map();
 ids.forEach(id=>{
   if(id===ignore)return;
   const p=pieces[id];
   if(p.placed&&!p.floating)p.placed.forEach(([r,c])=>m.set(r+","+c,id));
 });
 return m;
}
function validFor(id,cells){
 const occ=occupied(id);
 return cells.length===defs[id].length&&cells.every(([r,c])=>r>=0&&r<5&&c>=0&&c<5&&!occ.has(r+","+c));
}
function ghostCells(){
 if(!selected||!target||pieces[selected].placed)return [];
 return pieces[selected].shape.map(([r,c])=>[target.r+r,target.c+c]);
}
function valid(cells){return validFor(selected,cells)}
function setMsg(t,kind=""){msg.textContent=t;msg.className="msg"+(kind?" "+kind:"")}
function fmt(ms){const s=Math.floor(ms/1000),m=Math.floor(s/60);return String(m).padStart(2,"0")+":"+String(s%60).padStart(2,"0")}
function startClock(){if(start)return;start=Date.now();timer=setInterval(()=>timeEl.textContent=fmt(Date.now()-start),500)}
function haptic(ms=12){if(navigator.vibrate)navigator.vibrate(ms)}

function sizeBoard(){
 const app=document.querySelector(".app"),wrap=board.parentElement,top=document.querySelector(".top");
 const quest=document.querySelector(".quest-bar"),guide=document.querySelector(".gesture-guide"),trayHead=document.querySelector(".tray-head");
 const viewportH=window.visualViewport?window.visualViewport.height:window.innerHeight;
 const css=getComputedStyle(app),padY=parseFloat(css.paddingTop)+parseFloat(css.paddingBottom);
 const fixed=top.offsetHeight+quest.offsetHeight+guide.offsetHeight+trayHead.offsetHeight+tray.offsetHeight+padY+78;
 const byHeight=Math.floor((viewportH-fixed)/5),byWidth=Math.floor((wrap.clientWidth-4)/5);
 const cell=Math.max(42,Math.min(70,byWidth,byHeight));
 board.style.setProperty("--cell-size",cell+"px");
}
window.addEventListener("resize",sizeBoard);
if(window.visualViewport)window.visualViewport.addEventListener("resize",sizeBoard);

function bounds(shape){return {h:Math.max(...shape.map(a=>a[0]))+1,w:Math.max(...shape.map(a=>a[1]))+1}}
function mini(shape){
 const b=bounds(shape),d=document.createElement("div");
 d.className="mini";d.style.gridTemplateColumns="repeat("+b.w+",11px)";
 const set=new Set(shape.map(a=>a.join(",")));
 for(let r=0;r<b.h;r++)for(let c=0;c<b.w;c++){
   const x=document.createElement("span");
   if(set.has(r+","+c))x.className="mcell";
   d.appendChild(x);
 }
 return d;
}
function buildDragVisual(){
 dragVisual.innerHTML="";
 const shape=pieces[selected].shape,b=bounds(shape),g=document.createElement("div");
 g.className="drag-grid";g.style.gridTemplateColumns="repeat("+b.w+",30px)";
 const set=new Set(shape.map(a=>a.join(",")));
 for(let r=0;r<b.h;r++)for(let c=0;c<b.w;c++){
   const x=document.createElement("span");
   if(set.has(r+","+c)){x.className="drag-cell";x.style.background=colors[ids.indexOf(selected)]}
   else{x.style.width="30px";x.style.height="30px"}
   g.appendChild(x);
 }
 dragVisual.appendChild(g);
}
function moveDragVisual(x,y){dragVisual.style.left=x+"px";dragVisual.style.top=y+"px"}
function targetFromPointer(x,y){
 const rect=board.getBoundingClientRect(),cell=rect.width/5,b=bounds(pieces[selected].shape);
 const liftedY=y-cell*.7;
 return {
   c:Math.floor((x-rect.left)/cell)-Math.floor((b.w-1)/2),
   r:Math.floor((liftedY-rect.top)/cell)-Math.floor((b.h-1)/2)
 };
}
function pointerNearBoard(x,y){
 const r=board.getBoundingClientRect(),pad=38;
 return x>=r.left-pad&&x<=r.right+pad&&y>=r.top-pad&&y<=r.bottom+pad
}
function placementAnchor(cells){return {r:Math.min(...cells.map(a=>a[0])),c:Math.min(...cells.map(a=>a[1]))}}

// ---------- 192-ROUTE GALLERY ----------
const GALLERY_TOTAL=192;
const GALLERY_STORAGE_KEY="boonBlockClearedRoutesV1";
function loadGalleryRoutes(){
  try{
    const raw=JSON.parse(localStorage.getItem(GALLERY_STORAGE_KEY)||"[]");
    return Array.isArray(raw)?new Set(raw.filter(n=>Number.isInteger(n)&&n>=0&&n<GALLERY_TOTAL)):new Set()
  }catch(_){return new Set()}
}
function saveGalleryRoutes(found){
  try{localStorage.setItem(GALLERY_STORAGE_KEY,JSON.stringify([...found].sort((a,b)=>a-b)))}catch(_){}
}
function exportGalleryBackup(){
  const routes=[...loadGalleryRoutes()].sort((a,b)=>a-b);
  const data={
    app:"BOON BLOCK",
    mode:"square-5x5",
    version:1,
    routeCount:GALLERY_TOTAL,
    storageKey:GALLERY_STORAGE_KEY,
    routes,
    discovered:routes.length,
    exportedAt:new Date().toISOString()
  };
  const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
  const url=URL.createObjectURL(blob),a=document.createElement("a");
  a.href=url;
  a.download="boon-block-gallery-backup-v1.json";
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
  setMsg("ギャラリーをバックアップしたよ！","ok");haptic(12)
}
function normalizeBackupRoutes(data){
  const raw=Array.isArray(data)?data:(data&&Array.isArray(data.routes)?data.routes:null);
  if(!raw)throw new Error("routes missing");
  const routes=[...new Set(raw.map(Number).filter(n=>Number.isInteger(n)&&n>=0&&n<GALLERY_TOTAL))];
  if(raw.length&&routes.length===0)throw new Error("no valid routes");
  return routes
}
async function importGalleryBackup(file){
  try{
    const text=await file.text(),data=JSON.parse(text),incoming=normalizeBackupRoutes(data);
    const current=loadGalleryRoutes(),before=current.size;
    incoming.forEach(n=>current.add(n));
    saveGalleryRoutes(current);renderGallery();
    const added=current.size-before;
    setMsg(added?("復元完了！ "+added+"ルート追加したよ"):"復元完了！ 進捗は最新だよ","ok");
    haptic(18)
  }catch(_){
    setMsg("このバックアップファイルは読み込めなかったよ","bad");haptic(24)
  }
}
function currentSolutionSignature(){
  const occ=occupied(),out=[];
  for(let r=0;r<5;r++)for(let c=0;c<5;c++){
    const id=occ.get(r+","+c);
    if(!id)return null;
    out.push(symbols[id])
  }
  return out.join("")
}
function registerClearRoute(){
  const sig=currentSolutionSignature();
  if(!sig)return {index:-1,isNew:false};
  const index=SOLUTIONS.indexOf(sig);
  if(index<0)return {index:-1,isNew:false};
  const found=loadGalleryRoutes(),isNew=!found.has(index);
  found.add(index);saveGalleryRoutes(found);renderGallery();
  return {index,isNew}
}
function buildRouteMini(solution){
  const mini=document.createElement("span");mini.className="route-mini";
  for(const ch of solution){
    const x=document.createElement("i");x.className="g-"+ch;mini.appendChild(x)
  }
  return mini
}
function renderGallery(){
  const found=loadGalleryRoutes();
  galleryGrid.innerHTML="";
  for(let i=0;i<GALLERY_TOTAL;i++){
    const isFound=found.has(i),b=document.createElement("button");
    b.type="button";b.className="route-box"+(isFound?" found":"");
    b.setAttribute("aria-label","ROUTE "+String(i+1).padStart(3,"0")+(isFound?" 発見済み":" 未発見"));
    if(isFound&&SOLUTIONS[i])b.appendChild(buildRouteMini(SOLUTIONS[i]));
    else{const q=document.createElement("span");q.className="q";q.textContent="?";b.appendChild(q)}
    const no=document.createElement("span");no.className="no";no.textContent=String(i+1).padStart(3,"0");
    b.appendChild(no);galleryGrid.appendChild(b)
  }
  const n=found.size;
  galleryCount.textContent=n+" / "+GALLERY_TOTAL;
  galleryMiniCount.textContent=n+"/"+GALLERY_TOTAL;
  galleryProgressBar.style.width=(n/GALLERY_TOTAL*100)+"%";
  galleryEmpty.textContent=n?("あと "+(GALLERY_TOTAL-n)+" ルート！"):"まずは最初の1ルートを見つけよう！"
}
function openGallery(){renderGallery();galleryOverlay.classList.add("show")}
function closeGallery(){galleryOverlay.classList.remove("show")}

// ---------- 192-SOLUTION HINT ENGINE ----------

function pieceMatchesSolution(id,solution){
 const p=pieces[id];
 if(!p.placed||p.floating)return true;
 const symbol=symbols[id];
 return p.placed.every(([r,c])=>r>=0&&r<5&&c>=0&&c<5&&solution[r*5+c]===symbol)
}
function matchingSolutions(fixedIds){
 if(!SOLUTIONS.length)return [];
 return SOLUTIONS.filter(solution=>fixedIds.every(id=>pieceMatchesSolution(id,solution)))
}
function solutionCells(solution,id){
 const symbol=symbols[id],cells=[];
 for(let i=0;i<25;i++)if(solution[i]===symbol)cells.push([Math.floor(i/5),i%5]);
 return cells
}
function cellsKey(cells){return cells.map(([r,c])=>r*5+c).sort((a,b)=>a-b).join(",")}
function placementDistribution(candidates,id){
 const map=new Map(),heat=new Uint32Array(25);
 for(const solution of candidates){
   const cells=solutionCells(solution,id),key=cellsKey(cells);
   let g=map.get(key);
   if(!g){g={cells,count:0};map.set(key,g)}
   g.count++;
   for(const [r,c] of cells)heat[r*5+c]++
 }
 let best=null;
 for(const g of map.values())if(!best||g.count>best.count)best=g;
 let max=0;for(const n of heat)max=Math.max(max,n);
 const areaCells=[];
 if(max)for(let i=0;i<25;i++)if(heat[i])areaCells.push({r:Math.floor(i/5),c:i%5,score:heat[i]/max});
 return {distinct:map.size,best,areaCells}
}
function chooseNextPiece(candidates,choices){
 let pick=null;
 for(const id of choices){
   const d=placementDistribution(candidates,id);
   if(!pick||d.distinct<pick.d.distinct||(d.distinct===pick.d.distinct&&d.best&&pick.d.best&&d.best.count>pick.d.best.count))pick={id,d}
 }
 return pick
}
function buildRepairPlan(fixedIds){
 if(!fixedIds.length||!SOLUTIONS.length)return null;
 let bestGood=-1,groups=new Map();

 for(const solution of SOLUTIONS){
   const good=[],wrong=[];
   for(const id of fixedIds){
     if(pieceMatchesSolution(id,solution))good.push(id);
     else wrong.push(id)
   }
   if(good.length<bestGood)continue;
   if(good.length>bestGood){bestGood=good.length;groups=new Map()}
   const key=wrong.join("|");
   let g=groups.get(key);
   if(!g){g={goodIds:good,wrongIds:wrong,count:0};groups.set(key,g)}
   g.count++
 }
 let chosen=null;
 for(const g of groups.values())if(!chosen||g.count>chosen.count)chosen=g;
 if(!chosen)return null;

 const recovered=matchingSolutions(chosen.goodIds);
 const focus=chooseNextPiece(recovered,chosen.wrongIds);
 return {
   type:"repair",goodIds:chosen.goodIds,wrongIds:chosen.wrongIds,
   candidateCount:recovered.length,piece:focus?focus.id:chosen.wrongIds[0],
   areaCells:focus?focus.d.areaCells:[],cells:focus&&focus.d.best?focus.d.best.cells:null,
   placementCount:focus?focus.d.distinct:0
 }
}
function buildHintPlan(){
 if(!SOLUTIONS.length)return {type:"loading"};
 const fixedIds=ids.filter(id=>pieces[id].placed&&!pieces[id].floating);
 const matches=matchingSolutions(fixedIds);

 if(matches.length){
   const choices=ids.filter(id=>!pieces[id].placed||pieces[id].floating);
   const focus=choices.length?chooseNextPiece(matches,choices):null;
   return {
     type:"route",goodIds:fixedIds,wrongIds:[],candidateCount:matches.length,
     piece:focus?focus.id:null,areaCells:focus?focus.d.areaCells:[],
     cells:focus&&focus.d.best?focus.d.best.cells:null,placementCount:focus?focus.d.distinct:0
   }
 }
 return buildRepairPlan(fixedIds)||{type:"none"}
}
function resetHintPlan(){hintStage=0;hintPlan=null}
function useHint(){
 if(!SOLUTIONS.length){
   setMsg("ヒントを読み込めなかったよ","bad");haptic(18);return
 }
 if(hintStage===0||hintStage>=3||!hintPlan){hintPlan=buildHintPlan();hintStage=0}
 if(!hintPlan||hintPlan.type==="none"){
   setMsg("いったん赤いブロックを動かしてみよう","bad");haptic(18);return
 }

 hintStage++;hintCount++;hintCountEl.textContent=hintCount;renderAll();

 if(hintPlan.type==="repair"){
   const namesText=hintPlan.wrongIds.map(id=>names[id]).join("・");
   if(hintStage===1)setMsg("赤い "+namesText+" を動かすと道がもどるよ！","bad");
   else if(hintStage===2)setMsg("次は "+names[hintPlan.piece]+"！光ってる場所を見てみよう","ok");
   else setMsg(names[hintPlan.piece]+" はここがオススメ！","ok")
 }else{
   if(hintStage===1)setMsg("いい感じ！水色はそのままOK。次は "+names[hintPlan.piece],"ok");
   else if(hintStage===2)setMsg(names[hintPlan.piece]+" が入れる場所を光らせたよ","ok");
   else setMsg(names[hintPlan.piece]+" はここに置いてみよう！","ok")
 }
 haptic(10)
}

// ---------- INTERACTION ----------

function transformPiece(id,kind){
 resetHintPlan();selected=id;
 if(id==="CORE"){
   renderAll();setMsg("GOLD GEMは好きな場所へ動かせるよ","ok");haptic();return
 }
 const p=pieces[id],nextShape=kind==="rotate"?rot(p.shape):flip(p.shape);
 if(p.placed){
   const a=placementAnchor(p.placed),cells=nextShape.map(([r,c])=>[a.r+r,a.c+c]);
   p.shape=nextShape;p.placed=cells;p.floating=!validFor(id,cells);
   if(!p.floating)justPlaced=id
 }else p.shape=nextShape;
 target=null;renderAll();
 setMsg(p.floating?"まだ置けないよ。もう一度動かそう":(kind==="rotate"?"くるっ！":"ひっくり返したよ"),p.floating?"bad":"ok");
 haptic()
}
function showHoldRing(x,y){
 holdRing.style.left=x+"px";holdRing.style.top=y+"px";holdRing.classList.remove("show");
 void holdRing.offsetWidth;holdRing.classList.add("show")
}
function clearLongPress(){
 if(longPressTimer){clearTimeout(longPressTimer);longPressTimer=null}
 holdRing.classList.remove("show")
}
function armLongPress(id,pointerId,x,y){
 clearLongPress();if(!pieces[id].placed)return;showHoldRing(x,y);
 longPressTimer=setTimeout(()=>{
   if(!gesture||gesture.id!==id||gesture.pointerId!==pointerId||gesture.dragging)return;
   const dx=gesture.lastX-gesture.startX,dy=gesture.lastY-gesture.startY;
   if(Math.hypot(dx,dy)>LONG_PRESS_MOVE)return;
   gesture=null;longPressTimer=null;holdRing.classList.remove("show");returnToWait(id)
 },LONG_PRESS_MS)
}
function beginGesture(id,e){
 if(e.pointerType==="mouse"&&e.button!==0)return;
 e.preventDefault();selected=id;target=null;
 gesture={
   id,pointerId:e.pointerId,startX:e.clientX,startY:e.clientY,lastX:e.clientX,lastY:e.clientY,
   startTime:performance.now(),dragging:false,
   originalPlacement:pieces[id].placed?pieces[id].placed.map(a=>[...a]):null,
   originalFloating:!!pieces[id].floating
 };
 armLongPress(id,e.pointerId,e.clientX,e.clientY);
 if(pieces[id].placed)setMsg("長押しでもどす / ドラッグで動かす");
 renderTray()
}
function beginDrag(){
 if(!gesture||gesture.dragging)return;
 clearLongPress();resetHintPlan();gesture.dragging=true;selected=gesture.id;
 if(pieces[selected].placed)pieces[selected].placed=null;
 pieces[selected].floating=false;drag={id:selected,pointerId:gesture.pointerId};
 buildDragVisual();dragVisual.classList.add("show");renderAll();setMsg("石板の上へ運ぼう！")
}
function updateDragTarget(x,y){
 if(!drag)return;moveDragVisual(x,y);
 if(pointerNearBoard(x,y)){
   target=targetFromPointer(x,y);renderBoard();
   const ok=valid(ghostCells());
   setMsg(ok?"ここに置けるよ！":"そこは入らないよ",ok?"ok":"bad")
 }else{target=null;renderBoard()}
}
function restoreOriginal(){
 if(!gesture)return;
 if(gesture.originalPlacement)pieces[gesture.id].placed=gesture.originalPlacement.map(a=>[...a]);
 pieces[gesture.id].floating=!!gesture.originalFloating;
 target=null;drag=null;dragVisual.classList.remove("show")
}
function returnToWait(id){
 resetHintPlan();pieces[id].placed=null;pieces[id].floating=false;
 selected=id;target=null;drag=null;dragVisual.classList.remove("show");
 renderAll();setMsg(names[id]+" を下にもどしたよ","ok");haptic(16)
}
function lockSelected(){
 resetHintPlan();
 const cells=ghostCells();if(!valid(cells))return false;
 startClock();
 const lockedId=selected;
 pieces[lockedId].placed=cells.map(a=>[...a]);pieces[lockedId].floating=false;justPlaced=lockedId;
 moves++;movesEl.textContent=moves;
 const next=ids.find(id=>!pieces[id].placed||pieces[id].floating);
 target=null;if(next)selected=next;
 drag=null;dragVisual.classList.remove("show");
 renderAll();setMsg("カチッ！ ぴったり！","ok");haptic(18);

 if(ids.every(id=>pieces[id].placed&&!pieces[id].floating)){
   clearInterval(timer);timeEl.textContent=fmt(Date.now()-start);
   const discovered=registerClearRoute();
   clearAnimating=true;
   board.classList.add("clearing");
   renderAll();
   const routeText=discovered.index>=0?" ROUTE "+String(discovered.index+1).padStart(3,"0"):"";
   setMsg(discovered.isNew?"NEW"+routeText+"！ ギャラリーに登録！":"カチャッ！"+routeText+" 聖夜の黄金石板が完成！","ok");
   clearText.textContent=(discovered.isNew?"NEW ROUTE "+String(discovered.index+1).padStart(3,"0")+"! / ":"")+"TIME "+timeEl.textContent+" / MOVE "+moves+" / HINT "+hintCount;
   haptic(35);
   setTimeout(()=>overlay.classList.add("show"),980)
 }
 return true
}
function finishGesture(e){
 if(!gesture||e.pointerId!==gesture.pointerId)return;
 clearLongPress();
 const g=gesture,dx=e.clientX-g.startX,dy=e.clientY-g.startY;
 const ax=Math.abs(dx),ay=Math.abs(dy),dist=Math.hypot(dx,dy),dt=performance.now()-g.startTime;
 const isFlick=ax>=FLICK_DISTANCE&&dt<=FLICK_TIME&&ax>ay*FLICK_RATIO;

 if(isFlick){
   if(g.dragging)restoreOriginal();
   gesture=null;transformPiece(g.id,"flip");return
 }
 if(g.dragging){
   if(target&&valid(ghostCells())){gesture=null;lockSelected()}
   else{
     restoreOriginal();gesture=null;renderAll();
     setMsg(target?"そこは入らないよ":"もとの場所にもどしたよ",target?"bad":"")
   }
   return
 }
 gesture=null;
 if(dist<=TAP_MOVE)transformPiece(g.id,"rotate");
 else setMsg("ドラッグで動かす / 横フリックでひっくり返す")
}

function addPreviewCells(cells,id,bad=false,interactive=false){
 cells.forEach(([r,c])=>{
   const x=document.createElement("div");
   x.className="preview-cell"+(bad?" bad":"")+(interactive?" interactive":"");
   x.style.left="calc(var(--cell-size) * "+c+")";x.style.top="calc(var(--cell-size) * "+r+")";
   x.style.background=colors[ids.indexOf(id)];
   if(interactive)x.addEventListener("pointerdown",e=>beginGesture(id,e));
   board.appendChild(x)
 })
}
function renderBoard(){
 board.innerHTML="";
 const occ=occupied();

 for(let r=0;r<5;r++)for(let c=0;c<5;c++){
   const v=occ.get(r+","+c),b=document.createElement("button");
   b.type="button";b.className="cell";b.setAttribute("aria-label",(r+1)+"行 "+(c+1)+"列");

   if(v){
     b.classList.add("filled");b.dataset.piece=v;b.style.background=colors[ids.indexOf(v)];
     if(clearAnimating)b.style.setProperty("--gold-delay",(r*5+c)*34+"ms");
     if(v==="CORE")b.classList.add("core");
     if(v===justPlaced)b.classList.add("confirm-pop");
     if(hintPlan&&hintStage>=1){
       if(hintPlan.goodIds&&hintPlan.goodIds.includes(v))b.classList.add("hint-good");
       if(hintPlan.wrongIds&&hintPlan.wrongIds.includes(v)&&!(hintStage>=2&&v===hintPlan.piece))b.classList.add("hint-bad");
       if(hintStage>=2&&v===hintPlan.piece)b.classList.add("hint-focus")
     }
   }
   b.addEventListener("pointerdown",e=>{if(v)beginGesture(v,e)});
   board.appendChild(b)
 }

 const cp=pieces.CORE;
 if(cp.placed&&!cp.floating){
   const a=placementAnchor(cp.placed),core=document.createElement("div");
   core.className="core-device";
   if(hintPlan&&hintStage>=1){
     if(hintPlan.goodIds&&hintPlan.goodIds.includes("CORE"))core.classList.add("hint-good");
     if(hintPlan.wrongIds&&hintPlan.wrongIds.includes("CORE")&&!(hintStage>=2&&hintPlan.piece==="CORE"))core.classList.add("hint-bad");
     if(hintStage>=2&&hintPlan.piece==="CORE")core.classList.add("hint-focus")
   }
   if(clearAnimating)core.style.setProperty("--gold-delay","120ms");
   core.style.left="calc(var(--cell-size) * "+a.c+")";core.style.top="calc(var(--cell-size) * "+a.r+")";
   core.addEventListener("pointerdown",e=>beginGesture("CORE",e));board.appendChild(core)
 }

 const ghost=ghostCells();
 if(ghost.length)addPreviewCells(ghost,selected,!valid(ghost),false);

 ids.forEach(id=>{
   const p=pieces[id];
   if(p.floating&&p.placed)addPreviewCells(p.placed,id,true,true)
 });

 if(hintPlan&&hintStage===2&&hintPlan.areaCells&&hintPlan.areaCells.length){
   hintPlan.areaCells.forEach(a=>{
     const x=document.createElement("div");x.className="hint-area-cell";
     x.style.left="calc(var(--cell-size) * "+a.c+")";x.style.top="calc(var(--cell-size) * "+a.r+")";
     x.style.opacity=String(.12+.65*a.score);board.appendChild(x)
   })
 }
 if(hintPlan&&hintStage>=3&&hintPlan.cells&&hintPlan.piece){
   hintPlan.cells.forEach(([r,c])=>{
     const x=document.createElement("div");x.className="hint-cell";
     x.style.left="calc(var(--cell-size) * "+c+")";x.style.top="calc(var(--cell-size) * "+r+")";
     x.style.background=colors[ids.indexOf(hintPlan.piece)];board.appendChild(x)
   })
 }

 if(justPlaced)setTimeout(()=>{justPlaced=null},260)
}
function renderTray(){
 tray.innerHTML="";
 ids.forEach((id,i)=>{
   const b=document.createElement("button");b.type="button";b.className="piece";
   if(id===selected)b.classList.add("selected");
   if(hintPlan&&hintStage>=1){
     if(hintPlan.goodIds&&hintPlan.goodIds.includes(id))b.classList.add("hint-good");
     if(hintPlan.wrongIds&&hintPlan.wrongIds.includes(id)&&!(hintStage>=2&&id===hintPlan.piece))b.classList.add("hint-bad");
     if(id===hintPlan.piece)b.classList.add("hint-focus")
   }
   if(pieces[id].placed&&!pieces[id].floating)b.classList.add("placed");
   if(pieces[id].floating)b.classList.add("selected");

   const n=document.createElement("span");n.className="piece-name";n.textContent=names[id];
   const m=mini(pieces[id].shape);m.querySelectorAll(".mcell").forEach(x=>x.style.background=colors[i]);
   b.append(n,m);b.addEventListener("pointerdown",e=>beginGesture(id,e));tray.appendChild(b)
 });
 countEl.textContent=ids.filter(id=>pieces[id].placed&&!pieces[id].floating).length
}
function renderAll(){renderBoard();renderTray();requestAnimationFrame(sizeBoard)}

window.addEventListener("pointermove",e=>{
 if(!gesture||e.pointerId!==gesture.pointerId)return;
 e.preventDefault();gesture.lastX=e.clientX;gesture.lastY=e.clientY;
 const dx=e.clientX-gesture.startX,dy=e.clientY-gesture.startY,dist=Math.hypot(dx,dy);
 if(dist>LONG_PRESS_MOVE)clearLongPress();
 if(!gesture.dragging&&dist>=DRAG_START)beginDrag();
 if(gesture.dragging)updateDragTarget(e.clientX,e.clientY)
},{passive:false});
window.addEventListener("pointerup",finishGesture);
window.addEventListener("pointercancel",e=>{
 if(!gesture||e.pointerId!==gesture.pointerId)return;
 clearLongPress();if(gesture.dragging)restoreOriginal();gesture=null;renderAll();setMsg("キャンセルしたよ")
});

function reset(){
 clearInterval(timer);clearLongPress();start=0;timer=0;moves=0;clearAnimating=false;
 movesEl.textContent="0";timeEl.textContent="00:00";
 ids.forEach(id=>{pieces[id].shape=norm(defs[id]);pieces[id].placed=null;pieces[id].floating=false});
 pieces.CORE.placed=[[2,2]];
 selected="A";target=null;gesture=null;drag=null;justPlaced=null;
 hintCount=0;hintCountEl.textContent="0";resetHintPlan();
 holdRing.classList.remove("show");dragVisual.classList.remove("show");overlay.classList.remove("show");board.classList.remove("clearing");
 renderAll();
 setMsg(SOLUTIONS.length===192?"GOLD GEMは真ん中のままでも "+CENTER_TOTAL+"通りクリアできるよ！":"ヒントを読み込めなかったよ",SOLUTIONS.length===192?"ok":"bad")
}

$("#hint").addEventListener("click",useHint);
$("#reset").addEventListener("click",reset);
$("#again").addEventListener("click",reset);
$("#galleryOpen").addEventListener("click",openGallery);
$("#galleryClose").addEventListener("click",closeGallery);
$("#galleryBackup").addEventListener("click",exportGalleryBackup);
$("#galleryRestore").addEventListener("click",()=>$("#galleryRestoreFile").click());
$("#galleryRestoreFile").addEventListener("change",async e=>{
  const file=e.target.files&&e.target.files[0];
  if(file)await importGalleryBackup(file);
  e.target.value="";
});
galleryOverlay.addEventListener("pointerdown",e=>{if(e.target===galleryOverlay)closeGallery()});

renderGallery();renderAll();requestAnimationFrame(sizeBoard);
setMsg(SOLUTIONS.length===192?"5×5でかんたん！ 真ん中スタート "+CENTER_TOTAL+"ルート":"ヒントを読み込めなかったよ",SOLUTIONS.length===192?"ok":"bad");
})();
</script>
