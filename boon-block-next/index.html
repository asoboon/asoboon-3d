<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#07111f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="format-detection" content="telephone=no">
<title>BOON BLOCK — ORIGINAL SET</title>
<!-- BOON BLOCK NEXT v1: 10 original six-cell pieces + movable 2x2 CORE -->
<style>
:root{
  --bg:#07111f;--panel:#0f1b2d;--panel2:#17283e;--line:#29415f;
  --text:#f5fbff;--muted:#8ea7bf;--cyan:#64e6ff;--yellow:#ffe982;
  --red:#ff765f;--ok:#58e0b4;
  --c0:linear-gradient(145deg,#78e4ff,#47c8f4);
  --c1:linear-gradient(145deg,#5fb8ff,#3f8fe6);
  --c2:linear-gradient(145deg,#c09aff,#9673ed);
  --c3:linear-gradient(145deg,#9f7de9,#7150cf);
  --c4:linear-gradient(145deg,#7be7bd,#4fce98);
  --c5:linear-gradient(145deg,#5dd39a,#2aa56e);
  --c6:linear-gradient(145deg,#ffc06f,#f39743);
  --c7:linear-gradient(145deg,#ff9b5a,#e26a35);
  --c8:linear-gradient(145deg,#ffed7c,#f5d34d);
  --c9:linear-gradient(145deg,#ff96aa,#e65d7c);
  --core:linear-gradient(145deg,#effdff,#6fe4ff 58%,#319dcc);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden}
body{
  min-height:100%;overscroll-behavior:none;user-select:none;-webkit-user-select:none;
  color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:
    radial-gradient(circle at 50% -12%,rgba(64,154,210,.18),transparent 35%),
    linear-gradient(180deg,#081526 0%,var(--bg) 54%,#050c17 100%);
}
button{font:inherit;color:inherit;touch-action:manipulation}
.app{
  max-width:460px;height:100dvh;margin:0 auto;
  padding:calc(6px + env(safe-area-inset-top)) 8px calc(6px + env(safe-area-inset-bottom));
  overflow:hidden;display:flex;flex-direction:column
}
.top{display:flex;align-items:center;justify-content:space-between;gap:5px;margin-bottom:5px;flex:0 0 auto}
.brand{font-weight:950;letter-spacing:.085em;font-size:15px;white-space:nowrap;text-shadow:0 0 18px rgba(93,220,255,.18)}
.sub{font-size:8px;color:var(--muted);margin-top:1px;white-space:nowrap;letter-spacing:.06em}
.top-right{display:flex;align-items:center;gap:4px}
.stats{display:grid;grid-template-columns:repeat(2,auto);gap:4px}
.stat{
  background:linear-gradient(180deg,rgba(23,40,62,.94),rgba(12,25,43,.94));
  border:1px solid rgba(88,130,170,.38);border-radius:9px;padding:4px 6px;
  text-align:center;min-width:47px;box-shadow:inset 0 1px 0 rgba(255,255,255,.05)
}
.stat b{display:block;font-size:12px}.stat span{display:block;color:var(--muted);font-size:8px}
.hint-mini,.reset-mini{
  height:38px;border:1px solid rgba(83,125,165,.5);border-radius:10px;
  background:linear-gradient(180deg,#203652,#15263d);font-weight:900;line-height:1;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.06);padding:0
}
.hint-mini{width:48px;font-size:8px;letter-spacing:.03em;color:#dff9ff}
.hint-mini span{color:var(--cyan);font-size:9px}
.reset-mini{width:38px;font-size:16px}
.hint-mini:active,.reset-mini:active,.piece:active{transform:scale(.97)}

.board-wrap{
  background:linear-gradient(180deg,#122036,#0c1829);
  border:1px solid rgba(83,125,165,.42);border-radius:16px;padding:6px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.045),0 8px 22px rgba(0,0,0,.16);
  flex:0 0 auto
}
.board{
  --cell-size:40px;
  display:grid;grid-template-columns:repeat(8,var(--cell-size));grid-template-rows:repeat(8,var(--cell-size));
  width:calc(var(--cell-size) * 8);height:calc(var(--cell-size) * 8);
  margin:0 auto;overflow:visible;border-radius:11px;border:1px solid var(--line);
  background:#091422;touch-action:none;position:relative;
  box-shadow:inset 0 0 0 1px rgba(108,164,210,.08),inset 0 8px 24px rgba(0,0,0,.25)
}
.cell{
  position:relative;width:var(--cell-size);height:var(--cell-size);
  min-width:var(--cell-size);min-height:var(--cell-size);max-width:var(--cell-size);max-height:var(--cell-size);
  border:0;border-right:1px solid rgba(116,163,201,.10);border-bottom:1px solid rgba(116,163,201,.10);
  background:rgba(15,29,48,.88);padding:0;touch-action:none;
  transition:filter .12s ease,opacity .12s ease,transform .12s ease
}
.cell:nth-child(8n){border-right:0}
.cell.filled{box-shadow:inset 0 2px 0 rgba(255,255,255,.22),inset 0 -3px 6px rgba(4,12,22,.16)}
.cell.filled::after{
  content:"";position:absolute;left:18%;top:12%;width:42%;height:16%;border-radius:99px;
  background:rgba(255,255,255,.22);transform:rotate(-8deg)
}
.cell.core{background:linear-gradient(145deg,rgba(218,251,255,.9),rgba(73,184,226,.78))}
.cell.confirm-pop{animation:blockLock .22s ease-out}
@keyframes blockLock{0%{transform:scale(.84);filter:brightness(1.35)}70%{transform:scale(1.05)}100%{transform:scale(1)}}

.preview-cell{
  position:absolute;z-index:8;width:var(--cell-size);height:var(--cell-size);
  border-radius:4px;opacity:.5;pointer-events:none;outline:2px solid rgba(93,220,255,.92);outline-offset:-2px;
  box-shadow:inset 0 2px 0 rgba(255,255,255,.28),0 0 8px rgba(93,220,255,.18)
}
.preview-cell.bad{outline-color:#ff6f88;box-shadow:0 0 9px rgba(255,94,120,.25)}
.preview-cell.interactive{pointer-events:auto;touch-action:none;cursor:grab}

.core-device{
  position:absolute;z-index:7;width:calc(var(--cell-size) * 2);height:calc(var(--cell-size) * 2);
  pointer-events:auto;touch-action:none;cursor:grab;border-radius:13px;border:1px solid rgba(158,235,255,.72);
  background:
    radial-gradient(circle at 50% 48%,rgba(214,249,255,.98) 0 7%,rgba(93,220,255,.78) 8% 18%,rgba(70,162,210,.25) 19% 38%,transparent 39%),
    linear-gradient(145deg,rgba(206,243,255,.22),rgba(42,116,158,.12));
  box-shadow:inset 0 0 20px rgba(93,220,255,.18),0 0 14px rgba(93,220,255,.17)
}
.core-device::before,.core-device::after{content:"";position:absolute;inset:10%;border:1px solid rgba(199,244,255,.28);border-radius:10px}
.core-device::after{inset:28%;border-radius:50%;border-color:rgba(226,251,255,.62);box-shadow:0 0 10px rgba(93,220,255,.35)}

.cell.hint-good{
  outline:2px solid var(--cyan);outline-offset:-3px;filter:brightness(1.18);
  box-shadow:inset 0 0 12px rgba(93,220,255,.28),0 0 7px rgba(93,220,255,.22)
}
.piece.hint-good{
  opacity:.84!important;filter:saturate(1)!important;outline:2px solid var(--cyan);outline-offset:1px;
  box-shadow:0 0 14px rgba(93,220,255,.28)
}
.cell.hint-focus{outline:2px solid var(--yellow);outline-offset:-3px;animation:hintPulse .85s ease-in-out infinite alternate}
.piece.hint-focus{
  opacity:1!important;filter:saturate(1)!important;outline:2px solid var(--yellow);outline-offset:1px;
  box-shadow:0 0 17px rgba(255,233,130,.36);animation:hintPulse .85s ease-in-out infinite alternate
}
.cell.hint-bad{outline:2px solid var(--red);outline-offset:-3px;animation:hintBad .72s ease-in-out infinite alternate}
.piece.hint-bad{
  opacity:.96!important;filter:saturate(1)!important;outline:2px solid var(--red);outline-offset:1px;
  box-shadow:0 0 16px rgba(255,118,95,.34);animation:hintBad .72s ease-in-out infinite alternate
}
.core-device.hint-good{box-shadow:inset 0 0 24px rgba(93,220,255,.34),0 0 19px rgba(93,220,255,.38)}
.core-device.hint-focus{border-color:var(--yellow);box-shadow:inset 0 0 24px rgba(255,233,130,.2),0 0 20px rgba(255,233,130,.42)}
.core-device.hint-bad{border-color:var(--red);box-shadow:inset 0 0 24px rgba(255,118,95,.18),0 0 20px rgba(255,118,95,.42)}
.hint-area-cell{
  position:absolute;z-index:8;width:var(--cell-size);height:var(--cell-size);pointer-events:none;border-radius:5px;
  background:rgba(93,220,255,.26);outline:1px solid rgba(116,232,255,.52);outline-offset:-2px
}
.hint-cell{
  position:absolute;z-index:9;width:var(--cell-size);height:var(--cell-size);pointer-events:none;
  border-radius:4px;opacity:.58;outline:2px solid #ecfdff;outline-offset:-2px;
  box-shadow:0 0 12px rgba(93,220,255,.44),inset 0 2px 0 rgba(255,255,255,.28)
}
@keyframes hintPulse{from{filter:brightness(1.05)}to{filter:brightness(1.48)}}
@keyframes hintBad{from{filter:brightness(1)}to{filter:brightness(1.42)}}

.msg{min-height:15px;margin:3px 2px 0;color:var(--muted);font-size:10px;text-align:center;line-height:15px;white-space:nowrap}
.msg.ok{color:var(--ok)}.msg.bad{color:var(--red)}

.gesture-guide{display:grid;grid-template-columns:repeat(4,1fr);gap:3px;margin-top:5px;flex:0 0 auto}
.gesture-chip{
  border:1px solid rgba(83,125,165,.30);background:rgba(13,27,46,.68);border-radius:9px;
  padding:4px 2px;text-align:center;font-size:9px;color:var(--muted);line-height:1.15
}
.gesture-chip b{display:inline;color:var(--text);font-size:10px;margin-right:2px}

.tray-head{display:flex;justify-content:space-between;align-items:center;margin:6px 2px 3px;font-size:10px;flex:0 0 auto}
.tray-head strong{letter-spacing:.06em}.tray-head span{color:var(--muted)}
.tray{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-template-rows:repeat(3,minmax(0,1fr));gap:4px;flex:0 0 auto}
.piece{
  position:relative;height:55px;min-height:55px;border:1px solid rgba(83,125,165,.38);border-radius:11px;
  background:linear-gradient(180deg,#122039,#0d192b);padding:3px;display:flex;align-items:center;justify-content:center;
  touch-action:none;overflow:hidden
}
.piece.selected{outline:2px solid var(--cyan);outline-offset:1px;box-shadow:0 0 14px rgba(93,220,255,.18)}
.piece.placed{opacity:.28;filter:saturate(.6)}
.piece-name{position:absolute;left:5px;top:4px;font-weight:950;font-size:8px;line-height:1;color:rgba(245,251,255,.68)}
.piece.placed .piece-name::after{content:" ✓";color:var(--ok)}
.mini{display:grid;gap:1.5px;align-items:center;justify-content:center;place-content:center;min-width:50px;min-height:42px}
.mcell{width:9px;height:9px;border-radius:2.3px;background:#8090ae;box-shadow:inset 0 1px 0 rgba(255,255,255,.34),0 1px 2px rgba(0,0,0,.22)}
.piece:not(.placed) .mini{filter:drop-shadow(0 0 5px rgba(255,255,255,.12))}

.drag-visual{
  position:fixed;left:0;top:0;z-index:30;pointer-events:none;display:none;opacity:.95;
  filter:drop-shadow(0 12px 14px rgba(0,0,0,.42)) drop-shadow(0 0 10px rgba(93,220,255,.16));
  transform:translate(-50%,-115%)
}
.drag-visual.show{display:block}.drag-grid{display:grid;gap:2px}
.drag-cell{width:25px;height:25px;border-radius:6px;border:1px solid rgba(255,255,255,.5);box-shadow:inset 0 2px 0 rgba(255,255,255,.2)}

.hold-ring{
  position:fixed;left:0;top:0;width:54px;height:54px;z-index:36;pointer-events:none;
  transform:translate(-50%,-50%);opacity:0;transition:opacity .08s ease
}
.hold-ring.show{opacity:1}
.hold-ring svg{width:100%;height:100%;transform:rotate(-90deg);filter:drop-shadow(0 0 6px rgba(93,220,255,.35))}
.hold-ring .track{fill:rgba(7,17,31,.55);stroke:rgba(142,167,191,.28);stroke-width:4}
.hold-ring .progress{fill:none;stroke:#74e8ff;stroke-width:5;stroke-linecap:round;stroke-dasharray:138.23;stroke-dashoffset:138.23}
.hold-ring.show .progress{animation:holdFill .52s linear forwards}
.hold-ring .hold-label{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:8px;font-weight:950;color:#eaffff}
@keyframes holdFill{to{stroke-dashoffset:0}}

.overlay{position:fixed;inset:0;background:rgba(5,8,18,.78);display:none;align-items:center;justify-content:center;padding:24px;z-index:40}
.overlay.show{display:flex}
.clear-card{
  width:min(360px,100%);background:linear-gradient(180deg,#14253f,#0b1728);border:1px solid rgba(113,184,225,.42);
  border-radius:24px;padding:24px;text-align:center;box-shadow:0 18px 60px rgba(0,0,0,.38)
}
.clear-card h2{margin:0;font-size:34px;letter-spacing:.08em;color:#dff9ff;text-shadow:0 0 22px rgba(93,220,255,.45)}
.clear-card p{color:var(--muted);line-height:1.6}
.clear-card button{width:100%;min-height:50px;border:0;border-radius:14px;background:var(--cyan);color:#06111a;font-weight:900}

@media(max-width:360px){
  .app{padding-left:6px;padding-right:6px}.brand{font-size:13px}.sub{display:none}
  .stat{min-width:42px;padding:3px 4px}.gesture-chip{font-size:8px;padding:3px 1px}.gesture-chip b{font-size:9px}
  .piece{height:50px;min-height:50px}.mcell{width:8px;height:8px}
  .hint-mini,.reset-mini{height:34px}.hint-mini{width:43px;font-size:7px}.reset-mini{width:34px}
}
</style>
</head>
<body>
<main class="app">
  <header class="top">
    <div>
      <div class="brand">BOON BLOCK</div>
      <div class="sub">ORIGINAL 6-CELL SET / EASY</div>
    </div>
    <div class="top-right">
      <div class="stats">
        <div class="stat"><b id="time">00:00</b><span>TIME</span></div>
        <div class="stat"><b id="moves">0</b><span>MOVE</span></div>
      </div>
      <button id="hint" type="button" class="hint-mini" aria-label="ヒント">HINT <span id="hintCount">0</span></button>
      <button id="reset" type="button" class="reset-mini" aria-label="最初から">↺</button>
    </div>
  </header>

  <section class="board-wrap">
    <div id="board" class="board" aria-label="8×8パズル盤"></div>
    <div id="msg" class="msg">読み込み中…</div>
  </section>

  <section class="gesture-guide" aria-label="操作方法">
    <div class="gesture-chip"><b>↻ タップ</b>回転</div>
    <div class="gesture-chip"><b>↔ フリック</b>反転</div>
    <div class="gesture-chip"><b>☝ ドラッグ</b>移動</div>
    <div class="gesture-chip"><b>◉ 長押し</b>WAIT</div>
  </section>

  <div class="tray-head"><strong>WAITING BLOCKS</strong><span><b id="count">1</b> / 11</span></div>
  <section id="tray" class="tray" aria-label="ピース一覧"></section>
</main>

<div id="dragVisual" class="drag-visual" aria-hidden="true"></div>
<div id="holdRing" class="hold-ring" aria-hidden="true">
  <svg viewBox="0 0 54 54"><circle class="track" cx="27" cy="27" r="22"></circle><circle class="progress" cx="27" cy="27" r="22"></circle></svg>
  <div class="hold-label">WAIT</div>
</div>

<div id="overlay" class="overlay" role="dialog" aria-modal="true">
  <div class="clear-card">
    <h2>CLEAR!</h2>
    <p id="clearText"></p>
    <button id="again" type="button">もう一度</button>
  </div>
</div>

<script src="solutions.js?v=1"></script>
<script>
(()=>{
const defs={
 "01":[[0,0],[0,1],[0,2],[0,3],[0,4],[1,1]],
 "02":[[0,0],[0,1],[0,2],[0,3],[0,4],[1,2]],
 "03":[[0,0],[0,1],[0,2],[0,3],[1,0],[1,1]],
 "04":[[0,0],[0,1],[0,2],[0,3],[1,1],[1,2]],
 "05":[[0,0],[0,1],[0,2],[1,0],[1,2],[1,3]],
 "06":[[0,0],[0,1],[0,2],[1,1],[1,2],[1,3]],
 "07":[[0,0],[0,1],[0,2],[1,1],[2,0],[2,1]],
 "08":[[0,0],[0,1],[0,2],[1,2],[2,2],[2,3]],
 "09":[[0,0],[0,1],[1,0],[1,1],[1,2],[2,1]],
 "10":[[0,0],[0,1],[1,0],[1,1],[1,2],[2,2]],
 CORE:[[0,0],[0,1],[1,0],[1,1]]
};
const ids=Object.keys(defs);
const symbols={"01":"A","02":"B","03":"C","04":"D","05":"E","06":"F","07":"G","08":"H","09":"I","10":"J",CORE:"O"};
const colors=[
 "var(--c0)","var(--c1)","var(--c2)","var(--c3)","var(--c4)",
 "var(--c5)","var(--c6)","var(--c7)","var(--c8)","var(--c9)","var(--core)"
];
const SOLUTIONS=Array.isArray(window.BOON_NEXT_SOLUTIONS)?window.BOON_NEXT_SOLUTIONS:[];
const SOLUTION_TOTAL=Number(window.BOON_NEXT_SOLUTION_COUNT||SOLUTIONS.length||0);
const CENTER_TOTAL=Number(window.BOON_NEXT_CENTER_COUNT||0);

const $=s=>document.querySelector(s);
const board=$("#board"),tray=$("#tray"),msg=$("#msg");
const timeEl=$("#time"),movesEl=$("#moves"),countEl=$("#count"),overlay=$("#overlay"),clearText=$("#clearText");
const dragVisual=$("#dragVisual"),holdRing=$("#holdRing"),hintCountEl=$("#hintCount");

const TAP_MOVE=10,DRAG_START=13,FLICK_DISTANCE=46,FLICK_TIME=280,FLICK_RATIO=1.45;
const LONG_PRESS_MS=520,LONG_PRESS_MOVE=9;

const norm=s=>{
 const mr=Math.min(...s.map(a=>a[0])),mc=Math.min(...s.map(a=>a[1]));
 return s.map(([r,c])=>[r-mr,c-mc]).sort((a,b)=>a[0]-b[0]||a[1]-b[1]);
};
const rot=s=>norm(s.map(([r,c])=>[c,-r]));
const flip=s=>norm(s.map(([r,c])=>[r,-c]));
const pieces={};
ids.forEach(id=>pieces[id]={shape:norm(defs[id]),placed:null,floating:false});
pieces.CORE.placed=[[3,3],[3,4],[4,3],[4,4]];

let selected="01",target=null,moves=0,start=0,timer=0;
let gesture=null,drag=null,justPlaced=null,longPressTimer=null;
let hintCount=0,hintStage=0,hintPlan=null;

function occupied(ignore){
 const m=new Map();
 ids.forEach(id=>{
   if(id===ignore)return;
   const p=pieces[id];
   if(p.placed&&!p.floating)p.placed.forEach(([r,c])=>m.set(r+","+c,id));
 });
 return m;
}
function validFor(id,cells){
 const occ=occupied(id);
 return cells.length===defs[id].length&&cells.every(([r,c])=>r>=0&&r<8&&c>=0&&c<8&&!occ.has(r+","+c));
}
function ghostCells(){
 if(!selected||!target||pieces[selected].placed)return [];
 return pieces[selected].shape.map(([r,c])=>[target.r+r,target.c+c]);
}
function valid(cells){return validFor(selected,cells);}
function setMsg(t,kind=""){msg.textContent=t;msg.className="msg"+(kind?" "+kind:"");}
function fmt(ms){const s=Math.floor(ms/1000),m=Math.floor(s/60);return String(m).padStart(2,"0")+":"+String(s%60).padStart(2,"0");}
function startClock(){if(start)return;start=Date.now();timer=setInterval(()=>timeEl.textContent=fmt(Date.now()-start),500);}
function haptic(ms=12){if(navigator.vibrate)navigator.vibrate(ms);}

function sizeBoard(){
 const app=document.querySelector(".app"),wrap=board.parentElement,top=document.querySelector(".top");
 const guide=document.querySelector(".gesture-guide"),trayHead=document.querySelector(".tray-head");
 const viewportH=window.visualViewport?window.visualViewport.height:window.innerHeight;
 const css=getComputedStyle(app),padY=parseFloat(css.paddingTop)+parseFloat(css.paddingBottom);
 const fixed=top.offsetHeight+guide.offsetHeight+trayHead.offsetHeight+tray.offsetHeight+padY+54;
 const byHeight=Math.floor((viewportH-fixed)/8),byWidth=Math.floor((wrap.clientWidth-2)/8);
 const cell=Math.max(26,Math.min(53,byWidth,byHeight));
 board.style.setProperty("--cell-size",cell+"px");
}
window.addEventListener("resize",sizeBoard);
if(window.visualViewport)window.visualViewport.addEventListener("resize",sizeBoard);

function bounds(shape){
 return {h:Math.max(...shape.map(a=>a[0]))+1,w:Math.max(...shape.map(a=>a[1]))+1};
}
function mini(shape){
 const b=bounds(shape),d=document.createElement("div");
 d.className="mini";d.style.gridTemplateColumns="repeat("+b.w+",9px)";
 const set=new Set(shape.map(a=>a.join(",")));
 for(let r=0;r<b.h;r++)for(let c=0;c<b.w;c++){
   const x=document.createElement("span");
   if(set.has(r+","+c))x.className="mcell";
   d.appendChild(x);
 }
 return d;
}
function buildDragVisual(){
 dragVisual.innerHTML="";
 const shape=pieces[selected].shape,b=bounds(shape),g=document.createElement("div");
 g.className="drag-grid";g.style.gridTemplateColumns="repeat("+b.w+",25px)";
 const set=new Set(shape.map(a=>a.join(",")));
 for(let r=0;r<b.h;r++)for(let c=0;c<b.w;c++){
   const x=document.createElement("span");
   if(set.has(r+","+c)){
     x.className="drag-cell";
     x.style.background=colors[ids.indexOf(selected)];
   }else{
     x.style.width="25px";x.style.height="25px";
   }
   g.appendChild(x);
 }
 dragVisual.appendChild(g);
}
function moveDragVisual(x,y){dragVisual.style.left=x+"px";dragVisual.style.top=y+"px";}
function targetFromPointer(x,y){
 const rect=board.getBoundingClientRect(),cell=rect.width/8,b=bounds(pieces[selected].shape);
 const liftedY=y-cell*.85;
 return {
   c:Math.floor((x-rect.left)/cell)-Math.floor((b.w-1)/2),
   r:Math.floor((liftedY-rect.top)/cell)-Math.floor((b.h-1)/2)
 };
}
function pointerNearBoard(x,y){
 const r=board.getBoundingClientRect(),pad=34;
 return x>=r.left-pad&&x<=r.right+pad&&y>=r.top-pad&&y<=r.bottom+pad;
}
function placementAnchor(cells){
 return {r:Math.min(...cells.map(a=>a[0])),c:Math.min(...cells.map(a=>a[1]))};
}

// ---------- COMPLETE-SOLUTION HINT ENGINE ----------

function pieceMatchesSolution(id,solution){
 const p=pieces[id];
 if(!p.placed||p.floating)return true;
 const symbol=symbols[id];
 return p.placed.every(([r,c])=>r>=0&&r<8&&c>=0&&c<8&&solution[r*8+c]===symbol);
}
function matchingSolutions(fixedIds){
 if(!SOLUTIONS.length)return [];
 return SOLUTIONS.filter(solution=>fixedIds.every(id=>pieceMatchesSolution(id,solution)));
}
function solutionCells(solution,id){
 const symbol=symbols[id],cells=[];
 for(let i=0;i<64;i++)if(solution[i]===symbol)cells.push([Math.floor(i/8),i%8]);
 return cells;
}
function cellsKey(cells){return cells.map(([r,c])=>r*8+c).sort((a,b)=>a-b).join(",");}
function placementDistribution(candidates,id){
 const map=new Map(),heat=new Uint32Array(64);
 for(const solution of candidates){
   const cells=solutionCells(solution,id),key=cellsKey(cells);
   let g=map.get(key);
   if(!g){g={cells,count:0};map.set(key,g);}
   g.count++;
   for(const [r,c] of cells)heat[r*8+c]++;
 }
 let best=null;
 for(const g of map.values())if(!best||g.count>best.count)best=g;
 let max=0;for(const n of heat)max=Math.max(max,n);
 const areaCells=[];
 if(max)for(let i=0;i<64;i++)if(heat[i])areaCells.push({r:Math.floor(i/8),c:i%8,score:heat[i]/max});
 return {distinct:map.size,best,areaCells};
}
function chooseNextPiece(candidates,choices){
 let pick=null;
 for(const id of choices){
   const d=placementDistribution(candidates,id);
   if(!pick||d.distinct<pick.d.distinct||(d.distinct===pick.d.distinct&&d.best&&pick.d.best&&d.best.count>pick.d.best.count)){
     pick={id,d};
   }
 }
 return pick;
}
function buildRepairPlan(fixedIds){
 if(!fixedIds.length||!SOLUTIONS.length)return null;
 let bestGood=-1,groups=new Map();

 for(const solution of SOLUTIONS){
   const good=[],wrong=[];
   for(const id of fixedIds){
     if(pieceMatchesSolution(id,solution))good.push(id);
     else wrong.push(id);
   }
   if(good.length<bestGood)continue;
   if(good.length>bestGood){bestGood=good.length;groups=new Map();}
   const key=wrong.join("|");
   let g=groups.get(key);
   if(!g){g={goodIds:good,wrongIds:wrong,count:0};groups.set(key,g);}
   g.count++;
 }
 let chosen=null;
 for(const g of groups.values())if(!chosen||g.count>chosen.count)chosen=g;
 if(!chosen)return null;

 const recovered=matchingSolutions(chosen.goodIds);
 const focus=chooseNextPiece(recovered,chosen.wrongIds);
 return {
   type:"repair",goodIds:chosen.goodIds,wrongIds:chosen.wrongIds,
   candidateCount:recovered.length,piece:focus?focus.id:chosen.wrongIds[0],
   areaCells:focus?focus.d.areaCells:[],cells:focus&&focus.d.best?focus.d.best.cells:null,
   placementCount:focus?focus.d.distinct:0
 };
}
function buildHintPlan(){
 if(!SOLUTIONS.length)return {type:"loading"};
 const fixedIds=ids.filter(id=>pieces[id].placed&&!pieces[id].floating);
 const matches=matchingSolutions(fixedIds);
 if(matches.length){
   const choices=ids.filter(id=>!pieces[id].placed||pieces[id].floating);
   const focus=choices.length?chooseNextPiece(matches,choices):null;
   return {
     type:"route",goodIds:fixedIds,wrongIds:[],candidateCount:matches.length,
     piece:focus?focus.id:null,areaCells:focus?focus.d.areaCells:[],
     cells:focus&&focus.d.best?focus.d.best.cells:null,placementCount:focus?focus.d.distinct:0
   };
 }
 return buildRepairPlan(fixedIds)||{type:"none"};
}
function resetHintPlan(){hintStage=0;hintPlan=null;}
function useHint(){
 if(!SOLUTIONS.length){
   setMsg("HINT DBを読み込めませんでした","bad");haptic(18);return;
 }
 if(hintStage===0||hintStage>=3||!hintPlan){
   hintPlan=buildHintPlan();
   hintStage=0;
 }
 if(!hintPlan||hintPlan.type==="none"){
   setMsg("正解ルートを特定できませんでした","bad");haptic(18);return;
 }

 hintStage++;
 hintCount++;
 hintCountEl.textContent=hintCount;
 renderAll();

 if(hintPlan.type==="repair"){
   const names=hintPlan.wrongIds.join("・");
   if(hintStage===1)setMsg("候補0｜赤:"+names+" を直すと "+hintPlan.candidateCount+"通り","bad");
   else if(hintStage===2)setMsg("次は "+hintPlan.piece+"｜候補 "+hintPlan.placementCount+"パターン","ok");
   else setMsg(hintPlan.piece+"｜有力な置き直し位置","ok");
 }else{
   if(hintStage===1)setMsg("候補 "+hintPlan.candidateCount+"/"+SOLUTION_TOTAL+"｜シアン=OK｜次 "+hintPlan.piece,"ok");
   else if(hintStage===2)setMsg(hintPlan.piece+"｜置ける候補 "+hintPlan.placementCount+"パターン","ok");
   else setMsg(hintPlan.piece+"｜有力な正解位置","ok");
 }
 haptic(10);
}

// ---------- PIECE INTERACTION ----------

function transformPiece(id,kind){
 resetHintPlan();selected=id;
 if(id==="CORE"){
   renderAll();setMsg("COREは2×2のまま動かせます","ok");haptic();return;
 }
 const p=pieces[id],nextShape=kind==="rotate"?rot(p.shape):flip(p.shape);
 if(p.placed){
   const a=placementAnchor(p.placed);
   const cells=nextShape.map(([r,c])=>[a.r+r,a.c+c]);
   p.shape=nextShape;p.placed=cells;p.floating=!validFor(id,cells);
   if(!p.floating)justPlaced=id;
 }else p.shape=nextShape;
 target=null;renderAll();
 setMsg(p.floating?(kind==="rotate"?"↻ 回転":"↔ 反転")+"：仮表示中":(kind==="rotate"?"↻ 回転":"↔ 反転"),p.floating?"bad":"ok");
 haptic();
}
function showHoldRing(x,y){
 holdRing.style.left=x+"px";holdRing.style.top=y+"px";holdRing.classList.remove("show");
 void holdRing.offsetWidth;holdRing.classList.add("show");
}
function clearLongPress(){
 if(longPressTimer){clearTimeout(longPressTimer);longPressTimer=null;}
 holdRing.classList.remove("show");
}
function armLongPress(id,pointerId,x,y){
 clearLongPress();
 if(!pieces[id].placed)return;
 showHoldRing(x,y);
 longPressTimer=setTimeout(()=>{
   if(!gesture||gesture.id!==id||gesture.pointerId!==pointerId||gesture.dragging)return;
   const dx=gesture.lastX-gesture.startX,dy=gesture.lastY-gesture.startY;
   if(Math.hypot(dx,dy)>LONG_PRESS_MOVE)return;
   gesture=null;longPressTimer=null;holdRing.classList.remove("show");returnToWait(id);
 },LONG_PRESS_MS);
}
function beginGesture(id,e){
 if(e.pointerType==="mouse"&&e.button!==0)return;
 e.preventDefault();selected=id;target=null;
 gesture={
   id,pointerId:e.pointerId,startX:e.clientX,startY:e.clientY,lastX:e.clientX,lastY:e.clientY,
   startTime:performance.now(),dragging:false,
   originalPlacement:pieces[id].placed?pieces[id].placed.map(a=>[...a]):null,
   originalFloating:!!pieces[id].floating
 };
 armLongPress(id,e.pointerId,e.clientX,e.clientY);
 if(pieces[id].placed)setMsg("長押しでWAIT / ドラッグで移動");
 renderTray();
}
function beginDrag(){
 if(!gesture||gesture.dragging)return;
 clearLongPress();resetHintPlan();gesture.dragging=true;selected=gesture.id;
 if(pieces[selected].placed)pieces[selected].placed=null;
 pieces[selected].floating=false;
 drag={id:selected,pointerId:gesture.pointerId};
 buildDragVisual();dragVisual.classList.add("show");renderAll();setMsg("そのまま盤面へ");
}
function updateDragTarget(x,y){
 if(!drag)return;
 moveDragVisual(x,y);
 if(pointerNearBoard(x,y)){
   target=targetFromPointer(x,y);renderBoard();
   const ok=valid(ghostCells());
   setMsg(ok?"ここで離すと置けます":"そこには置けません",ok?"ok":"bad");
 }else{target=null;renderBoard();}
}
function restoreOriginal(){
 if(!gesture)return;
 if(gesture.originalPlacement)pieces[gesture.id].placed=gesture.originalPlacement.map(a=>[...a]);
 pieces[gesture.id].floating=!!gesture.originalFloating;
 target=null;drag=null;dragVisual.classList.remove("show");
}
function returnToWait(id){
 resetHintPlan();pieces[id].placed=null;pieces[id].floating=false;
 selected=id;target=null;drag=null;dragVisual.classList.remove("show");
 renderAll();setMsg(id+" をWAITへ戻しました","ok");haptic(16);
}
function lockSelected(){
 resetHintPlan();
 const cells=ghostCells();
 if(!valid(cells))return false;
 startClock();
 const lockedId=selected;
 pieces[lockedId].placed=cells.map(a=>[...a]);pieces[lockedId].floating=false;justPlaced=lockedId;
 moves++;movesEl.textContent=moves;
 const next=ids.find(id=>!pieces[id].placed||pieces[id].floating);
 target=null;if(next)selected=next;
 drag=null;dragVisual.classList.remove("show");
 renderAll();setMsg("カチッ！","ok");haptic(18);

 if(ids.every(id=>pieces[id].placed&&!pieces[id].floating)){
   clearInterval(timer);timeEl.textContent=fmt(Date.now()-start);
   clearText.textContent="TIME "+timeEl.textContent+" / MOVE "+moves+" / HINT "+hintCount;
   haptic(35);setTimeout(()=>overlay.classList.add("show"),450);
 }
 return true;
}
function finishGesture(e){
 if(!gesture||e.pointerId!==gesture.pointerId)return;
 clearLongPress();
 const g=gesture,dx=e.clientX-g.startX,dy=e.clientY-g.startY;
 const ax=Math.abs(dx),ay=Math.abs(dy),dist=Math.hypot(dx,dy),dt=performance.now()-g.startTime;
 const isFlick=ax>=FLICK_DISTANCE&&dt<=FLICK_TIME&&ax>ay*FLICK_RATIO;

 if(isFlick){
   if(g.dragging)restoreOriginal();
   gesture=null;transformPiece(g.id,"flip");return;
 }
 if(g.dragging){
   if(target&&valid(ghostCells())){gesture=null;lockSelected();}
   else{
     restoreOriginal();gesture=null;renderAll();
     setMsg(target?"そこには置けません":"元の位置に戻しました",target?"bad":"");
   }
   return;
 }
 gesture=null;
 if(dist<=TAP_MOVE)transformPiece(g.id,"rotate");
 else setMsg("ドラッグで移動 / 横フリックで反転");
}

function addPreviewCells(cells,id,bad=false,interactive=false){
 cells.forEach(([r,c])=>{
   const x=document.createElement("div");
   x.className="preview-cell"+(bad?" bad":"")+(interactive?" interactive":"");
   x.style.left="calc(var(--cell-size) * "+c+")";
   x.style.top="calc(var(--cell-size) * "+r+")";
   x.style.background=colors[ids.indexOf(id)];
   if(interactive)x.addEventListener("pointerdown",e=>beginGesture(id,e));
   board.appendChild(x);
 });
}

function renderBoard(){
 board.innerHTML="";
 const occ=occupied();
 for(let r=0;r<8;r++)for(let c=0;c<8;c++){
   const v=occ.get(r+","+c),b=document.createElement("button");
   b.type="button";b.className="cell";b.setAttribute("aria-label",(r+1)+"行 "+(c+1)+"列");
   if(v){
     b.classList.add("filled");b.dataset.piece=v;b.style.background=colors[ids.indexOf(v)];
     if(v==="CORE")b.classList.add("core");
     if(v===justPlaced)b.classList.add("confirm-pop");
     if(hintPlan&&hintStage>=1){
       if(hintPlan.goodIds&&hintPlan.goodIds.includes(v))b.classList.add("hint-good");
       if(hintPlan.wrongIds&&hintPlan.wrongIds.includes(v)&&!(hintStage>=2&&v===hintPlan.piece))b.classList.add("hint-bad");
       if(hintStage>=2&&v===hintPlan.piece)b.classList.add("hint-focus");
     }
   }
   b.addEventListener("pointerdown",e=>{if(v)beginGesture(v,e);});
   board.appendChild(b);
 }

 const cp=pieces.CORE;
 if(cp.placed&&!cp.floating){
   const a=placementAnchor(cp.placed),core=document.createElement("div");
   core.className="core-device";
   if(hintPlan&&hintStage>=1){
     if(hintPlan.goodIds&&hintPlan.goodIds.includes("CORE"))core.classList.add("hint-good");
     if(hintPlan.wrongIds&&hintPlan.wrongIds.includes("CORE")&&!(hintStage>=2&&hintPlan.piece==="CORE"))core.classList.add("hint-bad");
     if(hintStage>=2&&hintPlan.piece==="CORE")core.classList.add("hint-focus");
   }
   core.style.left="calc(var(--cell-size) * "+a.c+")";
   core.style.top="calc(var(--cell-size) * "+a.r+")";
   core.addEventListener("pointerdown",e=>beginGesture("CORE",e));
   board.appendChild(core);
 }

 const ghost=ghostCells();
 if(ghost.length)addPreviewCells(ghost,selected,!valid(ghost),false);

 ids.forEach(id=>{
   const p=pieces[id];
   if(p.floating&&p.placed)addPreviewCells(p.placed,id,true,true);
 });

 if(hintPlan&&hintStage===2&&hintPlan.areaCells&&hintPlan.areaCells.length){
   hintPlan.areaCells.forEach(a=>{
     const x=document.createElement("div");
     x.className="hint-area-cell";
     x.style.left="calc(var(--cell-size) * "+a.c+")";
     x.style.top="calc(var(--cell-size) * "+a.r+")";
     x.style.opacity=String(.14+.62*a.score);
     board.appendChild(x);
   });
 }
 if(hintPlan&&hintStage>=3&&hintPlan.cells&&hintPlan.piece){
   hintPlan.cells.forEach(([r,c])=>{
     const x=document.createElement("div");
     x.className="hint-cell";
     x.style.left="calc(var(--cell-size) * "+c+")";
     x.style.top="calc(var(--cell-size) * "+r+")";
     x.style.background=colors[ids.indexOf(hintPlan.piece)];
     board.appendChild(x);
   });
 }

 if(justPlaced)setTimeout(()=>{justPlaced=null;},260);
}
function renderTray(){
 tray.innerHTML="";
 ids.forEach((id,i)=>{
   const b=document.createElement("button");
   b.type="button";b.className="piece";
   if(id===selected)b.classList.add("selected");
   if(hintPlan&&hintStage>=1){
     if(hintPlan.goodIds&&hintPlan.goodIds.includes(id))b.classList.add("hint-good");
     if(hintPlan.wrongIds&&hintPlan.wrongIds.includes(id)&&!(hintStage>=2&&id===hintPlan.piece))b.classList.add("hint-bad");
     if(id===hintPlan.piece)b.classList.add("hint-focus");
   }
   if(pieces[id].placed&&!pieces[id].floating)b.classList.add("placed");
   if(pieces[id].floating)b.classList.add("selected");

   const n=document.createElement("span");n.className="piece-name";n.textContent=id;
   const m=mini(pieces[id].shape);m.querySelectorAll(".mcell").forEach(x=>x.style.background=colors[i]);
   b.append(n,m);b.addEventListener("pointerdown",e=>beginGesture(id,e));tray.appendChild(b);
 });
 countEl.textContent=ids.filter(id=>pieces[id].placed&&!pieces[id].floating).length;
}
function renderAll(){renderBoard();renderTray();requestAnimationFrame(sizeBoard);}

window.addEventListener("pointermove",e=>{
 if(!gesture||e.pointerId!==gesture.pointerId)return;
 e.preventDefault();gesture.lastX=e.clientX;gesture.lastY=e.clientY;
 const dx=e.clientX-gesture.startX,dy=e.clientY-gesture.startY,dist=Math.hypot(dx,dy);
 if(dist>LONG_PRESS_MOVE)clearLongPress();
 if(!gesture.dragging&&dist>=DRAG_START)beginDrag();
 if(gesture.dragging)updateDragTarget(e.clientX,e.clientY);
},{passive:false});
window.addEventListener("pointerup",finishGesture);
window.addEventListener("pointercancel",e=>{
 if(!gesture||e.pointerId!==gesture.pointerId)return;
 clearLongPress();if(gesture.dragging)restoreOriginal();gesture=null;renderAll();setMsg("操作をキャンセルしました");
});

function reset(){
 clearInterval(timer);clearLongPress();start=0;timer=0;moves=0;
 movesEl.textContent="0";timeEl.textContent="00:00";
 ids.forEach(id=>{pieces[id].shape=norm(defs[id]);pieces[id].placed=null;pieces[id].floating=false;});
 pieces.CORE.placed=[[3,3],[3,4],[4,3],[4,4]];
 selected="01";target=null;gesture=null;drag=null;justPlaced=null;
 hintCount=0;hintCountEl.textContent="0";resetHintPlan();
 holdRing.classList.remove("show");dragVisual.classList.remove("show");overlay.classList.remove("show");
 renderAll();
 setMsg(SOLUTIONS.length===1832?CENTER_TOTAL+"ルートからSTART / COREは動かせます":"HINT DBを読み込めませんでした",SOLUTIONS.length===1832?"ok":"bad");
}

$("#hint").addEventListener("click",useHint);
$("#reset").addEventListener("click",reset);
$("#again").addEventListener("click",reset);

renderAll();requestAnimationFrame(sizeBoard);
setMsg(SOLUTIONS.length===1832?CENTER_TOTAL+"ルートからSTART / 全"+SOLUTION_TOTAL+"解":"HINT DBを読み込めませんでした",SOLUTIONS.length===1832?"ok":"bad");
})();
</script>
