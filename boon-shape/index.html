function makeRuntime(s){

  const defs=partitionMask(s),fullMask=(1n<<BigInt(maskCells.length))-1n,placements={},byCell=Array.from({length:maskCells.length},()=>[]);
  function toMask(cells){
    let m=0n;

    return m
  }
  defs.forEach(def=>{
    const arr=[],seen=new Set(),masterCells=def.base.map(([r,c])=>[r+def.master.r,c+def.master.c]),masterKey=cellsKey(masterCells);

        const cells=sh.map(([rr,cc])=>[rr+r,cc+c]);
        if(!cells.every(([rr,cc])=>maskSet.has(keyOf(rr,cc))))continue;
        const mask=toMask(cells),mk=mask.toString();
        if(seen.has(mk))continue;seen.add(mk);

    arr.sort((a,b)=>(b.isMaster?1:0)-(a.isMaster?1:0));

function solve(fixed={},nodeLimit=90000){

  }

    for(const removed of combos(placed,n)){

    bestHints:prev.bestHints===undefined?hintCount:Math.min(prev.bestHints,hintCount),
    lastClear:new Date().toISOString()
  };
  p.lastStage=stage.key;saveProgress(p);renderProgress();
  return p.completed[stage.key]
}
function lockSelected(){
  const cells=ghostCells();if(!validFor(selected,cells))return false;
  startClock();const id=selected;pieces[id].placed=cells.map(a=>[...a]);justPlaced=id;moves++;movesEl.textContent=moves;
  const next=ids.find(x=>!pieces[x].placed);target=null;if(next)selected=next;
  drag=null;dragVisual.classList.remove("show");renderAll();setMsg("カチッ！ ぴったり！","ok");haptic(18);
  const placedNow=ids.filter(x=>pieces[x].placed).length;
  if(placedNow===2)halloweenBlast(1,"TRICK OR SHAPE!");
  else if(placedNow===Math.ceil(ids.length*.72)&&placedNow<ids.length)halloweenBlast(2,"HAUNTED COMBO!");
  if(ids.every(x=>pieces[x].placed)){
    clearInterval(timer);if(start)timeEl.textContent=fmt(Date.now()-start);const rec=registerClear();
    clearAnimating=true;renderAll();setMsg("カチャッ！ "+stage.jp+" が黄金化した！","ok");
    clearIcon.textContent=stage.icon;clearText.textContent=stage.difficulty+" / "+runtime.maskCells.length+" BLOCKS / "+ids.length+" PIECES\\nTIME "+timeEl.textContent+" / MOVE "+moves+" / HINT "+hintCount;
    halloweenBlast(3,"HALLOWEEN FEVER!");haptic(35);setTimeout(()=>overlay.classList.add("show"),1350)
  }
  return true
}
function finishGesture(e){
  if(!gesture||e.pointerId!==gesture.pointerId)return;clearLongPress();
  const g=gesture,dx=e.clientX-g.startX,dy=e.clientY-g.startY,ax=Math.abs(dx),ay=Math.abs(dy),dist=Math.hypot(dx,dy),dt=performance.now()-g.startTime;
  const isFlick=ax>=FLICK_DISTANCE&&dt<=FLICK_TIME&&ax>ay*FLICK_RATIO;
  if(isFlick){if(g.dragging)restoreOriginal(g);gesture=null;transformPiece(g.id,"flip");return}
  if(g.dragging){
    if(target&&validFor(g.id,ghostCells())){gesture=null;lockSelected()}
    else{restoreOriginal(g);gesture=null;renderAll();setMsg(target?"そこは入らないよ":"もとの場所にもどしたよ",target?"bad":"")}
    return
  }
  gesture=null;if(dist<=TAP_MOVE)transformPiece(g.id,"rotate")
}

function scramblePieces(){
  pieces={};ids=runtime.defs.map(d=>d.id);
  runtime.defs.forEach((d,i)=>{
    let sh=norm(d.base),turns=1+((stage.seed+i*7)%3);
    for(let n=0;n<turns;n++)sh=rot(sh);
    if(stage.allowFlip&&((stage.seed+i*11)%2))sh=flip(sh);
    pieces[d.id]={base:norm(d.base),shape:sh,placed:null,size:d.size}
  });
  selected=ids[0]
}
function updateStageChrome(){
  const stars="★".repeat(stage.difficulty==="EASY"?1:stage.difficulty==="NORMAL"?2:3);
  questCopy.innerHTML='<span class="diff '+stage.difficulty+'">'+stage.difficulty+" "+stars+'</span>'+stage.icon+" "+stage.jp+" · "+runtime.maskCells.length+" BLOCKS";
  boardTitle.textContent=stage.icon+" "+stage.name+" · "+runtime.maskCells.length;
  trayTitle.textContent=stage.name+" PIECES";pieceTotalEl.textContent=ids.length;
  flipGuide.textContent=stage.allowFlip?"反転":"反転なし";
  board.setAttribute("aria-label",stage.jp+" "+runtime.maskCells.length+"マスのパズル盤")
}
function resetRound(){
  clearInterval(timer);clearLongPress();start=0;timer=0;moves=0;hintCount=0;hintStage=0;hintPlan=null;clearAnimating=false;gesture=null;drag=null;target=null;justPlaced=null;
  movesEl.textContent="0";timeEl.textContent="00:00";hintCountEl.textContent="0";overlay.classList.remove("show");dragVisual.classList.remove("show");board.classList.remove("clearing");
  scramblePieces();updateStageChrome();renderAll();setMsg(stage.difficulty+" "+stage.icon+" "+stage.jp+" — "+ids.length+"ピースで完成させよう！")
}
function loadStage(index){
  if(!STAGES.length)return setMsg("ステージデータを読み込めなかったよ","bad");
  stageIndex=(index+STAGES.length)%STAGES.length;stage=STAGES[stageIndex];runtime=makeRuntime(stage);
  const p=loadProgress();p.lastStage=stage.key;saveProgress(p);resetRound();renderStageBook();setTimeout(()=>halloweenBlast(1,"HAUNTED STAGE!"),260)
}

function stageMini(card,s){
  const cells=stageMask(s),rows=s.mask.length,cols=s.mask[0].length,unit=Math.max(2,Math.min(5,Math.floor(47/cols),Math.floor(38/rows)));
  const d=document.createElement("div");d.className="stage-mini";d.style.width=(cols*unit)+"px";d.style.height=(rows*unit)+"px";
  cells.forEach(([r,c])=>{const x=document.createElement("i");x.className="stage-pixel";x.style.width=unit+"px";x.style.height=unit+"px";x.style.left=(c*unit)+"px";x.style.top=(r*unit)+"px";d.appendChild(x)});
  card.appendChild(d)
}
function renderProgress(){
  const n=completedCount();progressMini.textContent=n+"/"+STAGES.length;collectionCount.textContent=n+" / "+STAGES.length;collectionBar.style.width=(STAGES.length?n/STAGES.length*100:0)+"%"
}
function renderStageBook(){
  renderProgress();stageScroll.innerHTML="";const progress=loadProgress();
  ["EASY","NORMAL","HARD"].forEach(level=>{
    const title=document.createElement("div");title.className="level-title";
    const stars=level==="EASY"?"★":level==="NORMAL"?"★★":"★★★";
    title.innerHTML='<span class="'+level+'">'+level+" "+stars+"</span><b>"+(level==="EASY"?"やさしい形":level==="NORMAL"?"ひねりのある形":"激ムズ形状")+"</b>";
    stageScroll.appendChild(title);
    const grid=document.createElement("div");grid.className="stage-grid";
    STAGES.forEach((s,i)=>{
      if(s.difficulty!==level)return;
      const done=!!progress.completed[s.key],card=document.createElement("button");card.type="button";card.className="stage-card"+(done?" done":"")+(i===stageIndex?" current":"");
      stageMini(card,s);
      const strong=document.createElement("strong");strong.textContent=String(i+1).padStart(2,"0")+" "+s.name;card.appendChild(strong);
      const small=document.createElement("small");small.textContent=stageMask(s).length+" BLOCKS · "+s.pieces+" PIECES";card.appendChild(small);
      const medal=document.createElement("span");medal.className="medal";medal.textContent=done?"GOLD ✓":"?";card.appendChild(medal);
      card.addEventListener("click",()=>{stageOverlay.classList.remove("show");loadStage(i)});grid.appendChild(card)
    });
    stageScroll.appendChild(grid)
  })
}
function openStageBook(){renderStageBook();stageOverlay.classList.add("show")}
function closeStageBook(){stageOverlay.classList.remove("show")}

window.addEventListener("pointermove",e=>{
  if(!gesture||e.pointerId!==gesture.pointerId)return;e.preventDefault();gesture.lastX=e.clientX;gesture.lastY=e.clientY;
  const dx=e.clientX-gesture.startX,dy=e.clientY-gesture.startY,dist=Math.hypot(dx,dy);
  if(dist>LONG_PRESS_MOVE)clearLongPress();
  if(!gesture.dragging&&dist>=DRAG_START)beginDrag();
  if(gesture&&gesture.dragging)updateDrag(e.clientX,e.clientY)
},{passive:false});
window.addEventListener("pointerup",finishGesture);
window.addEventListener("pointercancel",e=>{
  if(!gesture||e.pointerId!==gesture.pointerId)return;clearLongPress();
  if(gesture.dragging)restoreOriginal(gesture);gesture=null;renderAll();setMsg("キャンセルしたよ")
});
window.addEventListener("resize",()=>runtime&&sizeBoard());
if(window.visualViewport)window.visualViewport.addEventListener("resize",()=>runtime&&sizeBoard());

$("#hint").addEventListener("click",useHint);
$("#reset").addEventListener("click",resetRound);
$("#again").addEventListener("click",resetRound);
$("#nextStage").addEventListener("click",()=>loadStage(stageIndex+1));
$("#stageOpen").addEventListener("click",openStageBook);
$("#stageClose").addEventListener("click",closeStageBook);
stageOverlay.addEventListener("pointerdown",e=>{if(e.target===stageOverlay)closeStageBook()});

const saved=loadProgress(),savedIndex=Math.max(0,STAGES.findIndex(s=>s.key===saved.lastStage));
loadStage(savedIndex>=0?savedIndex:0);
})();
</script>
</body>
</html>
