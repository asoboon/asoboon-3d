<script>
(()=>{
const defs={
 F:[[0,1],[0,2],[1,0],[1,1],[2,1]],
 I:[[0,0],[1,0],[2,0],[3,0],[4,0]],
 L:[[0,0],[1,0],[2,0],[3,0],[3,1]],
 P:[[0,0],[0,1],[1,0],[1,1],[2,0]],
 N:[[0,0],[1,0],[1,1],[2,1],[3,1]],
 T:[[0,0],[0,1],[0,2],[1,1],[2,1]],
 U:[[0,0],[0,2],[1,0],[1,1],[1,2]],
 V:[[0,0],[1,0],[2,0],[2,1],[2,2]],
 W:[[0,0],[1,0],[1,1],[2,1],[2,2]],
 X:[[0,1],[1,0],[1,1],[1,2],[2,1]],
 Y:[[0,0],[1,0],[2,0],[3,0],[1,1]],
 Z:[[0,0],[0,1],[1,1],[2,1],[2,2]],
 CORE:[[0,0],[0,1],[1,0],[1,1]]
};
const ids=Object.keys(defs);
const blocked=new Set();
const colors=["var(--c0)","var(--c1)","var(--c2)","var(--c3)","var(--c4)","var(--c5)","var(--c6)","var(--c7)","var(--c8)","var(--c9)","var(--c10)","var(--c11)","var(--core)"];
const $=s=>document.querySelector(s);
const board=$("#board"),tray=$("#tray"),msg=$("#msg");
const timeEl=$("#time"),movesEl=$("#moves"),countEl=$("#count"),overlay=$("#overlay"),clearText=$("#clearText"),dragVisual=$("#dragVisual"),holdRing=$("#holdRing"),hintCountEl=$("#hintCount");

const TAP_MOVE=10;
const DRAG_START=13;
const FLICK_DISTANCE=46;
const FLICK_TIME=280;
const FLICK_RATIO=1.45;
const LONG_PRESS_MS=520;
const LONG_PRESS_MOVE=9;

const norm=s=>{
 const mr=Math.min(...s.map(a=>a[0])),mc=Math.min(...s.map(a=>a[1]));
 return s.map(([r,c])=>[r-mr,c-mc]).sort((a,b)=>a[0]-b[0]||a[1]-b[1]);
};
const rot=s=>norm(s.map(([r,c])=>[c,-r]));
const flip=s=>norm(s.map(([r,c])=>[r,-c]));
const pieces={};ids.forEach(id=>pieces[id]={shape:norm(defs[id]),placed:null,floating:false});
pieces.CORE.placed=[[3,3],[3,4],[4,3],[4,4]];

let selected="F",target=null,moves=0,start=0,timer=0;
let gesture=null,drag=null,justPlaced=null,longPressTimer=null;
let hintCount=0,hintStage=0,hintPlan=null;

function occupied(ignore){
 const m=new Map();
 ids.forEach(id=>{
   if(id===ignore)return;
   const p=pieces[id];
   if(p.placed&&!p.floating)p.placed.forEach(([r,c])=>m.set(r+","+c,id));
 });
 return m;
}
function validFor(id,cells){
 const occ=occupied(id);
 return cells.length===defs[id].length&&cells.every(([r,c])=>r>=0&&r<8&&c>=0&&c<8&&!occ.has(r+","+c));
}
function ghostCells(){
 if(!selected||!target||pieces[selected].placed)return [];
 return pieces[selected].shape.map(([r,c])=>[target.r+r,target.c+c]);
}
function valid(cells){return validFor(selected,cells);}
function setMsg(t,kind=""){msg.textContent=t;msg.className="msg"+(kind?" "+kind:"");}
function fmt(ms){const s=Math.floor(ms/1000),m=Math.floor(s/60);return String(m).padStart(2,"0")+":"+String(s%60).padStart(2,"0");}
function startClock(){if(start)return;start=Date.now();timer=setInterval(()=>timeEl.textContent=fmt(Date.now()-start),500);}
function haptic(ms=12){if(navigator.vibrate)navigator.vibrate(ms);}

function sizeBoard(){
 const app=document.querySelector(".app");
 const wrap=board.parentElement;
 const top=document.querySelector(".top");
 const guide=document.querySelector(".gesture-guide");
 const trayHead=document.querySelector(".tray-head");
 const viewportH=window.visualViewport?window.visualViewport.height:window.innerHeight;
 const css=getComputedStyle(app);
 const padY=parseFloat(css.paddingTop)+parseFloat(css.paddingBottom);
 const fixed=top.offsetHeight+guide.offsetHeight+trayHead.offsetHeight+tray.offsetHeight+padY+54;
 const byHeight=Math.floor((viewportH-fixed)/8);
 const byWidth=Math.floor((wrap.clientWidth-2)/8);
 const cell=Math.max(27,Math.min(53,byWidth,byHeight));
 board.style.setProperty("--cell-size",cell+"px");
}
window.addEventListener("resize",sizeBoard);
if(window.visualViewport)window.visualViewport.addEventListener("resize",sizeBoard);

function bounds(shape){
 return {h:Math.max(...shape.map(a=>a[0]))+1,w:Math.max(...shape.map(a=>a[1]))+1};
}
function mini(shape,big=false){
 const b=bounds(shape),d=document.createElement("div");
 d.className="mini";d.style.gridTemplateColumns="repeat("+b.w+","+(big?14:12)+"px)";
 const set=new Set(shape.map(a=>a.join(",")));
 for(let r=0;r<b.h;r++)for(let c=0;c<b.w;c++){
   const x=document.createElement("span");
   if(set.has(r+","+c))x.className="mcell";
   d.appendChild(x);
 }
 return d;
}
function buildDragVisual(){
 dragVisual.innerHTML="";
 const shape=pieces[selected].shape,b=bounds(shape),g=document.createElement("div");
 g.className="drag-grid";g.style.gridTemplateColumns="repeat("+b.w+",25px)";
 const set=new Set(shape.map(a=>a.join(",")));
 for(let r=0;r<b.h;r++)for(let c=0;c<b.w;c++){
   const x=document.createElement("span");
   if(set.has(r+","+c)){
     x.className="drag-cell";
     x.style.background=colors[ids.indexOf(selected)];
   }else{
     x.style.width="25px";x.style.height="25px";
   }
   g.appendChild(x);
 }
 dragVisual.appendChild(g);
}
function moveDragVisual(x,y){
 dragVisual.style.left=x+"px";
 dragVisual.style.top=y+"px";
}
function targetFromPointer(x,y){
 const rect=board.getBoundingClientRect(),cell=rect.width/8,b=bounds(pieces[selected].shape);
 const liftedY=y-cell*.85;
 const c=Math.floor((x-rect.left)/cell)-Math.floor((b.w-1)/2);
 const r=Math.floor((liftedY-rect.top)/cell)-Math.floor((b.h-1)/2);
 return {r,c};
}
function pointerNearBoard(x,y){
 const r=board.getBoundingClientRect(),pad=34;
 return x>=r.left-pad&&x<=r.right+pad&&y>=r.top-pad&&y<=r.bottom+pad;
}
function placementAnchor(cells){
 return {r:Math.min(...cells.map(a=>a[0])),c:Math.min(...cells.map(a=>a[1]))};
}
const boardKeys=[];
for(let r=0;r<8;r++)for(let c=0;c<8;c++)boardKeys.push(r+","+c);

function uniqueOrients(shape){
 const seen=new Map();
 let a=norm(shape);
 for(let f=0;f<2;f++){
   let t=f?flip(a):a;
   for(let i=0;i<4;i++){
     const n=norm(t),k=n.map(x=>x.join(",")).join(";");
     if(!seen.has(k))seen.set(k,n);
     t=rot(t);
   }
 }
 return [...seen.values()];
}
const hintPlacements={},hintByCell={};
boardKeys.forEach(k=>hintByCell[k]=[]);
ids.forEach(id=>{
 hintPlacements[id]=[];
 uniqueOrients(defs[id]).forEach(shape=>{
   const b=bounds(shape);
   for(let r0=0;r0<=8-b.h;r0++)for(let c0=0;c0<=8-b.w;c0++){
     const cells=shape.map(([r,c])=>[r0+r,c0+c]);
     const p={id,cells,keys:cells.map(([r,c])=>r+","+c)};
     hintPlacements[id].push(p);
     p.keys.forEach(k=>hintByCell[k].push(p));
   }
 });
});


const SOLUTIONS=Array.isArray(window.BOON_SOLUTIONS)?window.BOON_SOLUTIONS:[];
const SOLUTION_TOTAL=Number(window.BOON_SOLUTION_COUNT||SOLUTIONS.length||0);
const pieceIndex=Object.fromEntries(ids.map((id,i)=>[id,i]));
const pieceChars=ids.map(id=>id==="CORE"?"O":id);
const charToPiece={F:0,I:1,L:2,P:3,N:4,T:5,U:6,V:7,W:8,X:9,Y:10,Z:11,O:12};
const dbLo=ids.map(()=>new Uint32Array(SOLUTIONS.length));
const dbHi=ids.map(()=>new Uint32Array(SOLUTIONS.length));

for(let s=0;s<SOLUTIONS.length;s++){
 const row=SOLUTIONS[s];
 for(let i=0;i<64;i++){
   const pi=charToPiece[row[i]];
   if(pi===undefined)continue;
   if(i<32)dbLo[pi][s]=(dbLo[pi][s]|(1<<i))>>>0;
   else dbHi[pi][s]=(dbHi[pi][s]|(1<<(i-32)))>>>0;
 }
}

const INV_T=[0,3,2,1,4,5,6,7];
function transformIndex(i,t){
 const r=Math.floor(i/8),c=i%8;
 let nr=r,nc=c;
 if(t===1){nr=c;nc=7-r;}
 else if(t===2){nr=7-r;nc=7-c;}
 else if(t===3){nr=7-c;nc=r;}
 else if(t===4){nr=r;nc=7-c;}
 else if(t===5){nr=7-r;nc=c;}
 else if(t===6){nr=c;nc=r;}
 else if(t===7){nr=7-c;nc=7-r;}
 return nr*8+nc;
}
function cellsToMask(cells,t=0){
 let lo=0,hi=0;
 for(const [r,c] of cells){
   const x=transformIndex(r*8+c,t);
   if(x<32)lo=(lo|(1<<x))>>>0;
   else hi=(hi|(1<<(x-32)))>>>0;
 }
 return [lo>>>0,hi>>>0];
}
function fixedMaskTable(fixedIds){
 const table={};
 for(const id of fixedIds){
   table[id]=[];
   for(let t=0;t<8;t++)table[id][t]=cellsToMask(pieces[id].placed,INV_T[t]);
 }
 return table;
}
function variantMatches(s,t,fixedIds,table){
 for(const id of fixedIds){
   const pi=pieceIndex[id],m=table[id][t];
   if(dbLo[pi][s]!==m[0]||dbHi[pi][s]!==m[1])return false;
 }
 return true;
}
function matchingVariants(fixedIds){
 if(!SOLUTIONS.length)return {codes:[],solutionCount:0};
 const table=fixedMaskTable(fixedIds),codes=[];
 let solutionCount=0;
 for(let s=0;s<SOLUTIONS.length;s++){
   let any=false;
   for(let t=0;t<8;t++){
     if(variantMatches(s,t,fixedIds,table)){
       codes.push((s<<3)|t);
       any=true;
     }
   }
   if(any)solutionCount++;
 }
 return {codes,solutionCount};
}
function variantPieceCells(code,id){
 const s=code>>3,t=code&7,pi=pieceIndex[id],out=[];
 let lo=dbLo[pi][s]>>>0,hi=dbHi[pi][s]>>>0;
 for(let b=0;b<32;b++)if(((lo>>>b)&1)===1){
   const x=transformIndex(b,t);out.push([Math.floor(x/8),x%8]);
 }
 for(let b=0;b<32;b++)if(((hi>>>b)&1)===1){
   const x=transformIndex(b+32,t);out.push([Math.floor(x/8),x%8]);
 }
 out.sort((a,b)=>a[0]-b[0]||a[1]-b[1]);
 return out;
}
function cellsKey(cells){return cells.map(([r,c])=>r*8+c).sort((a,b)=>a-b).join(",");}
function placementDistribution(codes,id){
 const map=new Map(),heat=new Uint32Array(64);
 for(const code of codes){
   const cells=variantPieceCells(code,id),key=cellsKey(cells);
   let g=map.get(key);
   if(!g){g={cells,count:0};map.set(key,g);}
   g.count++;
   for(const [r,c] of cells)heat[r*8+c]++;
 }
 let best=null;
 for(const g of map.values())if(!best||g.count>best.count)best=g;
 let max=0;for(const n of heat)max=Math.max(max,n);
 const areaCells=[];
 if(max)for(let i=0;i<64;i++)if(heat[i])areaCells.push({r:Math.floor(i/8),c:i%8,score:heat[i]/max});
 return {distinct:map.size,best,areaCells};
}
function chooseNextPiece(codes,choices){
 let pick=null;
 for(const id of choices){
   const d=placementDistribution(codes,id);
   const score=[d.distinct,-(d.best?d.best.count:0)];
   if(!pick||score[0]<pick.score[0]||(score[0]===pick.score[0]&&score[1]<pick.score[1]))pick={id,d,score};
 }
 return pick;
}
function bestRepair(fixedIds){
 if(!fixedIds.length||!SOLUTIONS.length)return null;
 const table=fixedMaskTable(fixedIds);
 let bestScore=-1,groups=new Map();
 for(let s=0;s<SOLUTIONS.length;s++)for(let t=0;t<8;t++){
   const good=[],wrong=[];
   for(const id of fixedIds){
     const pi=pieceIndex[id],m=table[id][t];
     if(dbLo[pi][s]===m[0]&&dbHi[pi][s]===m[1])good.push(id);
     else wrong.push(id);
   }
   const score=good.length;
   if(score<bestScore)continue;
   if(score>bestScore){bestScore=score;groups=new Map();}
   const key=wrong.join("|");
   let g=groups.get(key);
   if(!g){g={wrongIds:wrong,keepIds:good,count:0,code:(s<<3)|t};groups.set(key,g);}
   g.count++;
 }
 let chosen=null;
 for(const g of groups.values())if(!chosen||g.count>chosen.count)chosen=g;
 if(!chosen)return null;
 const recovered=matchingVariants(chosen.keepIds);
 const focus=chooseNextPiece(recovered.codes,chosen.wrongIds);
 return {
   type:"repair",
   wrongIds:chosen.wrongIds,
   goodIds:chosen.keepIds,
   candidateCount:recovered.solutionCount,
   variantCount:recovered.codes.length,
   piece:focus?focus.id:chosen.wrongIds[0],
   areaCells:focus?focus.d.areaCells:[],
   cells:focus&&focus.d.best?focus.d.best.cells:variantPieceCells(chosen.code,chosen.wrongIds[0]),
   placementCount:focus?focus.d.distinct:1
 };
}
function buildHintPlan(){
 if(!SOLUTIONS.length)return {type:"loading"};
 const fixedIds=ids.filter(id=>pieces[id].placed&&!pieces[id].floating);
 const matched=matchingVariants(fixedIds);
 if(matched.codes.length){
   const choices=ids.filter(id=>!pieces[id].placed||pieces[id].floating);
   const focus=choices.length?chooseNextPiece(matched.codes,choices):null;
   return {
     type:"route",
     goodIds:fixedIds,
     wrongIds:[],
     candidateCount:matched.solutionCount,
     variantCount:matched.codes.length,
     piece:focus?focus.id:null,
     areaCells:focus?focus.d.areaCells:[],
     cells:focus&&focus.d.best?focus.d.best.cells:null,
     placementCount:focus?focus.d.distinct:0
   };
 }
 return bestRepair(fixedIds)||{type:"none"};
}
function resetHintPlan(){
 hintStage=0;
 hintPlan=null;
}
function useHint(){
 if(!SOLUTIONS.length){
   setMsg("HINT：16,146解DBを読み込めませんでした","bad");
   haptic(18);
   return;
 }
 if(hintStage===0||hintStage>=3||!hintPlan){
   hintPlan=buildHintPlan();
   hintStage=0;
 }
 if(!hintPlan||hintPlan.type==="none"){
   setMsg("HINT：正解ルートを特定できませんでした","bad");
   haptic(18);
   return;
 }
 hintCount++;
 hintCountEl.textContent=hintCount;
 hintStage++;
 renderAll();

 if(hintPlan.type==="repair"){
   const names=hintPlan.wrongIds.join("・");
   if(hintStage===1)setMsg("候補0｜赤:"+names+" → 修正後 "+hintPlan.candidateCount+"通り","bad");
   else if(hintStage===2)setMsg(hintPlan.piece+"：置き直し候補 "+hintPlan.placementCount+"パターン","ok");
   else setMsg(hintPlan.piece+"：有力な置き直し位置","ok");
 }else{
   const n=hintPlan.candidateCount.toLocaleString("ja-JP");
   if(hintStage===1){
     setMsg("候補 "+n+"/"+SOLUTION_TOTAL.toLocaleString("ja-JP")+"｜シアン=OK"+(hintPlan.piece?"｜次 "+hintPlan.piece:""),"ok");
   }else if(hintStage===2){
     setMsg(hintPlan.piece+"：候補エリア "+hintPlan.placementCount+"パターン","ok");
   }else{
     setMsg(hintPlan.piece+"：有力な正解位置","ok");
   }
 }
 haptic(10);
}
function transformPiece(id,kind){
 resetHintPlan();
 selected=id;
 if(id==="CORE"){
   renderAll();
   setMsg("COREは2×2のまま動かせます","ok");
   haptic();
   return;
 }
 const p=pieces[id],nextShape=kind==="rotate"?rot(p.shape):flip(p.shape);
 if(p.placed){
   const a=placementAnchor(p.placed);
   const cells=nextShape.map(([r,c])=>[a.r+r,a.c+c]);
   p.shape=nextShape;
   p.placed=cells;
   p.floating=!validFor(id,cells);
   if(!p.floating)justPlaced=id;
 }else{
   p.shape=nextShape;
 }
 target=null;
 renderAll();
 if(p.floating){
   setMsg((kind==="rotate"?"↻ 回転":"↔ 反転")+"：重なり・はみ出しは仮表示中","bad");
 }else{
   setMsg(kind==="rotate"?"↻ 回転":"↔ 反転","ok");
 }
 haptic();
}

function showHoldRing(x,y){
 holdRing.style.left=x+"px";
 holdRing.style.top=y+"px";
 holdRing.classList.remove("show");
 void holdRing.offsetWidth;
 holdRing.classList.add("show");
}
function clearLongPress(){
 if(longPressTimer){
   clearTimeout(longPressTimer);
   longPressTimer=null;
 }
 holdRing.classList.remove("show");
}
function armLongPress(id,pointerId,x,y){
 clearLongPress();
 if(!pieces[id].placed)return;
 showHoldRing(x,y);
 longPressTimer=setTimeout(()=>{
   if(!gesture||gesture.id!==id||gesture.pointerId!==pointerId||gesture.dragging)return;
   const dx=gesture.lastX-gesture.startX,dy=gesture.lastY-gesture.startY;
   if(Math.hypot(dx,dy)>LONG_PRESS_MOVE)return;
   gesture=null;
   longPressTimer=null;
   holdRing.classList.remove("show");
   returnToWait(id);
 },LONG_PRESS_MS);
}
function beginGesture(id,e){
 if(e.pointerType==="mouse"&&e.button!==0)return;
 e.preventDefault();
 selected=id;
 target=null;
 gesture={
   id,pointerId:e.pointerId,
   startX:e.clientX,startY:e.clientY,lastX:e.clientX,lastY:e.clientY,
   startTime:performance.now(),dragging:false,
   originalPlacement:pieces[id].placed?pieces[id].placed.map(a=>[...a]):null,
   originalFloating:!!pieces[id].floating
 };
 armLongPress(id,e.pointerId,e.clientX,e.clientY);
 if(pieces[id].placed)setMsg("そのまま長押しで WAIT に戻せます");
 renderTray();
}
function beginDrag(){
 if(!gesture||gesture.dragging)return;
 clearLongPress();
 resetHintPlan();
 gesture.dragging=true;
 selected=gesture.id;
 if(pieces[selected].placed)pieces[selected].placed=null;
 pieces[selected].floating=false;
 drag={id:selected,pointerId:gesture.pointerId};
 buildDragVisual();
 dragVisual.classList.add("show");
 renderAll();
 setMsg("そのまま盤面へ");
}
function updateDragTarget(x,y){
 if(!drag)return;
 moveDragVisual(x,y);
 if(pointerNearBoard(x,y)){
   target=targetFromPointer(x,y);
   renderBoard();
   setMsg(valid(ghostCells())?"ここで離すと置けます":"そこには置けません",valid(ghostCells())?"ok":"bad");
 }else{
   target=null;
   renderBoard();
 }
}
function restoreOriginal(){
 if(!gesture)return;
 if(gesture.originalPlacement)pieces[gesture.id].placed=gesture.originalPlacement.map(a=>[...a]);
 pieces[gesture.id].floating=!!gesture.originalFloating;
 target=null;
 drag=null;
 dragVisual.classList.remove("show");
}
function returnToWait(id){
 resetHintPlan();
 pieces[id].placed=null;
 pieces[id].floating=false;
 selected=id;
 target=null;
 drag=null;
 dragVisual.classList.remove("show");
 renderAll();
 setMsg(id+" を WAIT に戻しました","ok");
 haptic(16);
}
function lockSelected(){
 resetHintPlan();
 const cells=ghostCells();
 if(!valid(cells))return false;
 startClock();
 const lockedId=selected;
 pieces[lockedId].placed=cells.map(a=>[...a]);
 pieces[lockedId].floating=false;
 justPlaced=lockedId;
 moves++;movesEl.textContent=moves;
 const next=ids.find(id=>!pieces[id].placed);
 target=null;
 if(next)selected=next;
 drag=null;
 dragVisual.classList.remove("show");
 renderAll();
 setMsg("カチッ！","ok");
 haptic(18);
 if(ids.every(id=>pieces[id].placed&&!pieces[id].floating)){
   clearInterval(timer);timeEl.textContent=fmt(Date.now()-start);
   clearText.textContent="TIME "+timeEl.textContent+" / MOVE "+moves+" / HINT "+hintCount;
   board.classList.add("clear-pulse");
   haptic(35);
   setTimeout(()=>overlay.classList.add("show"),620);
 }
 return true;
}
function finishGesture(e){
 if(!gesture||e.pointerId!==gesture.pointerId)return;
 clearLongPress();
 const g=gesture;
 const dx=e.clientX-g.startX,dy=e.clientY-g.startY;
 const ax=Math.abs(dx),ay=Math.abs(dy),dist=Math.hypot(dx,dy);
 const dt=performance.now()-g.startTime;
 const isFlick=ax>=FLICK_DISTANCE&&dt<=FLICK_TIME&&ax>ay*FLICK_RATIO;

 if(isFlick){
   if(g.dragging)restoreOriginal();
   gesture=null;
   transformPiece(g.id,"flip");
   return;
 }

 if(g.dragging){
   if(target&&valid(ghostCells())){
     gesture=null;
     lockSelected();
   }else{
     restoreOriginal();
     gesture=null;
     renderAll();
     setMsg(target?"そこには置けません":"元の位置に戻しました",target?"bad":"");
   }
   return;
 }

 gesture=null;
 if(dist<=TAP_MOVE){
   transformPiece(g.id,"rotate");
 }else{
   setMsg("ドラッグで移動 / 横フリックで反転");
 }
}

function addPreviewCells(cells,id,bad=false,interactive=false){
 cells.forEach(([r,c])=>{
   const x=document.createElement("div");
   x.className="preview-cell"+(bad?" bad":"")+(interactive?" interactive":"");
   x.style.left="calc(var(--cell-size) * "+c+")";
   x.style.top="calc(var(--cell-size) * "+r+")";
   x.style.background=colors[ids.indexOf(id)];
   if(interactive)x.addEventListener("pointerdown",e=>beginGesture(id,e));
   board.appendChild(x);
 });
}
function renderBoard(){
 board.innerHTML="";
 const occ=occupied();
 for(let r=0;r<8;r++)for(let c=0;c<8;c++){
   const k=r+","+c,v=occ.get(k),b=document.createElement("button");
   b.type="button";b.className="cell";b.setAttribute("aria-label",(r+1)+"行 "+(c+1)+"列");
   if(v){
     b.classList.add("filled");b.dataset.piece=v;b.style.background=colors[ids.indexOf(v)];
     if(v==="CORE")b.classList.add("core");
     if(v===justPlaced)b.classList.add("confirm-pop");
     if(hintPlan&&hintStage>=1){
       if(hintPlan.goodIds&&hintPlan.goodIds.includes(v))b.classList.add("hint-good");
       if(hintPlan.wrongIds&&hintPlan.wrongIds.includes(v)&&!(hintStage>=2&&v===hintPlan.piece))b.classList.add("hint-bad");
       if(hintStage>=2&&v===hintPlan.piece)b.classList.add("hint-focus");
     }
   }
   b.addEventListener("pointerdown",e=>{
     if(v)beginGesture(v,e);
   });
   board.appendChild(b);
 }
 const cp=pieces.CORE;
 if(cp.placed&&!cp.floating){
   const a=placementAnchor(cp.placed);
   const core=document.createElement("div");
   core.className="core-device";
   if(hintPlan&&hintStage>=1){
     if(hintPlan.goodIds&&hintPlan.goodIds.includes("CORE"))core.classList.add("hint-good");
     if(hintPlan.wrongIds&&hintPlan.wrongIds.includes("CORE")&&!(hintStage>=2&&hintPlan.piece==="CORE"))core.classList.add("hint-bad");
     if(hintStage>=2&&hintPlan.piece==="CORE")core.classList.add("hint-focus");
   }
   core.style.left="calc(var(--cell-size) * "+a.c+")";
   core.style.top="calc(var(--cell-size) * "+a.r+")";
   core.setAttribute("aria-label","CORE 2×2");
   core.addEventListener("pointerdown",e=>beginGesture("CORE",e));
   board.appendChild(core);
 }

 const ghost=ghostCells();
 if(ghost.length)addPreviewCells(ghost,selected,!valid(ghost),false);

 ids.forEach(id=>{
   const p=pieces[id];
   if(p.floating&&p.placed)addPreviewCells(p.placed,id,true,true);
 });

 if(hintPlan&&hintStage===2&&hintPlan.areaCells&&hintPlan.areaCells.length){
   hintPlan.areaCells.forEach(a=>{
     const x=document.createElement("div");
     x.className="hint-area-cell";
     x.style.left="calc(var(--cell-size) * "+a.c+")";
     x.style.top="calc(var(--cell-size) * "+a.r+")";
     x.style.opacity=String(.16+.58*a.score);
     board.appendChild(x);
   });
 }
 if(hintPlan&&hintStage>=3&&hintPlan.cells&&hintPlan.piece){
   hintPlan.cells.forEach(([r,c])=>{
     const x=document.createElement("div");
     x.className="hint-cell";
     x.style.left="calc(var(--cell-size) * "+c+")";
     x.style.top="calc(var(--cell-size) * "+r+")";
     x.style.background=colors[ids.indexOf(hintPlan.piece)];
     board.appendChild(x);
   });
 }

 if(justPlaced)setTimeout(()=>{justPlaced=null;},260);
}
function renderTray(){
 tray.innerHTML="";
 ids.forEach((id,i)=>{
   const b=document.createElement("button");
   b.type="button";b.className="piece";
   if(id===selected)b.classList.add("selected");
   if(hintPlan&&hintStage>=1){
     if(hintPlan.goodIds&&hintPlan.goodIds.includes(id))b.classList.add("hint-good");
     if(hintPlan.wrongIds&&hintPlan.wrongIds.includes(id)&&!(hintStage>=2&&id===hintPlan.piece))b.classList.add("hint-bad");
     if(id===hintPlan.piece)b.classList.add("hint-focus");
   }
   if(pieces[id].placed&&!pieces[id].floating)b.classList.add("placed");
   if(pieces[id].floating)b.classList.add("selected");
   const n=document.createElement("span");n.className="piece-name";n.textContent=id==="CORE"?"CORE":id;
   const m=mini(pieces[id].shape);m.querySelectorAll(".mcell").forEach(x=>x.style.background=colors[i]);
   b.append(n,m);
   b.addEventListener("pointerdown",e=>beginGesture(id,e));
   tray.appendChild(b);
 });
 countEl.textContent=ids.filter(id=>pieces[id].placed&&!pieces[id].floating).length;
}
function renderAll(){renderBoard();renderTray();requestAnimationFrame(sizeBoard);}

window.addEventListener("pointermove",e=>{
 if(!gesture||e.pointerId!==gesture.pointerId)return;
 e.preventDefault();
 gesture.lastX=e.clientX;gesture.lastY=e.clientY;
 const dx=e.clientX-gesture.startX,dy=e.clientY-gesture.startY;
 const dist=Math.hypot(dx,dy);
 if(dist>LONG_PRESS_MOVE)clearLongPress();
 if(!gesture.dragging&&dist>=DRAG_START)beginDrag();
 if(gesture.dragging)updateDragTarget(e.clientX,e.clientY);
},{passive:false});

window.addEventListener("pointerup",finishGesture);
window.addEventListener("pointercancel",e=>{
 if(!gesture||e.pointerId!==gesture.pointerId)return;
 clearLongPress();
 if(gesture.dragging)restoreOriginal();
 gesture=null;
 renderAll();
 setMsg("操作をキャンセルしました");
});

function reset(){
 clearInterval(timer);
 clearLongPress();
 start=0;timer=0;moves=0;
 movesEl.textContent="0";timeEl.textContent="00:00";
 ids.forEach(id=>{pieces[id].shape=norm(defs[id]);pieces[id].placed=null;pieces[id].floating=false;});
 pieces.CORE.placed=[[3,3],[3,4],[4,3],[4,4]];
 selected="F";target=null;gesture=null;drag=null;justPlaced=null;
 hintCount=0;hintCountEl.textContent="0";resetHintPlan();
 holdRing.classList.remove("show");
 dragVisual.classList.remove("show");
 overlay.classList.remove("show");
 board.classList.remove("clear-pulse");
 setMsg("タップ=回転 / 横フリック=反転 / ドラッグ=移動 / 長押し=WAIT");
 renderAll();
}
$("#hint").addEventListener("click",useHint);
$("#reset").addEventListener("click",reset);
$("#again").addEventListener("click",reset);

renderAll();
requestAnimationFrame(sizeBoard);
setMsg(SOLUTION_TOTAL.toLocaleString("ja-JP")+"解DB READY / 長押し=WAIT");
})();
