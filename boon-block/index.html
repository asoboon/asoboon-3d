<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0b1020">\n<meta name="apple-mobile-web-app-capable" content="yes">\n<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">\n<meta name="format-detection" content="telephone=no">
<title>BOON BLOCK</title>
<style>
:root{
  --bg:#0b1020;--panel:#141b31;--panel2:#1b2542;--line:#33415f;--text:#f7f9ff;--muted:#9daccc;
  --accent:#7be0ff;--danger:#ff6f91;--ok:#68e0a8;
  --c0:#65d3ff;--c1:#ff9f68;--c2:#b896ff;--c3:#70df9c;--c4:#ffd166;--c5:#ff75b5;
  --c6:#5ec8c8;--c7:#ff7d7d;--c8:#9ad95c;--c9:#c89cff;--c10:#f0b36e;--c11:#7aa8ff;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{min-height:100%;overscroll-behavior:none}
button{font:inherit;color:inherit}
.app{max-width:720px;margin:0 auto;padding:calc(12px + env(safe-area-inset-top)) 12px calc(18px + env(safe-area-inset-bottom))}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:10px}
.brand{font-weight:900;letter-spacing:.08em;font-size:19px}
.sub{font-size:12px;color:var(--muted);margin-top:3px}
.stats{display:grid;grid-template-columns:repeat(2,auto);gap:6px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:5px 8px;text-align:center;min-width:58px}
.stat b{display:block;font-size:15px}.stat span{display:block;color:var(--muted);font-size:10px;margin-top:1px}
.board-wrap{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:10px}
.board{display:grid;grid-template-columns:repeat(8,1fr);aspect-ratio:1;width:100%;overflow:hidden;border-radius:12px;border:1px solid var(--line);background:#0f162a;touch-action:manipulation}
.cell{position:relative;border:0;border-right:1px solid rgba(255,255,255,.08);border-bottom:1px solid rgba(255,255,255,.08);background:#11192e;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:900;padding:0}
.cell:nth-child(8n){border-right:0}
.cell.core{background:linear-gradient(135deg,#e7efff,#8aa0cc);color:#071020}
.cell.core::after{content:"◆";font-size:16px}
.cell.filled::after,.cell.ghost::after{content:attr(data-piece);color:#071020}
.cell.ghost{opacity:.48;outline:2px dashed rgba(255,255,255,.85);outline-offset:-2px}
.cell.ghost.bad{background:var(--danger)!important;opacity:.42}
.msg{min-height:18px;margin:5px 2px 0;color:var(--muted);font-size:12px;text-align:center}
.msg.ok{color:var(--ok)}.msg.bad{color:var(--danger)}
.selected-card{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:10px;padding:10px 12px;border:1px solid var(--line);background:var(--panel);border-radius:14px}
.sel-title{font-size:12px;color:var(--muted)}.sel-name{font-size:22px;font-weight:900;line-height:1.1}
.preview{min-width:76px;min-height:54px;display:flex;align-items:center;justify-content:center}
.mini{display:grid;gap:2px}.mcell{width:10px;height:10px;border-radius:2px;background:#8090ae}
.preview .mcell{width:18px;height:18px;border-radius:4px;background:var(--accent)}
.control{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.control button,.reset{min-height:48px;border:1px solid var(--line);border-radius:13px;background:var(--panel2);font-weight:800}
.place{grid-column:1/-1;background:var(--accent)!important;border-color:var(--accent)!important;color:#06111a!important;font-size:16px}
.place:disabled{opacity:.35}
.control button:active,.reset:active,.piece:active{transform:scale(.98)}
.tray-head{display:flex;justify-content:space-between;align-items:center;margin:10px 2px 5px;font-size:12px}
.tray-head strong{letter-spacing:.06em}.tray-head span{color:var(--muted)}
.tray{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.piece{min-height:68px;border:1px solid var(--line);border-radius:13px;background:var(--panel);padding:7px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.piece.selected{outline:3px solid var(--accent);outline-offset:1px}.piece.placed{opacity:.36}
.piece-name{font-weight:900;font-size:12px}.bottom{display:flex;gap:8px;margin-top:10px}.reset{width:100%}
.note{font-size:11px;color:var(--muted);text-align:center;line-height:1.55;margin:10px 4px 0}
.overlay{position:fixed;inset:0;background:rgba(5,8,18,.78);display:none;align-items:center;justify-content:center;padding:24px;z-index:20}
.overlay.show{display:flex}
.clear-card{width:min(360px,100%);background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:24px;text-align:center}
.clear-card h2{margin:0;font-size:34px;letter-spacing:.08em}.clear-card p{color:var(--muted);line-height:1.6}
.clear-card button{width:100%;min-height:50px;border:0;border-radius:14px;background:var(--accent);color:#06111a;font-weight:900}
@media (max-width:360px){.app{padding-left:7px;padding-right:7px}.brand{font-size:15px}.sub{display:none}.stat{min-width:52px;padding:4px 6px}.control{gap:4px}.control button{font-size:13px}.piece{min-height:50px}.mini{gap:1px}.mcell{width:8px;height:8px}}\n@media (orientation:landscape) and (max-height:520px){.app{max-width:820px}.top{margin-bottom:5px}.board-wrap{width:52%;float:left}.selected-card,.control,.tray-head,.tray,.bottom,.note{margin-left:54%}.selected-card{margin-top:0}.tray{grid-template-columns:repeat(6,1fr)}}
</style>
</head>
<body>
<main class="app">
  <header class="top">
    <div><div class="brand">BOON BLOCK</div><div class="sub">12ピースを8×8にぴったり格納</div></div>
    <div class="stats">
      <div class="stat"><b id="time">00:00</b><span>TIME</span></div>
      <div class="stat"><b id="moves">0</b><span>MOVE</span></div>
    </div>
  </header>

  <section class="board-wrap">
    <div id="board" class="board" aria-label="8×8パズル盤"></div>
    <div id="msg" class="msg">ピースを選び、置きたい位置をタップ</div>
  </section>

  <section class="selected-card">
    <div><div class="sel-title">SELECTED</div><div id="selName" class="sel-name">F</div></div>
    <div id="preview" class="preview"></div>
  </section>

  <section class="control">
    <button id="rotate" type="button">↻ 回転</button>
    <button id="flip" type="button">↔ 反転</button>
    <button id="place" type="button" class="place" disabled>ここに置く</button>
  </section>

  <div class="tray-head"><strong>PIECES</strong><span><b id="count">0</b> / 12 格納</span></div>
  <section id="tray" class="tray" aria-label="ピース一覧"></section>

  <div class="bottom"><button id="reset" type="button" class="reset">最初から</button></div>
  <p class="note">「ここに置く」を押すまでは半透明の仮置きです。盤面上の確定ピースをタップすると取り外せます。</p>
</main>

<div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="clearTitle">
  <div class="clear-card">
    <h2 id="clearTitle">CLEAR!</h2>
    <p id="clearText"></p>
    <button id="again" type="button">もう一度</button>
  </div>
</div>

<script>
(()=>{
const defs={
 F:[[0,1],[0,2],[1,0],[1,1],[2,1]],
 I:[[0,0],[1,0],[2,0],[3,0],[4,0]],
 L:[[0,0],[1,0],[2,0],[3,0],[3,1]],
 P:[[0,0],[0,1],[1,0],[1,1],[2,0]],
 N:[[0,0],[1,0],[1,1],[2,1],[3,1]],
 T:[[0,0],[0,1],[0,2],[1,1],[2,1]],
 U:[[0,0],[0,2],[1,0],[1,1],[1,2]],
 V:[[0,0],[1,0],[2,0],[2,1],[2,2]],
 W:[[0,0],[1,0],[1,1],[2,1],[2,2]],
 X:[[0,1],[1,0],[1,1],[1,2],[2,1]],
 Y:[[0,0],[1,0],[2,0],[3,0],[1,1]],
 Z:[[0,0],[0,1],[1,1],[2,1],[2,2]]
};
const ids=Object.keys(defs);
const blocked=new Set(["3,3","3,4","4,3","4,4"]);
const colors=["var(--c0)","var(--c1)","var(--c2)","var(--c3)","var(--c4)","var(--c5)","var(--c6)","var(--c7)","var(--c8)","var(--c9)","var(--c10)","var(--c11)"];
const $=s=>document.querySelector(s);
const board=$("#board"),tray=$("#tray"),msg=$("#msg"),selName=$("#selName"),preview=$("#preview"),placeBtn=$("#place");
const timeEl=$("#time"),movesEl=$("#moves"),countEl=$("#count"),overlay=$("#overlay"),clearText=$("#clearText");
const norm=s=>{const mr=Math.min(...s.map(a=>a[0])),mc=Math.min(...s.map(a=>a[1]));return s.map(([r,c])=>[r-mr,c-mc]).sort((a,b)=>a[0]-b[0]||a[1]-b[1]);};
const rot=s=>norm(s.map(([r,c])=>[c,-r]));
const flip=s=>norm(s.map(([r,c])=>[r,-c]));
const pieces={};ids.forEach(id=>pieces[id]={shape:norm(defs[id]),placed:null});
let selected="F",target=null,moves=0,start=0,timer=0;

function occupied(ignore){
 const m=new Map();blocked.forEach(k=>m.set(k,"CORE"));
 ids.forEach(id=>{if(id===ignore)return;const p=pieces[id];if(p.placed)p.placed.forEach(([r,c])=>m.set(r+","+c,id));});
 return m;
}
function ghostCells(){
 if(!selected||!target||pieces[selected].placed)return [];
 return pieces[selected].shape.map(([r,c])=>[target.r+r,target.c+c]);
}
function valid(cells){
 const occ=occupied(selected);
 return cells.length===5&&cells.every(([r,c])=>r>=0&&r<8&&c>=0&&c<8&&!occ.has(r+","+c));
}
function setMsg(t,kind=""){msg.textContent=t;msg.className="msg"+(kind?" "+kind:"");}
function fmt(ms){const s=Math.floor(ms/1000),m=Math.floor(s/60);return String(m).padStart(2,"0")+":"+String(s%60).padStart(2,"0");}
function startClock(){if(start)return;start=Date.now();timer=setInterval(()=>timeEl.textContent=fmt(Date.now()-start),500);}

function mini(shape,big=false){
 const h=Math.max(...shape.map(a=>a[0]))+1,w=Math.max(...shape.map(a=>a[1]))+1;
 const d=document.createElement("div");d.className="mini";d.style.gridTemplateColumns="repeat("+w+","+(big?18:10)+"px)";
 const set=new Set(shape.map(a=>a.join(",")));
 for(let r=0;r<h;r++)for(let c=0;c<w;c++){const x=document.createElement("span");if(set.has(r+","+c))x.className="mcell";d.appendChild(x);}
 return d;
}

function renderBoard(){
 board.innerHTML="";
 const occ=occupied(),ghost=ghostCells(),ghostSet=new Set(ghost.map(a=>a.join(","))),ghostOK=valid(ghost);
 for(let r=0;r<8;r++)for(let c=0;c<8;c++){
   const k=r+","+c,v=occ.get(k),b=document.createElement("button");
   b.type="button";b.className="cell";b.setAttribute("aria-label",(r+1)+"行 "+(c+1)+"列");
   if(v==="CORE") b.classList.add("core");
   else if(v){b.classList.add("filled");b.dataset.piece=v;b.style.background=colors[ids.indexOf(v)];}
   if(ghostSet.has(k)){b.classList.add("ghost");if(!ghostOK)b.classList.add("bad");b.dataset.piece=selected;if(ghostOK)b.style.background=colors[ids.indexOf(selected)];}
   b.addEventListener("click",()=>{
     if(v&&v!=="CORE"){
       pieces[v].placed=null;selected=v;target={r,c};moves++;movesEl.textContent=moves;setMsg(v+" を外しました");
       renderAll();return;
     }
     if(v==="CORE") return;
     target={r,c};renderBoard();updatePlace();setMsg(valid(ghostCells())?"半透明で仮置き中。「ここに置く」で確定":"そこには置けません",valid(ghostCells())?"ok":"bad");
   });
   board.appendChild(b);
 }
}

function renderTray(){
 tray.innerHTML="";
 ids.forEach((id,i)=>{
   const b=document.createElement("button");b.type="button";b.className="piece";
   if(id===selected)b.classList.add("selected");if(pieces[id].placed)b.classList.add("placed");
   const n=document.createElement("span");n.className="piece-name";n.textContent=id;
   const m=mini(defs[id]);m.querySelectorAll(".mcell").forEach(x=>x.style.background=colors[i]);
   b.append(n,m);
   b.addEventListener("click",()=>{
     if(pieces[id].placed){pieces[id].placed=null;moves++;movesEl.textContent=moves;setMsg(id+" を外しました");}
     selected=id;target=null;renderAll();
   });
   tray.appendChild(b);
 });
 countEl.textContent=ids.filter(id=>pieces[id].placed).length;
}
function renderPreview(){
 preview.innerHTML="";selName.textContent=selected;
 const m=mini(pieces[selected].shape,true);m.querySelectorAll(".mcell").forEach(x=>x.style.background=colors[ids.indexOf(selected)]);preview.appendChild(m);
}
function updatePlace(){placeBtn.disabled=!valid(ghostCells());}
function renderAll(){renderBoard();renderTray();renderPreview();updatePlace();}

$("#rotate").addEventListener("click",()=>{
 if(pieces[selected].placed)return setMsg("確定済みピースは一度外してから回転してください","bad");
 pieces[selected].shape=rot(pieces[selected].shape);renderAll();
 if(target)setMsg(valid(ghostCells())?"半透明で仮置き中。「ここに置く」で確定":"その向きでは置けません",valid(ghostCells())?"ok":"bad");
});
$("#flip").addEventListener("click",()=>{
 if(pieces[selected].placed)return setMsg("確定済みピースは一度外してから反転してください","bad");
 pieces[selected].shape=flip(pieces[selected].shape);renderAll();
 if(target)setMsg(valid(ghostCells())?"半透明で仮置き中。「ここに置く」で確定":"その向きでは置けません",valid(ghostCells())?"ok":"bad");
});
placeBtn.addEventListener("click",()=>{
 const cells=ghostCells();if(!valid(cells))return;
 startClock();pieces[selected].placed=cells.map(a=>[...a]);moves++;movesEl.textContent=moves;
 const next=ids.find(id=>!pieces[id].placed);target=null;if(next)selected=next;
 renderAll();setMsg("確定しました","ok");
 if(ids.every(id=>pieces[id].placed)){
   clearInterval(timer);timeEl.textContent=fmt(Date.now()-start);
   clearText.textContent="TIME "+timeEl.textContent+" / MOVE "+moves;
   overlay.classList.add("show");
 }
});
function reset(){
 clearInterval(timer);start=0;timer=0;moves=0;movesEl.textContent="0";timeEl.textContent="00:00";
 ids.forEach(id=>{pieces[id].shape=norm(defs[id]);pieces[id].placed=null;});
 selected="F";target=null;overlay.classList.remove("show");setMsg("ピースを選び、置きたい位置をタップ");renderAll();
}
$("#reset").addEventListener("click",reset);
$("#again").addEventListener("click",reset);
renderAll();
})();
</script>
</body>
</html>
