<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0b1020">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="format-detection" content="telephone=no">
<title>BOON BLOCK</title>
<style>
:root{
  --bg:#07111f;--panel:#0f1b2d;--panel2:#17283e;--line:#29415f;--text:#f5fbff;--muted:#8ea7bf;
  --accent:#5ddcff;--accent2:#2fb7e5;--danger:#ff5e78;--ok:#58e0b4;
  --c0:linear-gradient(145deg,#78e4ff,#47c8f4);--c1:linear-gradient(145deg,#46bfe9,#248db9);
  --c2:linear-gradient(145deg,#c09aff,#9673ed);--c3:linear-gradient(145deg,#8c68e6,#6645c8);
  --c4:linear-gradient(145deg,#7be7bd,#4fce98);--c5:linear-gradient(145deg,#45bf88,#24966a);
  --c6:linear-gradient(145deg,#ffc06f,#f39743);--c7:linear-gradient(145deg,#ed8a38,#cc6425);
  --c8:linear-gradient(145deg,#ffed7c,#f5d34d);--c9:linear-gradient(145deg,#dfbd34,#b99520);
  --c10:linear-gradient(145deg,#ff96aa,#ff718d);--c11:linear-gradient(145deg,#e65d7c,#c33e62);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:
 radial-gradient(circle at 50% -10%,rgba(64,154,210,.16),transparent 34%),
 linear-gradient(180deg,#081526 0%,var(--bg) 54%,#050c17 100%);
 color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{min-height:100%;overscroll-behavior-y:contain;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;touch-action:manipulation}
.app{max-width:460px;margin:0 auto;padding:calc(8px + env(safe-area-inset-top)) 9px calc(14px + env(safe-area-inset-bottom))}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:7px}
.brand{font-weight:950;letter-spacing:.095em;font-size:17px;text-shadow:0 0 18px rgba(93,220,255,.18)}
.sub{font-size:11px;color:var(--muted);margin-top:2px}
.stats{display:grid;grid-template-columns:repeat(2,auto);gap:5px}
.stat{background:linear-gradient(180deg,rgba(23,40,62,.94),rgba(12,25,43,.94));border:1px solid rgba(88,130,170,.38);border-radius:10px;padding:5px 7px;text-align:center;min-width:56px;box-shadow:inset 0 1px 0 rgba(255,255,255,.05)}
.stat b{display:block;font-size:14px}.stat span{display:block;color:var(--muted);font-size:9px;margin-top:1px}
.board-wrap{background:linear-gradient(180deg,#122036,#0c1829);border:1px solid rgba(83,125,165,.42);border-radius:18px;padding:8px;box-shadow:inset 0 1px 0 rgba(255,255,255,.045),0 10px 28px rgba(0,0,0,.18)}
.board{
  --cell-size:40px;
  display:grid;
  grid-template-columns:repeat(8,var(--cell-size));
  grid-template-rows:repeat(8,var(--cell-size));
  width:calc(var(--cell-size) * 8);
  height:calc(var(--cell-size) * 8);
  margin:0 auto;
  overflow:hidden;
  border-radius:11px;
  border:1px solid var(--line);
  background:#091422;
  touch-action:none;
  position:relative;
  box-shadow:inset 0 0 0 1px rgba(108,164,210,.08),inset 0 8px 24px rgba(0,0,0,.25);
}
.cell{
  position:relative;
  width:var(--cell-size);height:var(--cell-size);
  min-width:var(--cell-size);min-height:var(--cell-size);
  max-width:var(--cell-size);max-height:var(--cell-size);
  border:0;border-right:1px solid rgba(116,163,201,.10);border-bottom:1px solid rgba(116,163,201,.10);
  background:rgba(15,29,48,.88);display:flex;align-items:center;justify-content:center;
  font-size:11px;font-weight:900;padding:0;touch-action:none;
  transition:filter .12s ease,opacity .12s ease,transform .12s ease;
}
.cell:nth-child(8n){border-right:0}
.cell.core{background:rgba(34,63,86,.7);border-color:rgba(93,220,255,.16)}
.cell.filled,.cell.ghost{box-shadow:inset 0 2px 0 rgba(255,255,255,.22),inset 0 -3px 6px rgba(4,12,22,.16)}
.cell.filled::after,.cell.ghost::after{content:"";position:absolute;left:18%;top:12%;width:42%;height:16%;border-radius:99px;background:rgba(255,255,255,.22);transform:rotate(-8deg)}
.cell.ghost{opacity:.48;outline:2px solid rgba(93,220,255,.9);outline-offset:-2px;filter:saturate(1.12) brightness(1.06)}
.cell.ghost.bad{background:linear-gradient(145deg,#ff788e,#dc3858)!important;outline-color:#ff90a2;opacity:.42}
.cell.confirm-pop{animation:blockLock .22s ease-out}
@keyframes blockLock{0%{transform:scale(.84);filter:brightness(1.35)}70%{transform:scale(1.05)}100%{transform:scale(1)}}
.core-device{position:absolute;z-index:5;left:calc(var(--cell-size) * 3);top:calc(var(--cell-size) * 3);width:calc(var(--cell-size) * 2);height:calc(var(--cell-size) * 2);pointer-events:none;border-radius:13px;border:1px solid rgba(158,235,255,.58);background:
 radial-gradient(circle at 50% 48%,rgba(214,249,255,.98) 0 7%,rgba(93,220,255,.78) 8% 18%,rgba(70,162,210,.25) 19% 38%,transparent 39%),
 linear-gradient(145deg,rgba(206,243,255,.22),rgba(42,116,158,.12));
 box-shadow:inset 0 0 20px rgba(93,220,255,.18),0 0 14px rgba(93,220,255,.17)}
.core-device::before,.core-device::after{content:"";position:absolute;inset:10%;border:1px solid rgba(199,244,255,.28);border-radius:10px}
.core-device::after{inset:28%;border-radius:50%;border-color:rgba(226,251,255,.62);box-shadow:0 0 10px rgba(93,220,255,.35)}
.board.clear-pulse .core-device{animation:coreClear .65s ease-out}
.board.clear-pulse .cell.filled{animation:boardCelebrate .45s ease-out}
@keyframes coreClear{0%{filter:brightness(1);transform:scale(1)}45%{filter:brightness(2.2);transform:scale(1.08);box-shadow:0 0 38px rgba(93,220,255,.75)}100%{filter:brightness(1);transform:scale(1)}}
@keyframes boardCelebrate{0%,100%{filter:brightness(1)}50%{filter:brightness(1.28)}}
.msg{min-height:18px;margin:5px 2px 0;color:var(--muted);font-size:12px;text-align:center}
.msg.ok{color:var(--ok)}.msg.bad{color:var(--danger)}
.selected-card{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:7px;padding:7px 10px;border:1px solid rgba(83,125,165,.38);background:linear-gradient(180deg,#122139,#0d1a2c);border-radius:12px;box-shadow:inset 0 1px 0 rgba(255,255,255,.035)}
.sel-title{font-size:10px;color:var(--muted)}.sel-name{font-size:19px;font-weight:900;line-height:1.05}
.preview{min-width:68px;min-height:42px;display:flex;align-items:center;justify-content:center}
.mini{display:grid;gap:2px}.mcell{width:9px;height:9px;border-radius:2px;background:#8090ae}
.preview .mcell{width:14px;height:14px;border-radius:3px;background:var(--accent)}
.reset{min-height:48px;border:1px solid rgba(83,125,165,.5);border-radius:12px;background:linear-gradient(180deg,#203652,#15263d);font-weight:850;box-shadow:inset 0 1px 0 rgba(255,255,255,.06)}
.reset:active,.piece:active{transform:scale(.98)}
.gesture-guide{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-top:7px}
.gesture-chip{border:1px solid rgba(83,125,165,.34);background:rgba(13,27,46,.72);border-radius:10px;padding:6px 4px;text-align:center;font-size:10px;color:var(--muted)}
.gesture-chip b{display:block;color:var(--text);font-size:12px;margin-bottom:1px}
.tray-head{display:flex;justify-content:space-between;align-items:center;margin:10px 2px 5px;font-size:12px}
.tray-head strong{letter-spacing:.06em}.tray-head span{color:var(--muted)}
.tray{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px}
.piece{
  min-height:54px;border:1px solid rgba(83,125,165,.38);border-radius:11px;background:linear-gradient(180deg,#122039,#0d192b);
  padding:4px 2px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  touch-action:none;
}
.piece.selected{outline:2px solid var(--accent);outline-offset:1px;box-shadow:0 0 14px rgba(93,220,255,.18)}.piece.placed{opacity:.28;filter:saturate(.6)}
.piece-name{font-weight:900;font-size:11px}
.bottom{display:flex;gap:8px;margin-top:7px}.reset{width:100%}
.note{font-size:10px;color:var(--muted);text-align:center;line-height:1.45;margin:7px 4px 0}
.drag-visual{
  position:fixed;left:0;top:0;z-index:30;pointer-events:none;display:none;
  filter:drop-shadow(0 12px 14px rgba(0,0,0,.42)) drop-shadow(0 0 10px rgba(93,220,255,.16));opacity:.94;
  transform:translate(-50%,-115%);
}
.drag-visual.show{display:block}
.drag-grid{display:grid;gap:2px}
.drag-cell{width:25px;height:25px;border-radius:6px;border:1px solid rgba(255,255,255,.5);box-shadow:inset 0 2px 0 rgba(255,255,255,.2),inset 0 -3px 5px rgba(0,0,0,.15)}
.overlay{position:fixed;inset:0;background:rgba(5,8,18,.78);display:none;align-items:center;justify-content:center;padding:24px;z-index:40}
.overlay.show{display:flex}
.clear-card{width:min(360px,100%);background:linear-gradient(180deg,#14253f,#0b1728);border:1px solid rgba(113,184,225,.42);border-radius:24px;padding:24px;text-align:center;box-shadow:0 18px 60px rgba(0,0,0,.38),inset 0 1px 0 rgba(255,255,255,.05)}
.clear-card h2{margin:0;font-size:34px;letter-spacing:.08em;color:#dff9ff;text-shadow:0 0 22px rgba(93,220,255,.45)}.clear-card p{color:var(--muted);line-height:1.6}
.clear-card button{width:100%;min-height:50px;border:0;border-radius:14px;background:var(--accent);color:#06111a;font-weight:900}
@media(max-width:360px){
  .app{padding-left:7px;padding-right:7px}.brand{font-size:15px}.sub{display:none}
  .stat{min-width:50px;padding:4px 5px}.gesture-chip{font-size:9px;padding:5px 2px}.gesture-chip b{font-size:11px}
  .piece{min-height:50px}.mini{gap:1px}.mcell{width:8px;height:8px}
}
</style>
</head>
<body>
<main class="app">
  <header class="top">
    <div><div class="brand">BOON BLOCK</div><div class="sub">指でつかんで動かす 8×8 パズル</div></div>
    <div class="stats">
      <div class="stat"><b id="time">00:00</b><span>TIME</span></div>
      <div class="stat"><b id="moves">0</b><span>MOVE</span></div>
    </div>
  </header>

  <section class="board-wrap">
    <div id="board" class="board" aria-label="8×8パズル盤"></div>
    <div id="msg" class="msg">下のピースを指でつかんで盤面へ</div>
  </section>

  <section class="selected-card">
    <div><div class="sel-title">SELECTED</div><div id="selName" class="sel-name">F</div></div>
    <div id="preview" class="preview"></div>
  </section>

  <section class="gesture-guide" aria-label="操作方法">
    <div class="gesture-chip"><b>タップ ↻</b>回転</div>
    <div class="gesture-chip"><b>横フリック ↔</b>反転</div>
    <div class="gesture-chip"><b>ドラッグ</b>移動</div>
  </section>

  <div class="tray-head"><strong>PIECES</strong><span><b id="count">0</b> / 12 格納</span></div>
  <section id="tray" class="tray" aria-label="ピース一覧"></section>

  <div class="bottom"><button id="reset" type="button" class="reset">最初から</button></div>
  <p class="note">タップで回転、横フリックで反転、ドラッグで移動。置ける場所で指を離すと確定します。</p>
</main>

<div id="dragVisual" class="drag-visual" aria-hidden="true"></div>

<div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="clearTitle">
  <div class="clear-card">
    <h2 id="clearTitle">CLEAR!</h2>
    <p id="clearText"></p>
    <button id="again" type="button">もう一度</button>
  </div>
</div>

<script>
(()=>{
const defs={
 F:[[0,1],[0,2],[1,0],[1,1],[2,1]],
 I:[[0,0],[1,0],[2,0],[3,0],[4,0]],
 L:[[0,0],[1,0],[2,0],[3,0],[3,1]],
 P:[[0,0],[0,1],[1,0],[1,1],[2,0]],
 N:[[0,0],[1,0],[1,1],[2,1],[3,1]],
 T:[[0,0],[0,1],[0,2],[1,1],[2,1]],
 U:[[0,0],[0,2],[1,0],[1,1],[1,2]],
 V:[[0,0],[1,0],[2,0],[2,1],[2,2]],
 W:[[0,0],[1,0],[1,1],[2,1],[2,2]],
 X:[[0,1],[1,0],[1,1],[1,2],[2,1]],
 Y:[[0,0],[1,0],[2,0],[3,0],[1,1]],
 Z:[[0,0],[0,1],[1,1],[2,1],[2,2]]
};
const ids=Object.keys(defs);
const blocked=new Set(["3,3","3,4","4,3","4,4"]);
const colors=["var(--c0)","var(--c1)","var(--c2)","var(--c3)","var(--c4)","var(--c5)","var(--c6)","var(--c7)","var(--c8)","var(--c9)","var(--c10)","var(--c11)"];
const $=s=>document.querySelector(s);
const board=$("#board"),tray=$("#tray"),msg=$("#msg"),selName=$("#selName"),preview=$("#preview");
const timeEl=$("#time"),movesEl=$("#moves"),countEl=$("#count"),overlay=$("#overlay"),clearText=$("#clearText"),dragVisual=$("#dragVisual");

const TAP_MOVE=10;
const DRAG_START=13;
const FLICK_DISTANCE=46;
const FLICK_TIME=280;
const FLICK_RATIO=1.45;

const norm=s=>{
 const mr=Math.min(...s.map(a=>a[0])),mc=Math.min(...s.map(a=>a[1]));
 return s.map(([r,c])=>[r-mr,c-mc]).sort((a,b)=>a[0]-b[0]||a[1]-b[1]);
};
const rot=s=>norm(s.map(([r,c])=>[c,-r]));
const flip=s=>norm(s.map(([r,c])=>[r,-c]));
const pieces={};ids.forEach(id=>pieces[id]={shape:norm(defs[id]),placed:null});

let selected="F",target=null,moves=0,start=0,timer=0;
let gesture=null,drag=null,justPlaced=null;

function occupied(ignore){
 const m=new Map();blocked.forEach(k=>m.set(k,"CORE"));
 ids.forEach(id=>{
   if(id===ignore)return;
   const p=pieces[id];
   if(p.placed)p.placed.forEach(([r,c])=>m.set(r+","+c,id));
 });
 return m;
}
function validFor(id,cells){
 const occ=occupied(id);
 return cells.length===5&&cells.every(([r,c])=>r>=0&&r<8&&c>=0&&c<8&&!occ.has(r+","+c));
}
function ghostCells(){
 if(!selected||!target||pieces[selected].placed)return [];
 return pieces[selected].shape.map(([r,c])=>[target.r+r,target.c+c]);
}
function valid(cells){return validFor(selected,cells);}
function setMsg(t,kind=""){msg.textContent=t;msg.className="msg"+(kind?" "+kind:"");}
function fmt(ms){const s=Math.floor(ms/1000),m=Math.floor(s/60);return String(m).padStart(2,"0")+":"+String(s%60).padStart(2,"0");}
function startClock(){if(start)return;start=Date.now();timer=setInterval(()=>timeEl.textContent=fmt(Date.now()-start),500);}
function haptic(ms=12){if(navigator.vibrate)navigator.vibrate(ms);}

function sizeBoard(){
 const wrap=board.parentElement;
 const available=Math.max(240,Math.min(430,wrap.clientWidth-2));
 const cell=Math.max(30,Math.floor(available/8));
 board.style.setProperty("--cell-size",cell+"px");
}
window.addEventListener("resize",sizeBoard);

function bounds(shape){
 return {h:Math.max(...shape.map(a=>a[0]))+1,w:Math.max(...shape.map(a=>a[1]))+1};
}
function mini(shape,big=false){
 const b=bounds(shape),d=document.createElement("div");
 d.className="mini";d.style.gridTemplateColumns="repeat("+b.w+","+(big?14:9)+"px)";
 const set=new Set(shape.map(a=>a.join(",")));
 for(let r=0;r<b.h;r++)for(let c=0;c<b.w;c++){
   const x=document.createElement("span");
   if(set.has(r+","+c))x.className="mcell";
   d.appendChild(x);
 }
 return d;
}
function buildDragVisual(){
 dragVisual.innerHTML="";
 const shape=pieces[selected].shape,b=bounds(shape),g=document.createElement("div");
 g.className="drag-grid";g.style.gridTemplateColumns="repeat("+b.w+",25px)";
 const set=new Set(shape.map(a=>a.join(",")));
 for(let r=0;r<b.h;r++)for(let c=0;c<b.w;c++){
   const x=document.createElement("span");
   if(set.has(r+","+c)){
     x.className="drag-cell";
     x.style.background=colors[ids.indexOf(selected)];
   }else{
     x.style.width="25px";x.style.height="25px";
   }
   g.appendChild(x);
 }
 dragVisual.appendChild(g);
}
function moveDragVisual(x,y){
 dragVisual.style.left=x+"px";
 dragVisual.style.top=y+"px";
}
function targetFromPointer(x,y){
 const rect=board.getBoundingClientRect(),cell=rect.width/8,b=bounds(pieces[selected].shape);
 const liftedY=y-cell*.85;
 const c=Math.floor((x-rect.left)/cell)-Math.floor((b.w-1)/2);
 const r=Math.floor((liftedY-rect.top)/cell)-Math.floor((b.h-1)/2);
 return {r,c};
}
function pointerNearBoard(x,y){
 const r=board.getBoundingClientRect(),pad=34;
 return x>=r.left-pad&&x<=r.right+pad&&y>=r.top-pad&&y<=r.bottom+pad;
}
function placementAnchor(cells){
 return {r:Math.min(...cells.map(a=>a[0])),c:Math.min(...cells.map(a=>a[1]))};
}
function transformPiece(id,kind){
 selected=id;
 const p=pieces[id],nextShape=kind==="rotate"?rot(p.shape):flip(p.shape);
 if(p.placed){
   const a=placementAnchor(p.placed);
   const cells=nextShape.map(([r,c])=>[a.r+r,a.c+c]);
   if(!validFor(id,cells)){
     renderAll();
     setMsg(kind==="rotate"?"ここでは回せません":"ここでは反転できません","bad");
     haptic(25);
     return;
   }
   p.shape=nextShape;
   p.placed=cells;
   justPlaced=id;
 }else{
   p.shape=nextShape;
 }
 target=null;
 renderAll();
 setMsg(kind==="rotate"?"↻ 回転":"↔ 反転","ok");
 haptic();
}

function beginGesture(id,e){
 if(e.pointerType==="mouse"&&e.button!==0)return;
 e.preventDefault();
 selected=id;
 target=null;
 gesture={
   id,pointerId:e.pointerId,
   startX:e.clientX,startY:e.clientY,lastX:e.clientX,lastY:e.clientY,
   startTime:performance.now(),dragging:false,
   originalPlacement:pieces[id].placed?pieces[id].placed.map(a=>[...a]):null
 };
 renderTray();renderPreview();
}
function beginDrag(){
 if(!gesture||gesture.dragging)return;
 gesture.dragging=true;
 selected=gesture.id;
 if(pieces[selected].placed)pieces[selected].placed=null;
 drag={id:selected,pointerId:gesture.pointerId};
 buildDragVisual();
 dragVisual.classList.add("show");
 renderAll();
 setMsg("そのまま盤面へ");
}
function updateDragTarget(x,y){
 if(!drag)return;
 moveDragVisual(x,y);
 if(pointerNearBoard(x,y)){
   target=targetFromPointer(x,y);
   renderBoard();
   setMsg(valid(ghostCells())?"ここで離すと置けます":"そこには置けません",valid(ghostCells())?"ok":"bad");
 }else{
   target=null;
   renderBoard();
 }
}
function restoreOriginal(){
 if(!gesture)return;
 if(gesture.originalPlacement)pieces[gesture.id].placed=gesture.originalPlacement.map(a=>[...a]);
 target=null;
 drag=null;
 dragVisual.classList.remove("show");
}
function lockSelected(){
 const cells=ghostCells();
 if(!valid(cells))return false;
 startClock();
 const lockedId=selected;
 pieces[lockedId].placed=cells.map(a=>[...a]);
 justPlaced=lockedId;
 moves++;movesEl.textContent=moves;
 const next=ids.find(id=>!pieces[id].placed);
 target=null;
 if(next)selected=next;
 drag=null;
 dragVisual.classList.remove("show");
 renderAll();
 setMsg("カチッ！","ok");
 haptic(18);
 if(ids.every(id=>pieces[id].placed)){
   clearInterval(timer);timeEl.textContent=fmt(Date.now()-start);
   clearText.textContent="TIME "+timeEl.textContent+" / MOVE "+moves;
   board.classList.add("clear-pulse");
   haptic(35);
   setTimeout(()=>overlay.classList.add("show"),620);
 }
 return true;
}
function finishGesture(e){
 if(!gesture||e.pointerId!==gesture.pointerId)return;
 const g=gesture;
 const dx=e.clientX-g.startX,dy=e.clientY-g.startY;
 const ax=Math.abs(dx),ay=Math.abs(dy),dist=Math.hypot(dx,dy);
 const dt=performance.now()-g.startTime;
 const isFlick=ax>=FLICK_DISTANCE&&dt<=FLICK_TIME&&ax>ay*FLICK_RATIO;

 if(isFlick){
   if(g.dragging)restoreOriginal();
   gesture=null;
   transformPiece(g.id,"flip");
   return;
 }

 if(g.dragging){
   if(target&&valid(ghostCells())){
     gesture=null;
     lockSelected();
   }else{
     restoreOriginal();
     gesture=null;
     renderAll();
     setMsg(target?"そこには置けません":"元の位置に戻しました",target?"bad":"");
   }
   return;
 }

 gesture=null;
 if(dist<=TAP_MOVE){
   transformPiece(g.id,"rotate");
 }else{
   setMsg("ドラッグで移動 / 横フリックで反転");
 }
}

function renderBoard(){
 board.innerHTML="";
 const occ=occupied(),ghost=ghostCells(),ghostSet=new Set(ghost.map(a=>a.join(","))),ghostOK=valid(ghost);
 for(let r=0;r<8;r++)for(let c=0;c<8;c++){
   const k=r+","+c,v=occ.get(k),b=document.createElement("button");
   b.type="button";b.className="cell";b.setAttribute("aria-label",(r+1)+"行 "+(c+1)+"列");
   if(v==="CORE")b.classList.add("core");
   else if(v){
     b.classList.add("filled");b.dataset.piece=v;b.style.background=colors[ids.indexOf(v)];
     if(v===justPlaced)b.classList.add("confirm-pop");
   }
   if(ghostSet.has(k)){
     b.classList.add("ghost");
     if(!ghostOK)b.classList.add("bad");
     if(ghostOK)b.style.background=colors[ids.indexOf(selected)];
   }
   b.addEventListener("pointerdown",e=>{
     if(v==="CORE")return;
     if(v&&v!=="CORE")beginGesture(v,e);
   });
   board.appendChild(b);
 }
 const core=document.createElement("div");
 core.className="core-device";
 core.setAttribute("aria-hidden","true");
 board.appendChild(core);
 if(justPlaced)setTimeout(()=>{justPlaced=null;},260);
}
function renderTray(){
 tray.innerHTML="";
 ids.forEach((id,i)=>{
   const b=document.createElement("button");
   b.type="button";b.className="piece";
   if(id===selected)b.classList.add("selected");
   if(pieces[id].placed)b.classList.add("placed");
   const n=document.createElement("span");n.className="piece-name";n.textContent=id;
   const m=mini(defs[id]);m.querySelectorAll(".mcell").forEach(x=>x.style.background=colors[i]);
   b.append(n,m);
   b.addEventListener("pointerdown",e=>beginGesture(id,e));
   tray.appendChild(b);
 });
 countEl.textContent=ids.filter(id=>pieces[id].placed).length;
}
function renderPreview(){
 preview.innerHTML="";
 selName.textContent=selected;
 const m=mini(pieces[selected].shape,true);
 m.querySelectorAll(".mcell").forEach(x=>x.style.background=colors[ids.indexOf(selected)]);
 preview.appendChild(m);
}
function renderAll(){renderBoard();renderTray();renderPreview();}

window.addEventListener("pointermove",e=>{
 if(!gesture||e.pointerId!==gesture.pointerId)return;
 e.preventDefault();
 gesture.lastX=e.clientX;gesture.lastY=e.clientY;
 const dx=e.clientX-gesture.startX,dy=e.clientY-gesture.startY;
 const dist=Math.hypot(dx,dy);
 if(!gesture.dragging&&dist>=DRAG_START)beginDrag();
 if(gesture.dragging)updateDragTarget(e.clientX,e.clientY);
},{passive:false});

window.addEventListener("pointerup",finishGesture);
window.addEventListener("pointercancel",e=>{
 if(!gesture||e.pointerId!==gesture.pointerId)return;
 if(gesture.dragging)restoreOriginal();
 gesture=null;
 renderAll();
 setMsg("操作をキャンセルしました");
});

function reset(){
 clearInterval(timer);
 start=0;timer=0;moves=0;
 movesEl.textContent="0";timeEl.textContent="00:00";
 ids.forEach(id=>{pieces[id].shape=norm(defs[id]);pieces[id].placed=null;});
 selected="F";target=null;gesture=null;drag=null;justPlaced=null;
 dragVisual.classList.remove("show");
 overlay.classList.remove("show");
 board.classList.remove("clear-pulse");
 setMsg("タップ=回転 / 横フリック=反転 / ドラッグ=移動");
 renderAll();
}
$("#reset").addEventListener("click",reset);
$("#again").addEventListener("click",reset);

sizeBoard();
renderAll();
setMsg("タップ=回転 / 横フリック=反転 / ドラッグ=移動");
})();
</script>
</body>
</html>
